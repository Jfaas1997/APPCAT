<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1216">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="App de Obra">
<title>App de Obra</title>
<style>
:root{color-scheme:dark;--bg:#0F1216;--card:#181C22;--rule:#2A303A;--line:#5A616C;--text:#E8EAED;--muted:#9AA1AC;--brand:#F9D115;--orange:#FF8A4C;--amber:#FFB27A;--ok:#4FD1B5;--r:12px;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
body.sem-nav{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--brand)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 6px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .cc{background:var(--brand);color:#0F1216;font:600 12px var(--mono);padding:3px 7px;border-radius:5px}
header button{background:transparent;border:0;color:var(--text);font-size:22px;line-height:1;padding:6px 10px;border-radius:8px;min-height:44px}
main{padding:20px 20px 16px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .logo{display:flex;align-items:center;gap:10px;flex:1;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.top .ic{background:transparent;border:0;color:var(--text);font-size:24px;padding:0 8px}
.t1{margin:0;font-size:30px;line-height:1.1;font-weight:700}
.sub{margin-top:6px;font-size:14px;color:var(--muted)}
.mono{font-family:var(--mono)}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--muted);background:transparent;border:0;padding:0;margin-bottom:6px}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:20px 2px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.y{border-color:var(--brand)}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
::placeholder{color:#6d7480}
button{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:0 14px}
button.pri{background:var(--brand);border-color:var(--brand);color:#0F1216;font-weight:700}
button.big{width:100%;min-height:54px;font-size:16px;margin-bottom:10px;border-radius:10px}
button.lk{border:0;background:transparent;color:var(--muted);text-decoration:underline;min-height:36px;padding:0 6px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.row>input{flex:1;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:14px;background:transparent;color:var(--text)}
.chip.on,button.chip.on{background:#3A3310;border-color:var(--brand)}
.chip button{min-height:0;border:0;background:transparent;padding:0 2px;font-size:18px;line-height:1;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid}
.tag.r{color:var(--amber);border-color:var(--orange)}.tag.e{color:var(--ok);border-color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--amber);padding:6px 12px;border:1px solid var(--orange);border-radius:999px;margin:12px 0}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pul 2s infinite}
@keyframes pul{0%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600}.item .t span{display:block;font-size:13px;color:var(--muted)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fotos .f{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#1d2229}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .f button{position:absolute;top:4px;right:4px;min-height:0;width:26px;height:26px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;padding:0;font-size:16px}
.fotos .f .tg{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));font:10px/1.2 var(--mono);color:var(--text)}
.fotos .f .st{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;color:#0F1216;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);padding:12px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.bar button{flex:1;min-height:52px;border-radius:10px;font-weight:600}
.bar button.pri{flex:2}
.hint{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:var(--text);color:#0F1216;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:90vw}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ovl .sh{background:var(--card);border:1px solid var(--rule);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.ovl h3{margin:0 0 6px;font-size:17px}
.ro{opacity:.85}
[hidden]{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;min-height:108px;text-align:left;padding:14px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);line-height:1.25;color:var(--text)}
.tile b{font-weight:600}.tile span{font-size:12px;color:var(--muted)}
.tile.y{border-color:var(--brand)}.tile.y span{color:var(--brand)}
.tile:disabled{opacity:.5}
.dia{font-size:13px;font-weight:600;margin:16px 2px 6px;display:flex;gap:8px;align-items:center}
.dia.hoje{color:var(--brand)}
.int{padding:10px 4px;border-bottom:1px solid var(--rule)}.int:last-child{border-bottom:0}
.int b{display:block}.int span{display:block;font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.nav b{flex:1;text-align:center}
.nav button{width:48px;padding:0;font-size:22px}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:10px 2px}
.box{background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.box .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.box.y{background:var(--card);border:1px solid var(--brand)}.box.y .k{color:var(--brand)}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.chk i{margin-top:3px;flex:none;width:18px;height:18px;border:2px solid var(--line);border-radius:4px}
.chk small{display:block;font-size:13px;color:var(--muted)}
.fe{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.fe:last-of-type{border-bottom:0}
.fe input.n{flex:1 1 100%;min-width:0;min-height:40px;padding:4px 0;border-color:transparent;background:transparent;font-size:15px}
.fe .sp{flex:1}
.fe button.m{width:44px;height:44px;padding:0;font-size:20px;background:var(--bg);border-color:var(--rule)}
.fe input.q{width:64px;text-align:center;font:18px var(--mono);padding:4px;min-height:44px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.nv button{flex:1;min-height:64px;border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);background:transparent;padding:0}
.nv button.on{color:var(--brand)}
.stk{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));padding-top:8px}
</style>
</head>
<body>
<header>
  <button id="hBack" hidden aria-label="Voltar">‹</button>
  <span class="cc" id="hCC" hidden></span>
  <h1 id="hT">App de Obra</h1>
  <button id="hMenu" aria-label="Menu">⋯</button>
</header>
<main id="m"></main>
<div class="bar" id="bar" hidden></div>
<nav class="nv" id="nv" aria-label="Navegação" hidden></nav>
<input type="file" id="fPac" accept=".json,application/json" hidden>
<input type="file" id="fFoto" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="fGal" accept="image/*" multiple hidden>

<script>
'use strict';
const $=(s,e)=> (e||document).querySelector(s), $$=(s,e)=>[...(e||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const dataPT=iso=>{const [y,m,d]=iso.split('-');const dd=new Date(+y,+m-1,+d);return ['dom','seg','ter','qua','qui','sex','sáb'][dd.getDay()]+' '+d+'/'+m+'/'+y};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- armazenamento (IndexedDB) ---------- */
let _db=null;
function idb(){ return _db||(_db=new Promise((ok,ko)=>{ const r=indexedDB.open('appobra',1);
  r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('kv'); d.createObjectStore('partes',{keyPath:'id'}); d.createObjectStore('fotos',{keyPath:'id'}) };
  r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error) })) }
async function tx(loja,modo,fn){ const d=await idb(); return new Promise((ok,ko)=>{ const t=d.transaction(loja,modo); const r=fn(t.objectStore(loja)); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>ko(t.error) }) }
const kvGet=k=>tx('kv','readonly',s=>s.get(k)), kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const pGet=id=>tx('partes','readonly',s=>s.get(id)), pAll=()=>tx('partes','readonly',s=>s.getAll()), pPut=p=>tx('partes','readwrite',s=>s.put(p)), pDel=id=>tx('partes','readwrite',s=>s.delete(id));
const fGet=id=>tx('fotos','readonly',s=>s.get(id)), fPut=f=>tx('fotos','readwrite',s=>s.put(f)), fDel=id=>tx('fotos','readwrite',s=>s.delete(id));

/* ---------- estado ---------- */
let NOME='';
let PAC=null;          /* pacote da obra (do PC): {cc,nome,estruturas[],os[],...} */
let P=null;            /* parte aberta */
let vista='inicio', ant='inicio', planoDia=hojeISO();
let saveT=null;

function toast(t,ms){ let e=$('.toast'); if(e)e.remove(); e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),ms||2600) }
function sheet(html,fn){ const o=document.createElement('div'); o.className='ovl'; o.innerHTML='<div class="sh">'+html+'</div>'; document.body.appendChild(o);
  const fecha=v=>{ o.remove(); return v }; o.addEventListener('mousedown',e=>{ if(e.target===o)fecha() }); fn(o,fecha); return o }

/* ---------- pacote da obra ---------- */
function validaPacote(j){ return j&&j.tipo==='obra-pacote'&&j.cc&&j.nome }
async function importaPacote(file){
  try{ const j=JSON.parse(await file.text()); if(!validaPacote(j)){ toast('Este ficheiro não é um pacote de obra.',4000); return }
    PAC={cc:String(j.cc),nome:j.nome,estruturas:(j.estruturas||[]).map(String),os:j.os||[],ints:j.ints||[],plano:j.plano||[],docs:j.docs||[],trabalhos:j.trabalhos||[],pecas:j.pecas||[],criado:j.criado||''};
    await kvSet('pacote',PAC); toast('Obra '+PAC.cc+' carregada.'); render() }
  catch(e){ toast('Não consegui ler o ficheiro.',4000) } }
function semPacote(){ return !PAC }

/* ---------- partes ---------- */
function novaParte(){
  const agora=new Date();
  return {id:uid(),v:1,cc:PAC?PAC.cc:'',obra:PAC?PAC.nome:'',estado:'rascunho',dia:hojeISO(),criada:agora.toISOString(),hora:hhmm(agora),
    os:'',trabalho:'',trabalhador:NOME,equipa:'',pkI:'',pkF:'',pessoas:'',equip:[],feito:[],estruturas:[],descricao:'',avulsos:[],semRub:[],fotos:[]} }
async function abrePartaDeHoje(){
  const todas=(await pAll()).filter(p=>p.estado==='rascunho'&&p.dia===hojeISO()&&p.cc===(PAC?PAC.cc:''));
  if(todas.length){ P=todas.sort((a,b)=>a.criada<b.criada?1:-1)[0] } else { P=novaParte(); await pPut(P) }
  vista='parte'; render() }
function guardaSoon(){ clearTimeout(saveT); saveT=setTimeout(guardaJa,500) }
async function guardaJa(){ clearTimeout(saveT); if(!P||P.estado!=='rascunho')return; P.atualizada=new Date().toISOString(); await pPut(P); const e=$('#sv'); if(e)e.textContent='Guardado '+hhmm(new Date()) }

/* ---------- fotos ---------- */
function reduz(file,max,q){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ let w=im.naturalWidth,h=im.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg',q)) };
  im.onerror=()=>{ URL.revokeObjectURL(u); ko(new Error('imagem')) }; im.src=u }) }
async function addFotos(files){
  if(!P){ await abrePartaDeHoje() }
  if(P.estado!=='rascunho')return;
  let n=0; for(const f of files){ try{ const d=await reduz(f,1600,.72); const id=uid(); await fPut({id,parte:P.id,d,t:new Date().toISOString()}); P.fotos.push({id,t:new Date().toISOString(),leg:''}); n++ }catch(e){} }
  await guardaJa(); if(n)toast(n+(n>1?' fotos juntas':' foto junta')+' à parte de hoje.'); render() }

/* ---------- envio ---------- */
async function montaFicheiro(p){
  const fotos=[]; for(const f of p.fotos){ const r=await fGet(f.id); if(r)fotos.push({id:f.id,t:f.t,leg:f.leg||'',d:r.d}) }
  const corpo=Object.assign({},p,{fotos:undefined}); delete corpo.fotos;
  const j={tipo:'parte-diaria',app:'obra-v1',parte:Object.assign({},corpo,{fotos:p.fotos.map(f=>({id:f.id,t:f.t,leg:f.leg||''}))}),fotos:fotos,enviada:new Date().toISOString()};
  const nome='parte_'+(p.cc||'sem-obra')+'_'+p.dia+'_'+p.hora.replace(':','')+'_'+p.id.slice(-4)+'.json';
  return new File([JSON.stringify(j)],nome,{type:'application/json'}) }
async function envia(){
  await guardaJa(); const f=await montaFicheiro(P); let ok=false;
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Parte diária '+P.dia}); ok=true }
    else { const u=URL.createObjectURL(f), a=document.createElement('a'); a.href=u; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); ok=true }
  }catch(e){ if(e&&e.name==='AbortError'){ toast('Envio cancelado. A parte continua em rascunho.'); return } toast('Não consegui enviar: '+(e&&e.message||e),5000); return }
  if(ok){ P.estado='enviada'; P.enviada=new Date().toISOString(); P.ficheiro=f.name; await pPut(P); toast('Enviada. Já não se pode editar.'); vista='inicio'; render() } }
async function reenvia(p){ const f=await montaFicheiro(p);
  try{ if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]}); else{ const u=URL.createObjectURL(f),a=document.createElement('a'); a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove() } }catch(e){} }

/* ---------- ecrãs ---------- */
const TIT={partes:'Partes diárias',ints:'Interdições',os:'Ordens de serviço',plano:'Plano diário',docsx:'Esquemas e preparações',fotos:'Fotos',pecas:'Peças',des:'Desenhos',norm:'Normas'};
const CATD={os:'Ordem de serviço',plano:'PDT',esqel:'Esquema elétrico',esqsin:'Esquema de sinalização',proj:'Peça de projeto',prep:'Preparação',des:'Desenho',norm:'Norma'};
let catX='esqel';
function cab(){ const sub=!(vista==='inicio'||vista==='obra'); $('header').hidden=!sub; $('#hCC').hidden=!PAC; $('#hCC').textContent=PAC?PAC.cc:''; $('#hT').textContent=vista==='parte'?'Parte diária':(TIT[vista]||'App de Obra'); $('#hBack').hidden=!sub }
function nav(){ const n=$('#nv'); const mostra=!!PAC&&vista!=='parte'; n.hidden=!mostra; document.body.classList.toggle('sem-nav',!mostra&&vista!=='parte'); if(!mostra)return;
  const at=vista==='inicio'?'o':(vista==='fotos'?'f':'d');
  n.innerHTML='<button data-n="o" class="'+(at==='o'?'on':'')+'">'+ico('home',24)+'Obras</button><button data-n="d" class="'+(at==='d'?'on':'')+'">'+ico('doc',24)+'Documentos</button><button data-n="p">'+ico('pen',24)+'Parte</button><button data-n="f" class="'+(at==='f'?'on':'')+'">'+ico('cam',24)+'Fotos</button>';
  $$('button',n).forEach(b=>{ const c=at===b.dataset.n; if(c){ b.querySelector('svg').setAttribute('stroke','currentColor') } else if(b.dataset.n!=='p'||true){ b.querySelector('svg').setAttribute('stroke','currentColor') }
    b.onclick=()=>{ const k=b.dataset.n; if(k==='o')abre('inicio'); else if(k==='d')abre('obra'); else if(k==='f')abre('fotos'); else { ant=vista; abrePartaDeHoje() } } }) }
async function render(){ cab(); nav(); $('#bar').hidden=(vista!=='parte'); window.scrollTo(0,0);
  if(vista==='parte')return rParte(); if(vista==='partes')return rPartes(); if(vista==='ints')return rInts(); if(vista==='os')return rOS(); if(vista==='plano')return rPlano(); if(vista==='docsx')return rDocsX(); if(vista==='obra')return rObra(); if(vista==='fotos')return rFotos(); if(vista==='pecas')return rPecas(); if(vista==='des'||vista==='norm')return rDocsCat(vista); return rInicio() }
function abre(v){ dQ=''; vista=v; render() }

const INTS=()=>((PAC&&PAC.ints)||[]).slice().sort((a,b)=>((a.data||'')+(a.cI||a.pI||a.ini||'')).localeCompare((b.data||'')+(b.cI||b.pI||b.ini||'')));
const dm=iso=>iso?iso.slice(8)+'/'+iso.slice(5,7):'';
function horaInt(i){ const c=(i.cI||'')&&(i.cF||'')?i.cI+'–'+i.cF:'', pv=(i.pI||'')&&(i.pF||'')?i.pI+'–'+i.pF:(i.ini&&i.fim?i.ini+'–'+i.fim:'');
  return c?('Concedido '+c+(pv&&pv!==c?' · previsto '+pv:'')):(pv?'Previsto '+pv:'') }
function cartInt(i,comBotao){ return '<div class="int"><b>'+(i.os?'OS '+esc(i.os):'Interdição sem OS')+(i.via?' · '+esc(i.via):'')+'</b>'+
  ((i.de||i.ate)?'<span>Local: '+esc(i.de||'?')+' → '+esc(i.ate||'?')+'</span>':'')+(horaInt(i)?'<span>'+esc(horaInt(i))+'</span>':'')+(i.motivo?'<span>'+esc(i.motivo)+'</span>':'')+

  $('#bSr').onclick=()=>{ P.semRub.push({desc:''}); guardaJa().then(()=>rParte().then(()=>{ const l=$$('[data-sr]'); if(l.length)l[l.length-1].focus() })) };
