/* ---- guardar um Excel, deixando escolher a pasta quando o browser deixa ---- */
function guardaWb(wb,nome,msg,ok){
  if(!/\.xlsx$/i.test(nome))nome+='.xlsx';
  /* se o seletor falhar (ex.: file:// em alguns browsers), cai para as Transferências */
  if(window.showSaveFilePicker){
    var dados;
    try{ dados=XLSX.write(wb,{bookType:'xlsx',type:'array'}) }
    catch(err){ XLSX.writeFile(wb,nome); if(msg)toast(msg); if(ok)ok(); return }
    window.showSaveFilePicker({suggestedName:nome,
      types:[{description:'Livro do Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]})
      .then(function(h){ return h.createWritable().then(function(w){
          return w.write(new Blob([dados],{type:'application/octet-stream'})).then(function(){ return w.close() });
        }).then(function(){ if(msg)toast(msg); if(ok)ok() });
      })
      .catch(function(err){
        if(err&&(err.name==='AbortError'))return;        /* o utilizador desistiu */
        XLSX.writeFile(wb,nome); if(msg)toast(msg); if(ok)ok();
      });
    return;
  }
  XLSX.writeFile(wb,nome);
  if(msg)toast(msg); if(ok)ok();
}

function sheetFrom(head,rows,widths,fmt){

  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:ref.e.r,c:ref.e.c}})};
  for(var c=0;c<=ref.e.c;c++){
    var hc=ws[XLSX.utils.encode_cell({r:0,c:c})];
    if(hc)hc.s={font:{bold:true}};
    if(fmt&&fmt[c]){ for(var r=1;r<=ref.e.r;r++){ var cell=ws[XLSX.utils.encode_cell({r:r,c:c})]; if(cell&&cell.t==='n')cell.z=fmt[c] } }

function resumoNE(o){
  var g={};
  o.ne.forEach(function(r){
    var k=norm(r.ne)||'(sem NE)';
    var x=g[k]||(g[k]={ne:r.ne||'(sem NE)',tipo:r.tipo||'',data:dstr(r.data),forn:r.forn||'',n:0,qt:0,val:0,rec:0,guias:{}});
    x.n++; x.qt+=num(r.qt); x.val+=num(r.qt)*num(r.pu); x.rec+=num(r._rec||0);
    if(!x.forn&&r.forn)x.forn=r.forn;
    if(!x.data&&r.data)x.data=dstr(r.data);
  });
  o.gr.forEach(function(r){ var k=norm(r.ne); if(g[k]&&r.guia)g[k].guias[r.guia]=1 });
  return Object.keys(g).sort().map(function(k){return g[k]});
}

/* ---------- MATERIAIS POR AUTO: períodos por auto, previsões por material e exportação por família ---------- */
var MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function pad2a(n){ return ('0'+n).slice(-2) }
function mSoma(m,n){ var p=String(m).split('-'), t=new Date(+p[0],+p[1]-1+n,1); return t.getFullYear()+'-'+pad2a(t.getMonth()+1) }
function mProx(m){ return mSoma(m,1) }
function mAnt(m){ return mSoma(m,-1) }
/* auto: fecha no dia 20. O auto de setembro cobre de 21/08 a 20/09; uma guia a 21/09 já é do auto de outubro */
function diaAutoDe(o){ return +((o||ST).diaAuto)||20 }
function autoDe(data,o){
  var d=dstr(data); if(!/^\d{4}-\d{2}-\d{2}/.test(d))return '';
  return +d.slice(8,10)>diaAutoDe(o)? mProx(d.slice(0,7)) : d.slice(0,7);
}
function autoIntervalo(a,o){ var lim=diaAutoDe(o); return pad2a(lim+1)+'/'+mAnt(a).slice(5,7)+' a '+pad2a(lim)+'/'+a.slice(5,7) }
function autoLabel(a,o){ return nomeMes(a)+' ('+autoIntervalo(a,o)+')' }
function autoLbl2(a){ return a.slice(5)+'/'+a.slice(2,4) }
function autoCurto(a){ return MESC[+a.slice(5,7)-1]+' '+a.slice(2,4) }
function cptA(n){ var a=Math.abs(n); if(a>=1e6)return (n/1e6).toLocaleString('pt-PT',{maximumFractionDigits:2})+' M'; if(a>=1e3)return (n/1e3).toLocaleString('pt-PT',{maximumFractionDigits:1})+' k'; return String(Math.round(n)) }
function niceMaxA(v){ if(v<=0)return 1; var e=Math.pow(10,Math.floor(Math.log10(v))), f=v/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e }

/* Previsões de uma obra (o.prv): por MATERIAL em quantidade (qc = consumo, qn = necessidade de compra),
   mais linhas «sem detalhe» por família em € (cons, nec) e ajustes manuais do pagamento por família em € (pag).
   O pagamento calcula-se sozinho: necessidade de compra desfasada pelo prazo. */
var AUT={vis:'res',foco:'',fam:'',ref:'atual',extra:0,q:'',todos:false,fecha:{},niv:'fam',show:{},M:{}};
var PRV0={prazo:60,cons:{},nec:{},pag:{},qc:{},qn:{},meta:{}};
var PRV_TIPOS={cons:'Consumo previsto',nec:'Necessidade de compra',pag:'Pagamento previsto'};
function autFechoHtml(D){
  var P=prvGet(ST), opts=D.autos.filter(function(a){ return a<=D.hj });
  return '<label class="ts" title="Os autos fechados deixam de aceitar alterações: o que foi previsto fica registado">Fechar autos até <select id="autFecho"><option value="">(nenhum)</option>'+opts.map(function(a){ return '<option value="'+a+'"'+(a===P.fecho?' selected':'')+'>'+esc(nomeMes(a))+'</option>' }).join('')+'</select></label>';
}
function prvGet(o){ return (o&&o.prv)||PRV0 }
function prvSet(o){
  if(!o.prv)o.prv={prazo:60,cons:{},nec:{},pag:{},qc:{},qn:{},meta:{}};
  var p=o.prv; ['cons','nec','pag','qc','qn','meta'].forEach(function(k){ p[k]=p[k]||{} });
  return p;
}

/* o que realmente aconteceu: em € por família e por auto (preço médio de compra) e em quantidade por material */
function autReal(o,GM){
  var F={}, base={}, Q={};
  function add(k,auto,tipo,qt){
    var L=GM[k]; if(!L||!qt)return;
    var f=L.fam||'Sem família', v=qt*(L.pu||0);
    if(!auto){ base[f]=(base[f]||0)+((tipo==='ent'||tipo==='trf')?v:-v); return }   /* sem data: conta desde o início */
    var a=(F[f]=F[f]||{}), b=a[auto]||(a[auto]={ent:0,cons:0,vend:0,trf:0}); b[tipo]+=v;
    var qa=(Q[k]=Q[k]||{}), qb=qa[auto]||(qa[auto]={ent:0,cons:0,vend:0,trf:0}); qb[tipo]+=qt;
  }
  (o.gr||[]).forEach(function(r){ add(rowKey(r),autoDe(r.data,o),'ent',num(r.qt)) });
  (o.cons||[]).forEach(function(c){ var a=String(c.mes||'').slice(0,7); if(!/^\d{4}-\d{2}$/.test(a))a=''; (c.linhas||[]).forEach(function(l){ add(movKey(l),a,'cons',num(l.qt)) }) });
  (o.movs||[]).forEach(function(m){ if(m.tipo==='venda')add(movKey(m),autoDe(m.data,o),'vend',num(m.qt)) });
  OBRAS.forEach(function(o2){ (o2.movs||[]).forEach(function(m){
    if(m.tipo!=='transferencia')return;
    var k=movKey(m), di=idxDestTransf(m), a=autoDe(m.data,o);
    if(o2===o)add(k,a,'trf',-num(m.qt));
    if(di>=0&&OBRAS[di]===o)add(k,a,'trf',num(m.qt));
  }) });
  return {F:F,base:base,Q:Q};
}
function autGM(){ var GM={}; globalMateriais().forEach(function(L){ GM[L.k]=L }); return GM }

/* os materiais desta obra, com família, unidade e preço (médio de compra; sem compras, o preço da medição) */
function autMats(o,GM){
  var M={}, io=OBRAS.indexOf(o), P=prvGet(o), PO=o.prvOrig||null;
  Object.keys(GM).forEach(function(k){
    var L=GM[k]; if(!L.obras.some(function(x){ return x.i===io }))return;
    M[k]={k:k,cod:L.cod||'',des:L.des||'',fam:L.fam||'Sem família',un:L.un||'',pu:L.pu||0,med:false};
  });
  var keep=ST, troca=(o!==ST); if(troca){ ST=o; calc(); calcRec() }
  try{
    (o.med||[]).forEach(function(a){
      var k=rowKey({cod:a.cod,des:a.des}), it=look(a.cod), m=M[k];
      if(!m)m=M[k]={k:k,cod:a.cod||'',des:(it?it.des:'')||a.des||'',fam:it?(it.fam||'Sem família'):'Fora do catálogo',un:a.un||'',pu:0};
      m.med=true; if(!m.pu)m.pu=a._pv||a._pa||a._po||0; if(!m.un)m.un=a.un||'';
    });
  } finally { if(troca){ ST=keep; calc(); calcRec() } }
  [P,PO].forEach(function(src){ if(!src)return; Object.keys(src.meta||{}).forEach(function(k){
    if(!M[k]){ var x=src.meta[k]; M[k]={k:k,cod:x.cod||'',des:x.des||'',fam:x.fam||'Sem família',un:x.un||'',pu:0,med:false} } }) });
  return M;
}

/* previsões somadas por família em € (material × preço + linhas sem detalhe) e pagamento */
function autFamVals(src,M){
  var out={cons:{},nec:{},pag:{},pagCalc:{}};
  if(!src)return out;
  function add(t,f,a,v){ if(!v)return; var m=out[t][f]||(out[t][f]={}); m[a]=(m[a]||0)+v }
  ['cons','nec'].forEach(function(t){
    Object.keys(src[t]||{}).forEach(function(f){ Object.keys(src[t][f]).forEach(function(a){ add(t,f,a,num(src[t][f][a])) }) });
    var Qm=src[t==='cons'?'qc':'qn']||{};
    Object.keys(Qm).forEach(function(k){ var m=M[k]; if(!m)return; Object.keys(Qm[k]).forEach(function(a){ add(t,m.fam,a,num(Qm[k][a])*m.pu) }) });
  });
  var n=Math.round(num(src.prazo==null?60:src.prazo)/30);
  Object.keys(out.nec).forEach(function(f){ Object.keys(out.nec[f]).forEach(function(a){ add('pag',f,mSoma(a,n),out.nec[f][a]) }) });
  out.pagCalc=JSON.parse(JSON.stringify(out.pag));
  Object.keys(src.pag||{}).forEach(function(f){ Object.keys(src.pag[f]).forEach(function(a){ var m=out.pag[f]||(out.pag[f]={}); m[a]=num(src.pag[f][a]) }) });
  return out;
}

function autDados(o,GM,fam){
  o=o||ST; GM=GM||autGM();
  var hj=autoDe(hoje(),o), R=autReal(o,GM), P=prvGet(o), PO=o.prvOrig||null, M=autMats(o,GM);
  var FV=autFamVals(P,M), FO=PO?autFamVals(PO,M):null;
  var fams={}, set={}; set[hj]=1;
  Object.keys(R.F).forEach(function(f){ fams[f]=1; Object.keys(R.F[f]).forEach(function(a){ set[a]=1 }) });
  Object.keys(R.base).forEach(function(f){ fams[f]=1 });
  [FV,FO].forEach(function(src){ if(!src)return; ['cons','nec','pag'].forEach(function(t){ Object.keys(src[t]||{}).forEach(function(f){
    Object.keys(src[t][f]).forEach(function(a){ if(src[t][f][a]||t==='pag'){ fams[f]=1; set[a]=1 } }) }) }) });
  var ks=Object.keys(set).sort(), autos=[]; for(var a=ks[0];a<=ks[ks.length-1]&&autos.length<72;a=mProx(a))autos.push(a);
  var famList=Object.keys(fams).sort(function(x,y){ return x.localeCompare(y,'pt') });
  var stock={};
  famList.forEach(function(f){ var run=R.base[f]||0; stock[f]={}; autos.forEach(function(a){ var b=(R.F[f]||{})[a]; if(b&&a<=hj)run+=b.ent-b.cons-b.vend+b.trf; stock[f][a]=run }) });
  function soma(f,a,k,ref){
    if(k==='ent'||k==='cons'||k==='vend'){ var b=(R.F[f]||{})[a]; return b?b[k]:0 }
    var src=(ref==='orig'&&FO)?FO:FV;
    return num((((src[{prev:'cons',nec:'nec',pag:'pag'}[k]]||{})[f])||{})[a]);
  }
  var temPrev=false, temNec=false;
  famList.forEach(function(f){ autos.forEach(function(a){ if(soma(f,a,'prev'))temPrev=true; if(soma(f,a,'nec'))temNec=true }) });
  var stockP={};
  if(temPrev&&temNec)famList.forEach(function(f){
    stockP[f]={};
    var run=stock[f][hj]+Math.max(0,soma(f,hj,'nec')-soma(f,hj,'ent'))-Math.max(0,soma(f,hj,'prev')-soma(f,hj,'cons'));
    stockP[f][hj]=run;
    autos.forEach(function(a){ if(a>hj){ run+=soma(f,a,'nec')-soma(f,a,'prev'); stockP[f][a]=run } });
  });
  var use=(fam&&fams[fam])?[fam]:famList, S=[], ac=0, ap=0, ac2=0;
  autos.forEach(function(a){
    var x={a:a,ent:0,cons:0,vend:0,prev:0,nec:0,pag:0,stock:0,sp:null,curso:a===hj};
    use.forEach(function(f){
      x.ent+=soma(f,a,'ent'); x.cons+=soma(f,a,'cons'); x.vend+=soma(f,a,'vend'); x.prev+=soma(f,a,'prev'); x.nec+=soma(f,a,'nec'); x.pag+=soma(f,a,'pag');
      x.stock+=stock[f][a]; if(stockP[f]&&stockP[f][a]!=null)x.sp=(x.sp||0)+stockP[f][a];
    });
    if(a<=hj){ ac+=x.cons; ap+=x.prev; if(x.prev>0)ac2+=x.cons }
    x.acCons=a<=hj?ac:null; x.acCmp=a<=hj?ac2:null; x.acPrev=a<=hj?ap:null;
    S.push(x);
  });
  var falta=null;
  for(var ia=0;ia<autos.length&&!falta;ia++){
    var aa=autos[ia]; if(aa<hj)continue;
    var ff=use.filter(function(f){ return stockP[f]&&stockP[f][aa]!=null&&stockP[f][aa]<-0.5 });
    if(ff.length)falta={a:aa,fams:ff,val:ff.reduce(function(t,f){ return t+stockP[f][aa] },0)};
  }
  return {S:S,autos:autos,fams:famList,stock:stock,stockP:stockP,soma:soma,hj:hj,use:use,falta:falta,temPrev:temPrev,temNec:temNec,temOrig:!!PO,M:M,Q:R.Q,pagCalc:FV.pagCalc,P:P,PO:PO};
}

function autDevHtml(r,p,t,fmt){

  return '<span class="chip '+(d>0.05*Math.abs(p)?'wait':'none')+'" title="'+esc(t||'Consumo contra consumo previsto')+'">'+(d>0?'+':'')+fmt(d)+(fmt===eurz?' €':'')+'</span>';
}

/* gráfico de barras com linha tracejada por cima */
function autSvg(S,hj,o){
  var W=720,H=210,L=56,R=8,T=12,B=24,n=S.length, mx=1;
  S.forEach(function(x){ mx=Math.max(mx,x[o.bar]||0,o.line?Math.max(0,x[o.line]||0):0) }); mx=niceMaxA(mx*1.06);
  function py(v){ return T+(H-T-B)*(1-v/mx) }

function autLePrev(wb){

    if(hr<0)return;

        cF=pickCol(m,['família','familia']), cA=pickCol(m,['auto']), cVl=pickCol(m,['valor']);

      if(!tipo)continue;

      var dst=ver==='orig'?(o.orig=o.orig||{prazo:60,cons:{},nec:{},pag:{},qc:{},qn:{},meta:{}}):o.atual;
      if(tipo.indexOf('prazo')===0){ dst.prazo=v; continue }
      if(tipo.indexOf('autos fechados')===0){ var af=g(cA).slice(0,7); if(/^\d{4}-\d{2}$/.test(af))dst.fecho=af; continue }
      if(tipo.indexOf('ultimo envio')===0||tipo.indexOf('último envio')===0){ o.env={d:g(cD),h:v}; continue }
      var t=tipo.indexOf('consumo')===0?'cons':tipo.indexOf('necessidade')===0?'nec':tipo.indexOf('pagamento')===0?'pag':'';
      var f=g(cF), a=g(cA).slice(0,7); if(!t||!/^\d{4}-\d{2}$/.test(a))continue;
      if(!v&&t!=='pag')continue;
      var cod=g(cC), des=g(cD), matRow=(t!=='pag')&&(tipo.indexOf('(qt)')>=0||(!!(cod||des)&&tipo.indexOf('(€)')<0));
      if(matRow){
        if(!cod&&!des)continue;
        var k=rowKey({cod:cod,des:des}), qk=t==='cons'?'qc':'qn';
        ((dst[qk][k]=dst[qk][k]||{}))[a]=v; dst.meta[k]={cod:cod,des:des,fam:f,un:''};
      } else {
        if(!f)continue;
        ((dst[t][f]=dst[t][f]||{}))[a]=v;
      }
    }
  });
  return out;
}

  var ks=Object.keys(rows[0]), K={}; ks.forEach(function(k){ K[nmSemAcento(k)]=k });

  var T=toks(a.des), fam='';

  else if(T.length){ var best=0; ITEMS.forEach(function(x){ if(!x.fam||!x.des)return; var X=toks(x.des), n=0; T.forEach(function(t){ if(X.indexOf(t)>-1)n++ }); if(n&&X[0]===T[0])n+=3;
      if(n>best||(n===best&&n>0&&!fam)){ best=n; fam=x.fam } }); if(best<1)fam='' }

      (s.ne||[]).forEach(function(i){ var r=ST.ne[i]; if(r&&!r.anul&&r.forn)forn[r.forn]=1 });
      var qc=Math.min(s.qne,qa); eff=(qc*pc+(qa-qc)*p0)/qa;
    }

  var th=$('#mcBox thead tr'); if(th&&!th.querySelector('.propTh')&&th.children.length>=9){ var t=document.createElement('th'); t.className='propTh'; t.textContent='Proposta (PDF)'; th.insertBefore(t,th.children[th.children.length-1]) }
  function pedePdf(cb){ var i=document.createElement('input'); i.type='file'; i.accept='application/pdf,.pdf'; i.onchange=function(){ if(i.files[0])cb(i.files[0]) }; i.click() }
  function erro(e){ toast('Erro: '+(e&&e.message||e),6000) }
  $$('#mcBox [data-pan]').forEach(function(b){ b.onclick=function(){ var j=+b.dataset.pan; pedePdf(async function(fl){ try{ toast('A arquivar o PDF…'); await propAnexa(m,j,fl); renderMC();
      if(await nmSim('PDF arquivado. Queres que o leia agora para preencher os preços?','Ler agora'))await propLe(m,j,await fl.arrayBuffer()) }catch(e){ erro(e) } }) } });
  $$('#mcBox [data-pab]').forEach(function(b){ b.onclick=function(){ propAbre(m.forns[+b.dataset.pab]).catch(erro) } });
  $$('#mcBox [data-ple]').forEach(function(b){ b.onclick=async function(){ var j=+b.dataset.ple, f=m.forns[j];
    try{ if(f.pdf)await propLe(m,j,await propBaixa(f)); else pedePdf(async function(fl){ try{ await propAnexa(m,j,fl); renderMC(); await propLe(m,j,await fl.arrayBuffer()) }catch(e){ erro(e) } }) }catch(e){ erro(e) } } });
  $$('#mcBox [data-pta]').forEach(function(b){ b.onclick=function(){ var j=+b.dataset.pta; var i=document.createElement('input'); i.type='file'; i.accept='.xlsx,.xls,.csv'; i.onchange=async function(){ if(!i.files[0])return;
      try{ var L=linhasDeTabela(await i.files[0].arrayBuffer()); if(!L.length){ await nmDiz('Não encontrei uma tabela com colunas «Código» e «Preço».'); return } await propLe(m,j,null,L) }catch(e){ erro(e) } }; i.click() } });
  $$('#mcBox [data-pgu]').forEach(function(b){ b.onclick=function(){ propGuarda(m,+b.dataset.pgu).catch(erro) } });
}
var _stMC=document.createElement('style'); _stMC.textContent='#mcBox .cb{overflow-x:auto}'; document.head.appendChild(_stMC);
var _rMC=renderMC;
renderMC=function(){ _rMC.apply(this,arguments); try{ ligaBarraMC(); ligaBotoesProposta(); carregaFornDB().then(function(){ var mm=mcAtual(); if(!mm)return; $$('#mcBox tbody td.c').forEach(function(td){ var l=fornConhecidos(td.textContent.trim()); if(l.length)td.title='Fornecedores conhecidos: '+l.slice(0,6).map(function(x){ return x.nome+' ('+nf2.format(x.pu)+' € · '+(dstr(x.data)||'')+')' }).join('; ') }) }) }catch(e){ console.error(e) } };
window.__nm.analisaProposta=analisaProposta; window.__nm.propLe=propLe; window.__nm.propAnexa=propAnexa; window.__nm.propGuarda=propGuarda; window.__nm.linhasDeTabela=linhasDeTabela;

render();
})();

['input','change','keydown'].forEach(function(e){document.addEventListener(e,c,true)});
document.addEventListener('click',function(e){var x=e.target;if(x&&x.closest&&x.closest('table,.box,.modalBox,.jan,form'))c()},true)})();</script>
