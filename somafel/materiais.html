<style>
:root{
  --paper:#F1F1EF; --sheet:#FFFFFF; --ink:#2B3038; --muted:#6E7178;
  --rule:#D8D8D4; --soft:#EAEAE6; --brand:#F9D115; --verd:#7A5E00; --verdbg:#FDF3CE;
  --amber:#8F5D00; --amberbg:#F7EEDC; --red:#9B2C2C; --redbg:#F7E4E4;
  --ok:#2F6B4F; --okbg:#E4F0E9;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default;border-color:var(--rule)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:15px;padding:0 15px;height:58px;background:var(--hdr);flex:0 0 auto}
header img.logo{height:34px;width:auto;display:block;border-radius:2px}
header .sep{width:1px;height:26px;background:rgba(255,255,255,.16)}
#obraNome{border:1px solid transparent;background:transparent;color:#fff;font-size:15px;font-weight:600;padding:4px 7px;width:210px;border-radius:var(--r)}
#obraNome::placeholder{color:rgba(255,255,255,.4)}
#obraNome:hover{border-color:rgba(255,255,255,.2)}
#obraNome:focus{border-color:var(--brand);background:rgba(255,255,255,.06);outline:none}
.stats{display:flex;margin-left:auto}
.stat{padding:2px 14px;border-left:1px solid rgba(255,255,255,.13);text-align:right;min-width:86px}
.stat b{display:block;font-family:var(--mono);font-size:16px;font-weight:500;line-height:1.25;color:var(--brand)}
.stat span{font-size:11px;color:rgba(255,255,255,.55)}
.tools{display:flex;gap:7px;padding-left:14px;border-left:1px solid rgba(255,255,255,.13)}
.tools button{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.tools button:hover{border-color:var(--brand);color:var(--brand)}
.tools button#bSave{background:var(--brand);border-color:var(--brand);color:#2B3038;font-weight:500}
.tools button#bSave:hover{color:#2B3038}

main{flex:1 1 auto;display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0;transition:grid-template-columns .15s}
main.fechada{grid-template-columns:34px minmax(0,1fr)}
#bColObras.col{border:1px solid var(--rule);background:var(--sheet);padding:1px 7px;font-size:14px;line-height:1.2;border-radius:var(--r);color:var(--muted)}
#bColObras.col:hover{border-color:var(--ink);color:var(--ink)}
main.fechada #paneObras .ph{padding:9px 5px;justify-content:center}
main.fechada #paneObras .ph h2,main.fechada #paneObras .ph .n,main.fechada #paneObras .scroll{display:none}
main.fechada #paneObras .obraTag{display:block}
.obraTag{display:none;writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--mono);font-size:11px;color:var(--muted);
  padding:10px 0;text-align:center;letter-spacing:.04em;cursor:pointer}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.pane+.pane{border-left:1px solid var(--rule)}
.ph{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.ph h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
.ph .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bar{display:flex;gap:6px;padding:8px 11px;border-bottom:1px solid var(--rule);flex:0 0 auto;align-items:center;flex-wrap:wrap}
.bar input,.bar select{font-size:13px;padding:5px 8px}
.bar input.grow{flex:1 1 auto;min-width:90px}
.scroll{flex:1 1 auto;overflow-y:auto;min-height:0}
.pad{padding:13px}

/* lista de artigos */
#fichaBox{max-width:1060px}
tr.det td{background:var(--paper);padding:0 0 10px 26px}
tr.det .dets{display:flex;gap:22px;flex-wrap:wrap}
tr.det .dets>div{flex:1 1 340px;min-width:300px}
tr.det h5{margin:9px 0 4px;font-size:11px;font-weight:600;color:var(--muted)}
tr.det table.g{width:auto;min-width:0;background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
tr.det table.g th{position:static}
.listaFam{column-gap:0}
.listaFam .grp{break-inside:auto}
.listaFam .famH{break-after:avoid}
.listaFam .art{break-inside:avoid;gap:10px}
@media (min-width:1120px){ .listaFam{columns:2} }
@media (min-width:1560px){ .listaFam{columns:3} }
.avCols{column-gap:0}
.avCols .av{break-inside:avoid}
.avCols .famH{break-after:avoid}
@media (min-width:1120px){ .avCols{columns:2} }
@media (min-width:1560px){ .avCols{columns:3} }
#listaArt{column-gap:0}
#listaArt .grp{break-inside:auto}
#listaArt .famH{break-after:avoid;page-break-after:avoid}
#listaArt .art{break-inside:avoid}
@media (min-width:1120px){ #listaArt{columns:2} }
@media (min-width:1560px){ #listaArt{columns:3} }
.famH{background:var(--soft);padding:4px 12px;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule);z-index:1}
.art{padding:6px 12px;border-bottom:1px solid var(--soft);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.art:hover{background:var(--paper)}
.art.on{background:var(--verdbg);box-shadow:inset 3px 0 0 var(--brand)}
.art .c{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:0 0 auto}
.art .d{font-size:12.5px;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:10px;padding:1px 5px;border-radius:8px;white-space:nowrap;flex:0 0 auto}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.wait{background:var(--amberbg);color:var(--amber)}
.chip.none{background:var(--soft);color:var(--muted)}
.chip.bad{background:var(--redbg);color:var(--red)}
.chip.fora{background:var(--fora-bg);color:var(--fora-fg)}
.chip.pm{background:var(--pm-bg);color:var(--pm-fg)}
.bar3{position:relative;display:flex;height:8px;width:112px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar3 i{display:block;height:100%}
.bar3 i.r{background:var(--ok)} .bar3 i.e{background:var(--brand)} .bar3 i.x{background:var(--red)}
.bar3 b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.dirty{color:var(--brand);font-size:11.5px;align-self:center;margin-right:2px;white-space:nowrap}
.rasc{margin:9px 13px;padding:9px 11px;border-radius:4px;background:var(--amberbg);color:var(--amber);font-size:12px}
.rasc button{margin:6px 6px 0 0}
.ovl[hidden]{display:none}
.adbox{position:relative}

tr.sel td{background:var(--verdbg)!important}
.foot{padding:7px 11px;border-top:1px solid var(--rule);display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);flex:0 0 auto}

.fields{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ts{font-size:12px;color:var(--muted)}

.org{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);font-size:12px;color:var(--ink)}

.org .on2{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:4px 12px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper)}

kbd{font-family:var(--mono);font-size:10px;background:var(--soft);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px}

.fbox{background:var(--sheet);border-radius:6px;width:min(1080px,100%);max-height:calc(100vh - 68px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden}

.mv2 tr.fam td{background:var(--soft);font-family:var(--sans);font-weight:600;cursor:pointer;border-top:1px solid var(--rule)}
.mv2 tr:hover td:not(.empty){filter:brightness(.98)}
.mv2 tr.sel td{outline:0;box-shadow:inset 0 0 0 9999px rgba(255,210,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mv2 thead th.gi{background:#2a2f38}:root:not([data-theme="light"]) .mv2 thead th.gv{background:#1f3322}:root:not([data-theme="light"]) .mv2 thead th.ga{background:#4a3f10}.mv2 .up{color:#ff8a80}.mv2 .dn{color:#81c784}}
:root[data-theme="dark"] .mv2 thead th.gi{background:#2a2f38}:root[data-theme="dark"] .mv2 thead th.gv{background:#1f3322}:root[data-theme="dark"] .mv2 thead th.ga{background:#4a3f10}
@media (max-width:900px){.mv2 .gi,.mv2 .gd,.mv2 .un,.mv2 .pu{display:none}.mv2 td.t{max-width:150px}.mv2 td.c,.mv2 th:first-child{position:sticky;left:0;z-index:2;background:var(--sheet,#fff)}}

/* a obra já vem escolhida da Central: sem painel de obras */
body.obraAtiva #paneObras{display:none}
body.obraAtiva main,body.obraAtiva main.fechada{grid-template-columns:var(--sw) minmax(0,1fr)}
.sver{display:none}
</style>
<style id="online-extra">
/* Camada de movimento · norma comum v1 · partilhada pela Central online, App de Obra e Produção.
   Só transições curtas (≤ 250 ms) e nada que bloqueie. Respeita «reduzir movimento». */
:root{--mv-ease:cubic-bezier(.2,.7,.2,1);--mv-t:.22s}
/* entrada de ecrã: os blocos aparecem em cascata */
@keyframes mv-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vz>*,#m.entra>*{animation:mv-in .26s var(--mv-ease) both}
.vz>*:nth-child(2),#m.entra>*:nth-child(2){animation-delay:.03s}
.vz>*:nth-child(3),#m.entra>*:nth-child(3){animation-delay:.06s}
.vz>*:nth-child(4),#m.entra>*:nth-child(4){animation-delay:.09s}
.vz>*:nth-child(5),#m.entra>*:nth-child(5){animation-delay:.12s}
.vz>*:nth-child(n+6),#m.entra>*:nth-child(n+6){animation-delay:.15s}
/* listas: linhas entram em sequência curta */
tbody tr,.lin{animation:mv-in .22s var(--mv-ease) both}
tbody tr:nth-child(2),.lin:nth-child(2){animation-delay:.02s}tbody tr:nth-child(3),.lin:nth-child(3){animation-delay:.04s}
tbody tr:nth-child(4),.lin:nth-child(4){animation-delay:.06s}tbody tr:nth-child(n+5),.lin:nth-child(n+5){animation-delay:.08s}
/* linhas: só animam ao entrar num ecrã, não enquanto se edita; só as 12 primeiras (tabelas grandes ficam leves) */
tbody tr:nth-child(n+13),.lin:nth-child(n+13){animation:none}
html.mv-calmo tbody tr,html.mv-calmo .lin{animation:none!important}
/* linha nova ou alterada: brilho curto */
@keyframes mv-novo{0%{background-color:rgba(249,209,21,.42)}100%{background-color:transparent}}
tr.mv-novo>td,.mv-novo{animation:mv-novo 1.6s ease-out}
/* toque: resposta imediata */
button:active:not(:disabled),a.btn:active{transform:scale(.97)}

/* cartões clicáveis: pequena elevação */
.card.obra,.obra{transition:transform var(--mv-t) var(--mv-ease),box-shadow var(--mv-t) var(--mv-ease),border-color .15s}
.card.obra:hover,.obra:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.10)}
.card.obra:active,.obra:active{transform:scale(.985)}
/* janelas e avisos */
@keyframes mv-pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes mv-fade{from{opacity:0}to{opacity:1}}
.jan,.nmCard{animation:mv-pop .2s var(--mv-ease) both}
.fundo,.nmW{animation:mv-fade .18s ease-out both}
@keyframes mv-slide{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.aviso,.toast.on{animation:mv-slide .22s var(--mv-ease) both}
/* estados e botões */
.pill{transition:background .2s,color .2s}
button,a.btn{transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}
button.pri:hover{box-shadow:0 2px 10px rgba(0,0,0,.14)}
/* a carregar: esqueleto com brilho */
@keyframes mv-sk{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skel{display:block;height:14px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,rgba(128,128,128,.14) 0,rgba(128,128,128,.26) 40px,rgba(128,128,128,.14) 80px);background-size:200px 100%;animation:mv-sk 1.2s linear infinite}
.skel.b{height:54px;border-radius:10px}.skel.s{width:45%}.skel.m{width:70%}
/* indicador «guardado» */
#gst,#et{transition:color .25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.nmLogin{position:fixed;inset:0;background:var(--paper,#F1F1EF);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px}
.nmLogin[hidden]{display:none}.nmLogin form,.nmLogin .box{width:min(380px,100%);display:flex;flex-direction:column;gap:8px}
.nmLogin .ob{text-align:left;padding:10px 12px}.nmLogin .er{color:#C62828;min-height:1em}

</style>
<style id="norma-v2">
/* ===== norma visual v2 (28 out 2026): cabeçalho claro e cantos como a Central, Produção e RCT ===== */
:root{--r:8px;--rc:12px;--sh:0 1px 2px rgba(20,24,32,.05),0 4px 14px rgba(20,24,32,.05)}
@media screen and (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3)}}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
.card,.box,.pcard,.modalBox{border-radius:var(--rc)}
.chip{border-radius:99px}

header{background:var(--sheet);color:var(--ink);border-bottom:1px solid var(--rule);min-height:58px}
header .sep{background:var(--rule)}
#obraNome{color:var(--ink)}
#obraNome::placeholder{color:var(--muted)}
#obraNome:hover{border-color:var(--rule)}
#obraNome:focus{background:var(--sheet)}
header .stats{gap:8px}
header .stat{padding:4px 12px;border:1px solid var(--rule);border-left:1px solid var(--rule);border-radius:10px;background:var(--paper);text-align:left;min-width:86px}
header .stat b{color:var(--ink);font-size:15px}
header .stat span{color:var(--muted)}
header .tools button{background:var(--sheet);color:var(--ink);border-color:var(--rule)}
header .tools button:hover{border-color:var(--ink);color:var(--ink)}
header .tools button.pri,header .tools button#bSave{background:var(--brand);border-color:var(--brand);color:#2B3038;font-weight:500}
header .tools button.pri:hover,header .tools button#bSave:hover{background:#ffdc3d;border-color:#ffdc3d;color:#2B3038}
header .tools .nmenu button{background:transparent;border:0;color:var(--ink)}
header .tools .nmenu button:hover{background:var(--paper);border:0}
header select{background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
#gst{color:var(--muted)}#gst.ok{color:var(--ok)}#gst.av{color:var(--amber)}#gst.er{color:var(--red)}
.dirty{color:var(--amber)}
#fichNome{color:var(--muted)!important}
</style>

<script>const CAT={"f":[],"r":[]};const EXTRA=[];</script>
<script>
/* Controlo de materiais — Catenária */
(function(){
'use strict';

/* ---------- utilitários ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return isFinite(v)?v:0;
  var s=String(v).replace(/\s|\u00a0|€/g,'');
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1){s=s.replace(/\./g,'').replace(',','.')}
  else if(s.indexOf(',')>-1){s=s.replace(',','.')}
  var n=parseFloat(s);return isFinite(n)?n:0;
}
var M2='_-* #,##0.00_-;-* #,##0.00_-;_-* "-"??_-;_-@_-';
var nf0=new Intl.NumberFormat('pt-PT',{maximumFractionDigits:0,useGrouping:'always'});
var nf2=new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
function q(n){ if(!n)return ''; return Math.abs(n%1)<1e-9?nf0.format(n):nf2.format(n) }
function iv(n){ if(n==null||n===''||n===0)return ''; var r=Math.round(num(n)*10000)/10000; return String(r) }
function eur(n){ if(n==null||n==='')return ''; var v=num(n); if(!v)return ''; return nf2.format(v) }
function eurz(n){ return nf2.format(num(n)||0) }
function norm(s){ return String(s==null?'':s).trim().toUpperCase().replace(/\s+/g,' ') }
function lower(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'') }
var WIRED={};
function once(sel,ev,fn,chave){ var k=sel+'|'+ev+'|'+(chave||''); if(WIRED[k])return; WIRED[k]=1; document.querySelector(sel).addEventListener(ev,fn) }
var toastT;
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on')},3200) }
function nomeFicheiro(s){
  s=String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[^A-Za-z0-9 ._()-]+/g,' ').replace(/\s+/g,' ').trim();
  return s||'obra';
}
function hoje(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2) }
function dstr(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return v.toISOString().slice(0,10);
  if(typeof v==='number'){ var d=new Date(Date.UTC(1899,11,30+Math.floor(v))); return d.toISOString().slice(0,10) }
  var s=String(v).trim(); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return s;
}

/* ---------- catálogo ---------- */
/* LIVRO = livro de peças IP, tal como vem do Excel oficial.
   ST.extra = materiais precisos na obra que o livro não tem. */
var LIVRO=[];
function carregaLivro(d){
  LIVRO=d.r.map(function(r,i){
    return {i:i, fam:d.f[r[0]], cod:r[1], mn:r[2], sap:r[3], des:r[4], dw:r[5], ref:r[6], com:r[7], src:'L'};
  });
}
carregaLivro(CAT);
var ITEMS=[], IX={}, SEARCH=[];
function buildIX(){
  ITEMS=LIVRO.concat(ST.extra.map(function(x,j){
    return {i:1e6+j, fam:x.fam||'Fora do livro', cod:x.cod, mn:x.mn, sap:x.sap, des:x.des, dw:x.dw, ref:'', com:x.nota||'', un:x.un||'', src:'X'};
  }));
  IX={};
  ITEMS.forEach(function(it){
    [it.cod,it.mn,it.sap].forEach(function(c){ if(c){ var k=norm(c); if(!IX[k])IX[k]=it } });
  });
  SEARCH=ITEMS.map(function(it){ return lower([it.cod,it.mn,it.sap,it.des,it.fam,it.dw].join(' ')) });
}
function look(code){ return IX[norm(code)]||null }
function keyOf(code){ var it=look(code); return it? norm(it.cod||it.mn||it.sap) : norm(code) }
function rowKey(r){ return r.cod? keyOf(r.cod) : 'DES:'+norm(r.des||r.obs||'sem identificação') }

function ocSituacao(a){
  if(!a._imp) return {c:'none',t:'sem compras'};
  if(a._sal<0) return {c:'bad',t:'faltam '+eurz(-a._sal)+' €'};
  return {c:'ok',t:'sobra '+eurz(a._sal)+' €'};
}

function ocResumo(vs){
  var ca=0,imp=0,sal=0,neg=0,lig=0,vr=0,vp=0,F={};
  vs.forEach(function(a){
    ca+=a._ca||0; imp+=a._imp||0; sal+=a._sal||0; if((a._sal||0)<-0.005)neg++; lig+=(a._linhasImp||[]).length; vr+=a._vendR||0; vp+=a._vendP||0;
    var k=a.fam||'— sem família —', f=F[k]||(F[k]={n:0,ca:0,imp:0,sal:0}); f.n++; f.ca+=a._ca||0; f.imp+=a._imp||0; f.sal+=a._sal||0;
  });
  var pct=ca>0?Math.round(imp/ca*100):0;
  function card(t,v,sub,red){ return '<div><span>'+t+'</span><b'+(red?' style="color:var(--red)"':'')+'>'+v+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div>' }
  var h='<div class="ocgeral">'+
    card('Disponível (orçamento)',eurz(ca)+' €',vs.length+' verba'+(vs.length===1?'':'s'))+
    card('Imputado',eurz(imp)+' €',lig+' compra'+(lig===1?'':'s')+' ligada'+(lig===1?'':'s')+(ca>0?' · '+pct+'% do orçamento':''))+
    card('Saldo',eurz(sal)+' €',neg?neg+' verba'+(neg===1?'':'s')+' sem saldo':'todas com saldo',sal<0)+
    (vr?card('Vendido',eurz(vr)+' €','proveito '+eurz(vp)+' €',vp<0):'')+
  '</div>';
  var ks=Object.keys(F);
  if(ks.length>1){
    ks.sort(function(a,b){ return F[b].imp-F[a].imp });
    h+='<table class="g ocfamtab"><thead><tr><th>Família</th><th class="n">Verbas</th><th class="n">Disponível</th><th class="n">Imputado</th><th class="n">Saldo</th></tr></thead><tbody>'+
      ks.map(function(k){ var f=F[k]; return '<tr><td class="t">'+esc(k)+'</td><td class="n">'+f.n+'</td><td class="n">'+eurz(f.ca)+' €</td><td class="n">'+eurz(f.imp)+' €</td><td class="n"'+(f.sal<-0.005?' style="color:var(--red)"':'')+'>'+eurz(f.sal)+' €</td></tr>' }).join('')+
      '</tbody></table>';
  }
  return h;
}

    L.push({verba:a.des,cod:a.cod,fam:a.fam||'',ne:r.ne||'',data:dstr(r.data),forn:r.forn||'',pc:r.cod||'',des:r.des||r.obs||'',qt:num(r.qt),val:num(r.qt)*num(r.pu)});
  }) });
  L.sort(function(x,y){
    var a=x[ord.occ.c], b=y[ord.occ.c], r=(typeof a==='string')?String(a).localeCompare(String(b),'pt',{numeric:true}):(a-b);

function ocFilaPorClassificar(){
  var out=[];
  Object.keys(D).forEach(function(k){
    var s=D[k]; if(!s||s.med>=0) return; if(!(s.qne||s.qgr)) return;
    var idxs=(s.ne||[]).filter(function(i){ var r=ST.ne[i]; return r&&!r.anul&&!r.reserva });
    if(!idxs.length) return;
    var r0=ST.ne[idxs[0]];
    if(ehServico({cod:r0.cod,des:r0.des||r0.obs||''})) return;
    var val=0; idxs.forEach(function(i){ val+=num(ST.ne[i].qt)*num(ST.ne[i].pu) });
    out.push({key:k,idxs:idxs,val:val});
  });
  out.sort(function(a,b){ return b.val-a.val });
  return out;
}
function ocSugMap(){
  if(SUGMAP)return SUGMAP;
  SUGMAP={cod:{},semCod:{}};
  SUGNE.forEach(function(row){
    var v={dest:row[4],validado:!!row[5],ehcod:!!row[6]};
    var key=row[0]+'|'+row[1]+'|'+Math.round(row[2]*100)+'|'+Math.round(row[3]*100);
    if(!SUGMAP.cod[key])SUGMAP.cod[key]=v;
    var key2=row[0]+'|'+Math.round(row[2]*100)+'|'+Math.round(row[3]*100);
    if(!SUGMAP.semCod[key2])SUGMAP.semCod[key2]=v;
  });
  return SUGMAP;
}
function ocSugestao(idxs){
  var map=ocSugMap(), votes={}, best=null,bestN=0;
  idxs.forEach(function(i){
    var r=ST.ne[i];
    var keyCod=(r.ne||'')+'|'+(r.cod||'')+'|'+Math.round(num(r.qt)*100)+'|'+Math.round(num(r.qt)*num(r.pu)*100);
    var keySem=(r.ne||'')+'|'+Math.round(num(r.qt)*100)+'|'+Math.round(num(r.qt)*num(r.pu)*100);
    var m=map.cod[keyCod]||map.semCod[keySem]; if(!m)return;
    votes[m.dest]=(votes[m.dest]||0)+1;
    if(votes[m.dest]>bestN){bestN=votes[m.dest];best=m}
  });
  return best;
}

function codigoInventado(cod){
  cod=String(cod||'').trim(); if(!cod)return false;
  if(/^S\/COD\.\d+$/i.test(cod))return true;
  if(/^09\.\d{3}\.\d{2}$/.test(cod))return true;
  return false;
}
function limpaCodigosInventados(){
  var pat=codigoInventado;
  var alvoNE=ST.ne.filter(function(r){ return pat(r.cod) }).length;
  var alvoGR=ST.gr.filter(function(r){ return pat(r.cod) }).length;
  var alvoEx=ST.extra.filter(function(e){ return pat(e.cod) }).length;
  if(!alvoNE&&!alvoGR&&!alvoEx){ toast('Não encontrei nenhum código inventado (S/COD ou 09.XXX.XX) nas NE\'s, guias ou materiais fora do livro.'); return }
  var ok=confirm('Vou apagar o código em '+alvoNE+' linha(s) de NE, '+alvoGR+' de guias, e remover '+alvoEx+' material(is) inventado(s) da lista "sem código" (S/COD.xxx e 09.XXX.XX, que não existem no Livro IP). '+
    'Ficam agrupados pela designação (como já acontece internamente para quem não tem código), sem um código a fingir que é do Livro IP. Continuar?');
  if(!ok)return;
  var nNE=0,nGR=0;
  ST.ne.forEach(function(r){ if(pat(r.cod)){ r.cod=''; nNE++ } });
  ST.gr.forEach(function(r){ if(pat(r.cod)){ r.cod=''; nGR++ } });
  var antes=ST.extra.length;
  ST.extra=ST.extra.filter(function(e){ return !pat(e.cod) });
  var nEx=antes-ST.extra.length;
  buildIX(); render();
  toast('Limpei '+nNE+' linha(s) de NE, '+nGR+' de guias e '+nEx+' material(is) inventado(s).');
}
function fundeVerbasDuplicadas(){
  var grupos={};
  ST.med.forEach(function(a,i){ if(!a.reserva)return; var k=lower((a.des||'').trim()); (grupos[k]=grupos[k]||[]).push(i) });
  var dups=Object.keys(grupos).filter(function(k){ return grupos[k].length>1 });
  if(!dups.length){ toast('Não encontrei verbas com o mesmo nome repetidas.'); return }
  var resumo=dups.map(function(k){ return '• "'+ST.med[grupos[k][0]].des+'" aparece '+grupos[k].length+' vezes' }).join('\n');
  var ok=confirm('Encontrei verbas repetidas:\n\n'+resumo+'\n\nVou apagar as linhas a mais e passar o que tinham (orçamento e NE\'s ligadas) para a primeira. Continuar?');
  if(!ok)return;
  var remover=[];
  dups.forEach(function(k){
    var idxs=grupos[k], principal=ST.med[idxs[0]];
    for(var j=1;j<idxs.length;j++){
      var dup=ST.med[idxs[j]], v=dup._ca||0;
      if(v>0.005){
        principal.lanc=principal.lanc||[];
        principal.lanc.push({_fase:'',mot:'Fusão de verbas',qt:v,pu:1,vig:true,just:'Orçamento vindo da verba duplicada "'+(dup.des||'')+'" ('+(dup.cod||'')+')',doc:'',data:'',src:''});
      }
      ST.ne.forEach(function(r){ if(r.reserva===dup.cod)r.reserva=principal.cod });
      remover.push(idxs[j]);
    }
  });
  remover.sort(function(x,y){ return y-x }).forEach(function(i){ ST.med.splice(i,1) });
  buildIX(); render();
  toast('Fundi '+remover.length+' verba(s) duplicada(s) em '+dups.length+' nome(s).');
}
function verificaCodigosNEGuias(){
  var map={};
  function reg(cod,des,val,tipo){
    var k=norm(cod);
    var g=map[k]||(map[k]={cod:cod,des:des,val:0,n:0,tipos:{}});
    g.val+=val; g.n++; g.tipos[tipo]=1;
  }
  ST.ne.forEach(function(r){ if(r.cod&&!r.anul&&!look(r.cod))reg(r.cod,r.des,num(r.qt)*num(r.pu),'NE') });
  ST.gr.forEach(function(r){ if(r.cod&&!look(r.cod))reg(r.cod,r.des,0,'Guia') });
  var keys=Object.keys(map);
  if(!keys.length){ toast('Todos os códigos usados nas NE\'s e guias existem no catálogo. Nada a assinalar.'); return }
  keys.sort(function(a,b){ return map[b].val-map[a].val });
  var total=0; keys.forEach(function(k){ total+=map[k].val });
  var lista=keys.slice(0,25).map(function(k){ var g=map[k]; return '• '+g.cod+' — '+(g.des||'(sem designação)')+' · '+g.n+' linha(s) · '+eurz(g.val)+' € · '+Object.keys(g.tipos).join('+') }).join('\n')+(keys.length>25?'\n… e mais '+(keys.length-25)+' código(s)':'');
  alert('Encontrei '+keys.length+' código(s) usados em NE\'s ou guias que não existem no catálogo (Livro IP nem materiais fora do livro), '+eurz(total)+' € no total:\n\n'+lista+
    '\n\nSão candidatos a corrigir (se for erro de escrita de um código real) ou a passar por "Rever material sem código" (se for mesmo material sem código IP).');
}
function limpaMedicaoSemCodigo(){

    a._exc=prim?(s.qgr-a._vend-s.nA):0;                  /* recebido − vendido − necessário */
    a._fe=prim?Math.max(0,s.nA-s.qne):0; a._fr=prim?Math.max(0,s.qne-s.qgr):0;
    if(a._dup) a._est='Duplicado';
    else if(a._exc>1e-9 && s.qgr>0) a._est='Sobra';
    else a._est = s.qne<=0 ? (s.qgr>0?'Sem NE':'Por encomendar') : (s.qgr<=0 ? 'Encomendado' : (s.qgr<s.qne-1e-9 ? 'Parcial' : (s.qgr>s.qne+1e-9?'Excesso':'Completo')));
  });
  /* ---------- verbas (Outros Custos): NE ligadas por r.reserva, sem controlo de quantidade ---------- */
  var RSVN=1;
  ST.med.forEach(function(a){ if(a.reserva&&a.cod){ var n=parseInt(String(a.cod).replace(/^RSV/,''),10); if(n>=RSVN)RSVN=n+1 } });
  ST.med.forEach(function(a){
    if(!a.reserva)return;
    if(!a.cod)a.cod='RSV'+String(RSVN++).padStart(4,'0');   /* auto-cura: verbas antigas não tinham código */
    a._imp=0; a._linhasImp=[]; a._vendQ=0; a._vendR=0; a._vendP=0;
  });
  var RSV={}; ST.med.forEach(function(a,i){ if(a.reserva&&a.cod)RSV[a.cod]=i });
  ST.ne.forEach(function(r,i){
    if(!r.reserva)return;
    var ai=RSV[r.reserva]; if(ai==null)return;
    var a=ST.med[ai], v=num(r.qt)*num(r.pu);
    a._imp+=v; a._linhasImp.push(i);
    (r.vendas||[]).forEach(function(x){ a._vendQ+=num(x.qt); a._vendR+=num(x.preco); a._vendP+=num(x.preco)-(num(r.qt)?v/num(r.qt):0)*num(x.qt) });
  });
  ST.med.forEach(function(a){ if(a.reserva&&a.cod){ a._sal=a._ca-a._imp } });
}
function estChip(e){
  var m={'Sobra':['bad','sobra por decidir'],'Sem NE':['bad','recebido sem NE'],'Por encomendar':['none','por encomendar'],'Encomendado':['wait','por receber'],'Parcial':['wait','em parte'],'Completo':['ok','recebido'],'Excesso':['bad','a mais'],'Duplicado':['bad','artigo repetido']};

/* ---------- avisos ---------- */
function avisosAnul(){
  var out=[]; calcRec();
  ST.ne.forEach(function(r){
    if(r.anul&&num(r._rec)>num(r.qt)+1e-9)out.push({t:'Recebido depois de anulada',s:(r.ne||'')+' · '+(r.cod||r.des||'')+' · chegaram '+q(num(r._rec))+' e a linha conta '+q(num(r.qt)),g:'bad',v:'ne',i:0});
  });
  return out;
}
function avisos(){
  var A=[];
  ST.med.forEach(function(a,i){
    if(a._dup) A.push({g:'a',t:'Artigo repetido nas medições',s:(a.cod||'')+' · '+(a.des||'')+' · '+a._nLin+' linhas com o mesmo artigo',v:'med',i:i});
    if(a.cod && !look(a.cod)) A.push({g:'a',t:'Código fora do catálogo',s:a.cod+' · '+(a.des||''),v:'med',i:i});
    if(a.reserva && (a._sal||0)<0) A.push({g:'r',t:'Verba sem saldo',s:(a.des||'')+' · gasto '+eurz(a._imp)+' €, verba '+eurz(a._ca)+' € → faltam '+eurz(-a._sal)+' €',v:'oc',i:i});
  });
  var neKeys={}; ST.ne.forEach(function(r){ neKeys[norm(r.ne)]=1 });
  ST.ne.forEach(function(r,i){
    if(r.cod && !look(r.cod)) A.push({g:'a',t:'NE com código fora do catálogo',s:(r.ne||'sem NE')+' · '+r.cod,v:'ne',i:i});
    if(r.cod && !num(r.qt) && !r.anul) A.push({g:'a',t:'NE sem quantidade',s:(r.ne||'sem NE')+' · '+r.cod,v:'ne',i:i});
  });
  ST.ne.forEach(function(r,i){
    if(r._atr) A.push({g:'r',t:'Já devia ter chegado',s:(r.cod||r.des||'')+' · NE '+(r.ne||'')+' · previsto '+dstr(r.prev)+' · falta '+q(Math.max(0,num(r.qt)-(r._rec||0))),v:'ne',i:i});
  });
  ST.gr.forEach(function(r,i){
    if(r.ne && !neKeys[norm(r.ne)]) A.push({g:'r',t:'Guia sem NE correspondente',s:(r.guia||'sem guia')+' · NE '+r.ne,v:'gr',i:i});
    if(r.cod && !look(r.cod)) A.push({g:'a',t:'Guia com código fora do catálogo',s:(r.guia||'sem guia')+' · '+r.cod,v:'gr',i:i});
  });
  var CO=consumoObra(ST);
  Object.keys(CO).forEach(function(k){
    var s=D[k]||{qgr:0,med:-1};
    var vend=0; (ST.movs||[]).forEach(function(m){ if(m.tipo==='venda'&&keyOf(m.cod||m.des)===k)vend+=num(m.qt) });
    var falta=CO[k]-(s.qgr||0)+vend;
    if(falta>1e-6){
      var it=look(k), a2=s.med>=0?ST.med[s.med]:null;
      A.push({g:'r',t:'Gasto sem ter entrado em stock',
        s:(it?it.cod:(a2?a2.cod:k))+' · '+(it?it.des:(a2?a2.des:''))+' · gasto '+q(CO[k])+', entrou '+q(s.qgr||0)+' → faltam '+q(falta),
        v:'med',i:s.med>=0?s.med:0});
    }
  });
  ST.med.forEach(function(a,i){
    if(a._est==='Excesso') A.push({g:'r',t:'Recebido acima do encomendado',s:(a.cod||a.des)+' · '+q(a._qgr)+' de '+q(a._qne),v:'med',i:i});
  });
  Object.keys(D).forEach(function(k){
    var s=D[k]; if(s.med<0 && (s.qne||s.qgr)){
      var r0=s.ne.length?ST.ne[s.ne[0]]:null;
      if(r0&&ehServico({cod:r0.cod,des:r0.des||r0.obs||''}))return;          /* transportes e outros serviços não são material */
      if(r0&&r0.reserva)return;
      var it=look(k); A.push({g:'a',t:'Encomendado sem estar medido',s:k+' · '+(it?it.des:''),v:'ne',i:s.ne[0]!=null?s.ne[0]:0});
    }
  });
  return A.concat(avisosAnul());
}

var rIdx=0, rHits=[];
function wireSearch(){
  var qi=$('#q'), rb=$('#res'); if(!qi)return;
  function draw(){
    if(!rHits.length){ rb.classList.remove('on'); rb.innerHTML=''; return }
    rb.innerHTML=rHits.map(function(it,j){
      return '<div class="ri'+(j===rIdx?' k':'')+'" data-j="'+j+'"><span class="c">'+esc(it.cod||it.mn||it.sap)+'</span><span class="d">'+esc(it.des)+'</span><span class="f">'+esc(it.src==='X'?'fora do livro':(it.dw||it.fam))+'</span></div>';
    }).join('');
    rb.classList.add('on');
  }
  qi.addEventListener('input',function(){
    var t=lower(qi.value.trim());
    if(t.length<2){ rHits=[]; rIdx=0; draw(); return }
    var out=[];
    for(var i=0;i<SEARCH.length&&out.length<40;i++){ if(SEARCH[i].indexOf(t)>-1)out.push(ITEMS[i]) }
    rHits=out; rIdx=0; draw();
  });
  qi.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();rIdx=Math.min(rIdx+1,rHits.length-1);draw()}
    else if(e.key==='ArrowUp'){e.preventDefault();rIdx=Math.max(rIdx-1,0);draw()}
    else if(e.key==='Enter'){ if(rHits[rIdx]){e.preventDefault();pick(rHits[rIdx])} }
    else if(e.key==='Escape'){ qi.value='';rHits=[];draw() }
  });
  rb.addEventListener('mousedown',function(e){
    var d=e.target.closest('.ri'); if(!d)return; e.preventDefault(); pick(rHits[+d.dataset.j]);
  });
  qi.focus();
}
function pick(it){
  garanteObra();
  var code=it.cod||it.mn||it.sap, k=norm(code);
  var j=-1; ST.med.forEach(function(a,i){ if(a._k===k||keyOf(a.cod)===k)j=i });
  if(j<0){ var a=novoArt(code); a.des=it.des; ST.med.push(a); j=ST.med.length-1; toast('Juntei '+code+' à obra.') }
  else toast(code+' já está na obra.');
  sel=j; render(); abreFicha();
}

function footMed(){
  var co=0,cv=0,ca=0,nsobra=0,vsobra=0,semj=0,npm=0,ndup=0, cur=faseCurso(ST);
  ST.med.forEach(function(a){
    co+=num(a.co); cv+=a._cv; ca+=a._ca;
    if(a._exc>1e-9&&a._qgr>0){ nsobra++; vsobra+=a._exc*pu(a) }
    if(faltaJust(a,cur.id))semj++;
    if(a.pm)npm++; if(a._dup)ndup++;
  });
  $('#ftMed').innerHTML=
    'Orçamento <b class="mono">'+eurz(co)+' €</b> · em vigor <b class="mono">'+eurz(cv)+' €</b> · '+
    'a apresentar <b class="mono">'+eurz(ca)+' €</b> · diferença <b class="mono">'+eurz(ca-cv)+' €</b>'+
    (nsobra?' · <b class="mono">'+nsobra+'</b> com sobra ('+eurz(vsobra)+' €)':'')+
    (semj?' · <b class="mono" style="color:var(--red)">'+semj+'</b> por justificar':'')+
    (npm?' · <b class="mono" style="color:var(--pm-fg)">'+npm+'</b> por medir':'')+
    (ndup?' · <b class="mono" style="color:var(--red)">'+ndup+'</b> repetidos':'');
}
function fundirRepetidos(){
  calc();
  var grupos={}; ST.med.forEach(function(a,i){ (grupos[a._k]=grupos[a._k]||[]).push(i) });
  var chaves=Object.keys(grupos).filter(function(k){ return grupos[k].length>1 });
  if(!chaves.length){ toast('Não há artigos repetidos.'); return }
  if(!confirm(chaves.length+' artigos aparecem mais de uma vez nas medições.\n\n'+
    'OK — fundir cada um numa só linha: as quantidades somam-se, as revisões juntam-se e o código antigo fica guardado.\n'+
    'Cancelar — deixar como está.'))return;
  var tirar=[], n=0;
  chaves.forEach(function(k){
    var ix=grupos[k].slice();
    var pi=0; ix.forEach(function(j,t){ var it=look(ST.med[j].cod); if(it&&norm(it.cod)===norm(ST.med[j].cod))pi=t });   /* fica a linha com o código novo */
    var p=ST.med[ix[pi]]; p.alias=p.alias||[];
    ix.forEach(function(j,t){
      if(t===pi)return;
      var b=ST.med[j];
      p.qo=num(p.qo)+num(b.qo); p.co=num(p.co)+num(b.co);
      if(!num(p.pb)&&num(b.pb))p.pb=b.pb;
      (b.lanc||[]).forEach(function(l){ p.lanc.push(l) });
      (b.pus||[]).forEach(function(x){ p.pus=p.pus||[]; if(!p.pus.some(function(y){ return y.f===x.f })) p.pus.push(x) });
      if(b.cod&&norm(b.cod)!==norm(p.cod)&&p.alias.indexOf(b.cod)<0)p.alias.push(b.cod);
      if(!p.un&&b.un)p.un=b.un; if(!p.destino&&b.destino)p.destino=b.destino;
      p.pm=!!(p.pm&&b.pm);
      tirar.push(j);
    });
    n++;
  });
  tirar.sort(function(x,y){ return y-x }).forEach(function(j){ ST.med.splice(j,1) });
  sel=-1; render(); toast(n+' artigos fundidos; '+tirar.length+' linhas repetidas retiradas.');
}
/* escreve a quantidade acumulada no fim de uma fase: o lançamento da fase passa a ser a diferença */
function poeQtFase(a,fid,novoQ){
  var F=fasePorId(ST,fid), iF=ST.fases.indexOf(F);
  var base=estadoAte(ST,a,fid,false).q, lp=lancDaFase(a,fid), just='', mot=(iF===0?'Medição de obra':'Nova medição'), doc='';
  if(lp){ mot=lp.mot||mot; doc=lp.doc||'' }
  (a.lanc||[]).forEach(function(l){ if(l.f===fid&&temJust(l))just=l.just }); if(!just&&lp)just=lp.just||'';
  a.lanc=(a.lanc||[]).filter(function(l){ return l.f!==fid });
  var d=num(novoQ)-base;
  if(Math.abs(d)>1e-9)a.lanc.push({f:fid,mot:mot,qt:d,pu:pu(a),just:just,doc:doc,data:hoje()});
  if(F&&F.id===faseCurso(ST).id){ delete a.pm; delete a.pmLanc }
}
function poeQo(a,qtd){
  var p0=puOrc(a); if(p0&&!num(a.pb))a.pb=+p0.toFixed(6);
  a.qo=num(qtd); if(num(a.pb))a.co=+(a.qo*num(a.pb)).toFixed(2);
}
function sugereJust(a,fc){
  var d=deltaFase(a,fc.id), un=a.un?' '+a.un:'';
  var t=(d<0?'Quantidade reduzida de ':'Quantidade aumentada de ')+q(a._qv)+' para '+(q(a._qa)||'0')+un+(fc.data?' na medição de '+fc.data:' na medição em curso')+'.';
  if(d<0&&(a._qne>0||a._qgr>0)){
    var nes={}; ((D[a._k]||{ne:[]}).ne).forEach(function(i){ if(ST.ne[i]&&ST.ne[i].ne)nes[ST.ne[i].ne]=1 });
    var ln=Object.keys(nes).slice(0,2);
    t+=' Já encomendados '+q(a._qne)+un+(ln.length?' (NE '+ln.join(', ')+')':'')+(a._qgr>0?', recebidos '+q(a._qgr)+un:'')+'; destino do material a decidir.';
  }

}
function barraCob(nec,qne,qgr){
  nec=num(nec); qne=num(qne); qgr=num(qgr);
  var tot=Math.max(nec,qne); if(tot<=1e-9)return '';
  var rec=Math.min(qgr,qne), aRec=Math.max(0,qne-rec);
  var mk=(qne>nec+1e-9)?'<b style="left:'+(nec/tot*100).toFixed(1)+'%"></b>':'';
  return '<div class="bar3" title="necessário '+q(nec)+' · encomendado '+q(qne)+' · recebido '+q(qgr)+'">'+
    '<i class="r" style="width:'+(rec/tot*100).toFixed(1)+'%"></i><i class="e" style="width:'+(aRec/tot*100).toFixed(1)+'%"></i>'+mk+'</div>';
}
/* artigos que ficaram a zero só porque ainda não foram medidos */
function marcaPm(a,fc){
  a.pmLanc=(a.lanc||[]).filter(function(l){ return l.f===fc.id });
  a.lanc=(a.lanc||[]).filter(function(l){ return l.f!==fc.id });

function porMedirZeros(){
  var fc=faseCurso(ST); calc();

/* ---- grelha de NE ---- */
var LIM=400;
function grupoNEs(){
  var G={}, ordem=[];
  ST.ne.forEach(function(r,i){
    var k=norm(r.ne)||'(sem NE)';
    var g=G[k];
    if(!g){ g=G[k]={ne:r.ne||'(sem NE)',k:k,mc:r.mc||'',data:dstr(r.data),tipo:r.tipo||'',forn:r.forn||'',
      pag:r.pag||'',prev:dstr(r.prev),idx:[],qt:0,val:0,rec:0,atr:0,semCod:0,foraMed:0}; ordem.push(k) }
    g.idx.push(i);
    g.qt+=num(r.qt); g.val+=num(r.qt)*num(r.pu); g.rec+=num(r._rec||0);
    if(!g.forn&&r.forn)g.forn=r.forn;
    if(!g.mc&&r.mc)g.mc=r.mc;
    if(!g.data&&r.data)g.data=dstr(r.data);
    if(!g.pag&&r.pag)g.pag=r.pag;
    if(!g.prev&&r.prev)g.prev=dstr(r.prev);
    if(r._atr)g.atr++;
    if(r.anul)g.anul=(g.anul||0)+1;
    if(r.doc&&!g.doc)g.doc=r.doc;
    if(r.cod&&!look(r.cod))g.semCod++;
    if(r.cod){ var kk=keyOf(r.cod), tem=false; ST.med.forEach(function(x){ if(!tem&&keyOf(x.cod||x.des)===kk)tem=true }); if(!tem)g.foraMed++ }
  });
  return ordem.map(function(k){
    var g=G[k];
    g.est = g.rec<=1e-9 ? 'Por receber' : (g.rec<g.qt-1e-9 ? 'Recebida em parte' : (g.rec>g.qt+1e-9?'Recebida a mais':'Recebida'));
    g.pct = g.qt? Math.min(100,g.rec/g.qt*100) : 0;
    return g;
  });
}

/* ---- documentos das notas de encomenda ---- */
var DOCS={};   /* chave da NE -> {nome, url} nesta sessão */
function chaveDoc(s){ return norm(String(s||'')).replace(/[^A-Z0-9]/g,'') }
function ligaDocs(files){
  var n=0, novos=[];
  var chaves={};
  OBRAS.forEach(function(o){ o.ne.forEach(function(r){ if(r.ne)chaves[chaveDoc(r.ne)]=r.ne }) });
  Array.prototype.forEach.call(files,function(f){
    var nome=f.name, base=chaveDoc(nome.replace(/\.[a-z0-9]+$/i,''));
    var alvo=null;
    Object.keys(chaves).forEach(function(k){
      if(!alvo&&k.length>=5&&base.indexOf(k)>-1)alvo=k;
    });
    if(!alvo){
      var m=nome.match(/\d{8,}/);
      if(m&&chaves[chaveDoc(m[0])])alvo=chaveDoc(m[0]);
    }
    if(!alvo){ novos.push(nome); return }
    DOCS[alvo]={nome:nome, url:URL.createObjectURL(f)};
    OBRAS.forEach(function(o){ o.ne.forEach(function(r){ if(chaveDoc(r.ne)===alvo)r.doc=nome }) });
    n++;

/* quantidade recebida por linha de NE (repartida por NE+código) */
function calcRec(){
  var rec={};
  ST.gr.forEach(function(g){ var k=norm(g.ne)+'|'+rowKey(g); rec[k]=(rec[k]||0)+num(g.qt) });
  var used={};
  ST.ne.forEach(function(r){
    var k=norm(r.ne)+'|'+rowKey(r);
    var disp=(rec[k]||0)-(used[k]||0);
    var take=Math.max(0,Math.min(num(r.qt),disp));
    if(disp>num(r.qt)&&!ST.ne.some(function(o){return o!==r&&norm(o.ne)===norm(r.ne)&&rowKey(o)===rowKey(r)})) take=disp;
    used[k]=(used[k]||0)+take;
    r._rec=take;
    var it=look(r.cod); r._des=it?it.des:(r.des||r.obs||'');
    r._est = take<=0 ? 'Por receber' : (take<num(r.qt)-1e-9 ? 'Recebida em parte' : (take>num(r.qt)+1e-9?'Recebida a mais':'Recebida'));
    r._atr = !!(r.prev && dstr(r.prev) < hoje() && take < num(r.qt)-1e-9);
  });
}

/* ---- grelha de guias ---- */
function grupoGuias(){
  calcRec();
  var G={}, ordem=[];
  var neKeys={}; ST.ne.forEach(function(r){ neKeys[norm(r.ne)+'|'+rowKey(r)]=1; neKeys[norm(r.ne)]=1 });
  ST.gr.forEach(function(r,i){
    var k=norm(r.guia)||'(sem guia)';
    var g=G[k];
    if(!g){ g=G[k]={guia:r.guia||'(sem guia)',k:k,ne:r.ne||'',data:dstr(r.data),forn:r.forn||'',local:r.local||'',
      idx:[],qt:0,semCod:0,foraNE:0,semNE:0}; ordem.push(k) }
    g.idx.push(i); g.qt+=num(r.qt);
    if(!g.ne&&r.ne)g.ne=r.ne;
    if(!g.forn&&r.forn)g.forn=r.forn;
    if(!g.local&&r.local)g.local=r.local;
    if(!g.data&&r.data)g.data=dstr(r.data);
    if(r.cod&&!look(r.cod))g.semCod++;
    if(!r.ne)g.semNE++;
    else if(!neKeys[norm(r.ne)+'|'+rowKey(r)])g.foraNE++;
  });
  return ordem.map(function(k){ return G[k] });
}

/* ---- materiais em todas as obras ---- */
function globalMateriais(){
  var keep=ST, M={}, ordem=[];
  function linha(k){
    if(!M[k]){ M[k]={k:k,cod:'',des:'',fam:'',un:'',qne:0,val:0,qgr:0,nec:0,nvig:0,obras:[],locais:{},forn:{}}; ordem.push(k) }
    return M[k];
  }
  OBRAS.forEach(function(o,i){
    ST=o; calc(); calcRec();
    Object.keys(D).forEach(function(k){
      var s=D[k];
      if(slotEhVerba(s,o))return; /* Outros Custos: já é dinheiro imputado, não stock */
      var a=s.med>=0?o.med[s.med]:null;
      if(!s.qne&&!s.qgr&&!s.nV&&!s.nA)return;
      var L=linha(k), it=look(a?a.cod:k);
      var rne=s.ne.length?o.ne[s.ne[0]]:null, rgr=s.gr.length?o.gr[s.gr[0]]:null;
      var semCod=k.indexOf('DES:')===0;
      if(!L.cod&&!semCod)L.cod=(a&&a.cod)||(it?it.cod:'')||k;
      if(!L.des)L.des=(it?it.des:'')||(a&&a.des)||(rne&&(rne.des||rne.obs))||(rgr&&(rgr.des||rgr.obs))||k.replace(/^DES:/,'');
      if(semCod&&!L.fam)L.fam='Sem código';
      if(!L.fam)L.fam=it?(it.fam||''):'Fora do catálogo';
      if(!L.un&&a&&a.un)L.un=a.un;
      var nec=s.nA||0, nvig=s.nV||0;
      L.qne+=s.qne; L.val+=s.vne; L.qgr+=s.qgr; L.nec+=nec; L.nvig+=nvig;
      L.obras.push({i:i,cc:o.obra||'',nome:o.nome||'',qne:s.qne,qgr:s.qgr,nec:nec,med:s.med});
    });
    o.gr.forEach(function(r){ if(r.local){ var L=M[rowKey(r)]; if(L)L.locais[r.local]=(L.locais[r.local]||0)+num(r.qt) } });
    o.ne.forEach(function(r){ if(r.forn){ var L=M[rowKey(r)]; if(L)L.forn[r.forn]=1 } });
  });
  ST=keep; calc(); calcRec();
  var CO=consumoTotal(), MV=totaisMov();
  return ordem.map(function(k){
    var L=M[k];
    L.cons=CO[k]||0;
    var mv=MV[k]||{vend:0,vendVal:0,empr:0,transExt:0};
    L.vend=mv.vend; L.vendVal=mv.vendVal; L.empr=mv.empr;
    L.transf=-(mv.transExt||0);        /* transferências para fora da app; entre obras da app anulam-se */
    L.stock=L.qgr-L.cons-L.vend+L.transf;
    L.disp=L.stock-L.empr;
    L.semStock=L.stock<-1e-9;                 /* gastou-se mais do que entrou */
    L.semEntrada=(L.cons>1e-9&&L.qgr<=1e-9);  /* gastou-se sem nunca ter entrado */
    L.sobra=L.qgr-L.vend-L.nec;
    L.pu=L.qne? L.val/L.qne : 0;
    L.vsobra=L.sobra>0? L.sobra*L.pu : 0;
    L.porReceber=Math.max(0,L.qne-L.qgr);
    return L;
  });
}

/* ---- reorçamentos (fases e justificações) ---- */
function estadoAte(o,a,fid,incl){
  var q=num(a.qo), p=puOrc(a), parar=false;
  (o.fases||[]).forEach(function(f){
    if(parar)return;
    if(f.id===fid&&!incl){ parar=true; return }
    (a.lanc||[]).forEach(function(l){ if(l.f===f.id)q+=num(l.qt) });
    (a.pus||[]).forEach(function(x){ if(x.f===f.id&&num(x.pu))p=num(x.pu) });
    if(f.id===fid)parar=true;
  });
  return {q:q,p:p};
}
function totaisFase(o,fid){
  var t={qt:0,cu:0,cuQt:0,cuPu:0,n:0,nPu:0,mot:{},semJust:0};
  o.med.forEach(function(a){
    var A=estadoAte(o,a,fid,false), B=estadoAte(o,a,fid,true);
    var dq=B.q-A.q, dp=B.p-A.p;
    if(Math.abs(dq)>1e-9){
      t.qt+=dq; t.cuQt+=dq*A.p;
      var l=null; (a.lanc||[]).forEach(function(x){ if(x.f===fid)l=x });
      t.n++;
      var m=(l&&l.mot)||'Outro';
      var x2=t.mot[m]||(t.mot[m]={n:0,qt:0,cu:0}); x2.n++; x2.qt+=dq; x2.cu+=dq*A.p;
      if((dq>1e-9||(dq<-1e-9&&(num(a._qne)>0||num(a._qgr)>0)))&&!temJust(l))t.semJust++;
    }
    if(Math.abs(dp)>1e-9){
      t.nPu++; t.cuPu+=B.q*dp;
      var px=null; (a.pus||[]).forEach(function(y){ if(y.f===fid)px=y });
      var mp='Custo seco ('+((px&&px.fonte)||'revisto')+')';
      var x3=t.mot[mp]||(t.mot[mp]={n:0,qt:0,cu:0}); x3.n++; x3.cu+=B.q*dp;
    }
  });
  t.cu=t.cuQt+t.cuPu;
  return t;
}

/* ---- materiais de uma guia: vêm da nota de encomenda ---- */
function itensDaNE(neNum, jaTem){
  calcRec();
  var out=[], G={}, ordem=[], k=norm(neNum);
  if(!k)return out;
  ST.ne.forEach(function(r){
    if(norm(r.ne)!==k)return;
    var kk=rowKey(r), it=look(r.cod);
    var g=G[kk];
    if(!g){ g=G[kk]={cod:r.cod||'', des:it?it.des:(r.des||''), enc:0, rec:0, kk:kk}; ordem.push(kk) }
    g.enc+=num(r.qt); g.rec+=num(r._rec||0);
  });
  ordem.forEach(function(kk){
    var g=G[kk];
    var pre=(jaTem||{})[kk];
    out.push({cod:g.cod, des:g.des, kk:kk, enc:g.enc, rec:g.rec,
      falta:Math.max(0,g.enc-g.rec), qt:pre!=null?pre:'', sel:pre!=null, livre:false});
  });
  return out;
}

function recarregaItensGuia(){
  var jaTem={};
  MF.itens.forEach(function(it){ if(!it.livre&&num(it.qt))jaTem[it.kk||keyOf(it.cod)]=it.qt });
  var livres=MF.itens.filter(function(it){ return it.livre });
  MF.itens=itensDaNE(MF.cab.ne,jaTem).concat(livres);
  if(!MF.itens.length)MF.itens=[{cod:'',des:'',qt:'',livre:true,sel:true}];
  desenhaItensGuia();
}

function juntaItem(){
  MF.itens.push(itemVazio());
  desenhaItens(MF.itens.length-1);

function sugere(txt){
  var t=lower(String(txt).trim());
  if(t.length<2)return [];
  var out=[];
  for(var i=0;i<SEARCH.length&&out.length<4;i++){ if(SEARCH[i].indexOf(t)>-1)out.push(ITEMS[i]) }
  if(!out.length){
    var alvo=t.replace(/[^a-z0-9]/g,'');
    for(var j=0;j<ITEMS.length&&out.length<4;j++){
      var c=lower(ITEMS[j].cod||'').replace(/[^a-z0-9]/g,'');
      if(c&&(c.indexOf(alvo)===0||alvo.indexOf(c)===0))out.push(ITEMS[j]);
    }
  }
  return out;
}
function validaForm(){
  var ne=(MF.tipo==='ne'||MF.tipo==='neEdit'), d=MF.cab, av=[];
  if(MF.tipo==='gr'||MF.tipo==='grEdit'){
    if(!d.guia)av.push(['a','Sem número de guia.','']);
    if(!d.ne)av.push(['a','Guia sem nota de encomenda associada. Fica marcada como «sem NE».','']);
    else if(!ST.ne.some(function(r){ return norm(r.ne)===norm(d.ne) }))
      av.push(['r','A NE <b>'+esc(d.ne)+'</b> não existe nesta obra. Cria-a primeiro, ou lança os materiais como «fora da NE».','']);
    var n2=0, aMais=[];
    MF.itens.forEach(function(it,i){
      if(!num(it.qt))return;
      n2++;
      if(!it.livre&&num(it.qt)>it.falta+1e-9)
        aMais.push((it.cod||'')+': '+q(num(it.qt))+' para '+q(it.falta)+' em falta');
      if(it.livre){
        var cel=$('#mi_'+i);
        var item=it.cod?look(it.cod):null;
        if(cel)cel.innerHTML=item?'<span style="color:var(--ok)">'+esc(item.des)+'</span>':(it.cod?'<span style="color:var(--amber)">sem correspondência no catálogo</span>':'');
        if(!it.cod&&!it.des)av.push(['a','Material fora da NE sem código nem designação.','']);
      }
    });
    if(aMais.length)av.push(['a','Chega mais do que faltava: '+esc(aMais.join(' · '))+'.','']);
    if(!n2)av.push(['a','Ainda não marcaste nenhum material como chegado.','']);
    $('#mAvisos').innerHTML=av.map(function(x){ return '<div class="al '+x[0]+'"><span>'+x[1]+'</span>'+(x[2]||'')+'</div>' }).join('');
    var nb2=$('#mOk'); if(nb2)nb2.textContent = MF.tipo==='grEdit' ? 'Guardar alterações' : (n2>1?'Guardar '+n2+' linhas':'Guardar');
    return;
  }
  if(ne&&!d.ne)av.push(['a','Sem número de nota de encomenda.','']);
  if(!ne&&!d.guia)av.push(['a','Sem número de guia.','']);
  if(!ne){
    if(!d.ne)av.push(['a','Guia sem nota de encomenda associada. Fica marcada como «sem NE».','']);
    else {
      var existe=false; ST.ne.forEach(function(r){ if(norm(r.ne)===norm(d.ne))existe=true });
      if(!existe)av.push(['r','A NE <b>'+esc(d.ne)+'</b> não existe nesta obra.','']);
    }
  }
  var nItens=0;
  MF.itens.forEach(function(it,i){
    var cel=$('#mi_'+i); if(!cel)return;
    if(MF.tipo==='neEdit'&&it.i>=0){
      var rr=ST.ne[it.i];
      if(rr&&rr._rec!=null&&num(rr._rec)>0){}
    }
    if(!it.cod&&!num(it.qt)){ cel.innerHTML=''; return }

function semCodigoIP(){
  var out=[];
  MF.itens.forEach(function(it,i){
    if(!it.cod&&!it.des)return;
    if(!it.cod&&!num(it.qt)&&!it.des)return;
    if(it.cod&&look(it.cod))return;
    out.push({i:i,it:it});
  });
  return out;
}
function tratarSemCodigo(ondeNe){
  var fora=semCodigoIP();
  if(!fora.length)return true;
  var lista=fora.map(function(x){ return '• '+(x.it.cod||'(sem código)')+(x.it.des?' — '+x.it.des:'') }).join('\n');
  var r=confirm(fora.length===1?'Este material não tem código IP:\n\n'+lista+'\n\nJuntar à lista de materiais sem código?'
    :'Estes '+fora.length+' materiais não têm código IP:\n\n'+lista+'\n\nJuntar à lista de materiais sem código?');
  if(!r)return true;
  var n=0, semDes=0, rep=0;
  fora.forEach(function(x){
    var it=x.it;
    if(!it.des){ semDes++; return }
    var cod=it.cod;
    if(!cod){
      var base='S/COD.', m2=0;
      ST.extra.forEach(function(e){ var mm=String(e.cod||'').match(/^S\/COD\.(\d+)$/); if(mm)m2=Math.max(m2,+mm[1]) });
      cod=base+('00'+(m2+1)).slice(-3);
      it.cod=cod;
      var inp=$('#mItens input[data-i="'+x.i+'"][data-k="cod"]'); if(inp)inp.value=cod;
    }
    if(ST.extra.some(function(e){ return norm(e.cod)===norm(cod) }))return;
    var igual=null;
    ST.extra.forEach(function(e){ if(!igual&&e.des&&lower(e.des)===lower(it.des))igual=e });
    if(igual){
      it.cod=igual.cod;
      var inp2=$('#mItens input[data-i="'+x.i+'"][data-k="cod"]'); if(inp2)inp2.value=igual.cod;
      rep++;
      return;
    }
    ST.extra.push({cod:cod,mn:'',sap:'',des:it.des,dw:'',fam:'',un:'',
      nota:'sem código IP · criado ao lançar '+(ondeNe?('a NE '+(MF.cab.ne||'')):('a guia '+(MF.cab.guia||'')))});
    n++;
  });
  buildIX();
  if(n)toast('Juntei '+n+(n===1?' material':' materiais')+' à lista de materiais sem código.');
  if(rep)toast(rep+(rep===1?' material já existia':' materiais já existiam')+' na lista: usei o código que já lá estava.');
  if(semDes)toast(semDes+' sem designação ficaram de fora: escreve a designação para os poder juntar.');
  return true;
}
function guardaForm(fecha){
  if(MF.tipo==='mov'){ guardaMov(); return }
  if(MF.tipo==='preview'){ fechaForm(); renderMC(); return }
  if(MF.tipo==='ne'||MF.tipo==='gr')tratarSemCodigo(MF.tipo==='ne');
  if(MF.tipo==='grEdit'){
    tratarSemCodigo(false);
    var dg=MF.cab, vivas={}, novasG=[];
    MF.itens.forEach(function(it){
      if(it.i!=null){
        if(!num(it.qt))return;                 /* fica para apagar */
        var r=ST.gr[it.i]; vivas[it.i]=1;
        r.guia=dg.guia; r.ne=dg.ne; r.data=dg.data; r.forn=dg.forn; r.local=dg.local; r.obs=dg.obs;
        r.cod=it.cod; r.qt=num(it.qt);
        r.des=look(it.cod)?'':(it.des==null?'':String(it.des));
      } else if(num(it.qt)){
        novasG.push({guia:dg.guia,ne:dg.ne,data:dg.data,cod:it.cod,des:(look(it.cod)?'':(it.des||'')),
          forn:dg.forn,qt:num(it.qt),local:dg.local,obs:dg.obs});
      }
    });
    var foraG=[];
    (MF.idxOrig||[]).forEach(function(i){ if(!vivas[i])foraG.push(i) });
    MF.itens.forEach(function(it){ (it.extras||[]).forEach(function(j){ if(foraG.indexOf(j)<0)foraG.push(j) }) });
    foraG.sort(function(x,y){return y-x}).forEach(function(i){ ST.gr.splice(i,1) });
    novasG.forEach(function(r){ ST.gr.unshift(r) });
    fechaForm(); render();
    toast('Guia '+(dg.guia||'')+' atualizada'+(novasG.length?', com '+novasG.length+(novasG.length===1?' linha nova':' linhas novas'):'')+'.');
    return;
  }
  if(MF.tipo==='neEdit'){
    tratarSemCodigo(true);
    var d2=MF.cab, vivos={}, novasN=[];
    var zeros=MF.itens.filter(function(it){ return it.i>=0&&it.cod&&!num(it.qt) });
    var tirarZeros=false;                 /* uma linha sem quantidade fica anulada, não desaparece */
    MF.itens.forEach(function(it){
      if(!it.cod&&!num(it.qt))return;
      if(tirarZeros&&it.i>=0&&it.cod&&!num(it.qt))return;
      if(it.i>=0){
        var r=ST.ne[it.i]; vivos[it.i]=1;
        r.mc=d2.mc; r.ne=d2.ne; r.data=d2.data; r.tipo=d2.tipo; r.forn=d2.forn; r.pag=d2.pag; r.prev=d2.prev;
        var antesQt=num(r.qt);
        r.cod=it.cod; r.qt=num(it.qt); r.pu=num(it.pu);
        if(!num(it.qt)&&antesQt>0&&!r.anul){ r.qtOrig=antesQt; r.anul=true; r.anulData=hoje(); r.anulMot=r.anulMot||MOTANUL[0] }
        r.obs=(it.obs==null?'':String(it.obs));
        r.des=look(it.cod)?'':(it.des==null?'':String(it.des));
        if(r.des==null)r.des='';
      } else {
        novasN.push({mc:d2.mc,ne:d2.ne,data:d2.data,tipo:d2.tipo,forn:d2.forn,pag:d2.pag,prev:d2.prev,
          doc:(ST.ne[MF.idx0]||{}).doc||'',cod:it.cod,des:(look(it.cod)?'':(it.des||'')),
          qt:num(it.qt),pu:num(it.pu),obs:it.obs||''});
      }
    });
    var foraN=[];
    (MF.idxOrig||[]).forEach(function(i){ if(!vivos[i])foraN.push(i) });
    foraN.sort(function(x,y){return y-x}).forEach(function(i){ ST.ne.splice(i,1) });
    novasN.forEach(function(r){ ST.ne.unshift(r) });
    fechaForm(); render();
    toast('Encomenda '+(d2.ne||'')+' atualizada'+(novasN.length?', com '+novasN.length+(novasN.length===1?' linha nova':' linhas novas'):'')+'.');
    return;
  }
  if(MF.tipo==='escolha'){
    var sel2=[];
    $$('#escLista [data-esc]').forEach(function(e){ if(e.checked)sel2.push(ST.med[+e.dataset.esc]) });
    fechaForm();
    if(MF.escolha)MF.escolha(sel2);
    return;
  }
  var d=MF.cab, ne=MF.tipo==='ne', n=0;
  MF.itens.slice().reverse().forEach(function(it){
    if(!ne){ if(!num(it.qt))return; }
    else if(!it.cod&&!num(it.qt))return;
    if(ne)ST.ne.unshift({mc:d.mc||'',ne:d.ne||'',data:d.data||'',tipo:d.tipo||'NE',cod:it.cod,des:it.des||'',
      forn:d.forn||'',qt:num(it.qt),pu:num(it.pu),pag:d.pag||'',prev:d.prev||'',
      obs:[d.obs,it.obs].filter(Boolean).join(' · ')});
    else ST.gr.unshift({guia:d.guia||'',ne:d.ne||'',data:d.data||'',cod:it.cod,des:it.des||'',forn:d.forn||'',
      qt:num(it.qt),local:d.local||'',obs:[d.obs,it.obs].filter(Boolean).join(' · ')});
    n++;
  });
  if(!n){ toast('Escreve pelo menos um material.'); return }
  render();
  toast(n+(n===1?' linha adicionada':' linhas adicionadas')+(ne?' à NE '+(d.ne||'sem número'):' à guia '+(d.guia||'sem número'))+'.');
  if(fecha)fechaForm();
  else abreForm(MF.tipo, ne?{mc:d.mc,ne:'',data:d.data,tipo:d.tipo,forn:d.forn,pag:d.pag,prev:d.prev}
                          :{guia:'',ne:d.ne,data:d.data,forn:d.forn,local:d.local});
}

    obs:'Resulta do mapa comparativo «'+(m.titulo||'')+'»'+(f.ref?', proposta '+f.ref:''),

function exportarProposta(pr){
  var A=[];
  A.push(['PROPOSTA DE NOTA DE ENCOMENDA']);
  A.push([]);
  A.push(['Obra', (ST.obra||'')+' · '+(ST.nome||'')]);
  A.push(['Fornecedor', pr.forn||'']);
  A.push(['Proposta do fornecedor', pr.ref||'']);
  A.push(['Mapa comparativo', pr.mcNome||'']);
  A.push(['Data', pr.data||'']);
  A.push(['Condições de pagamento', pr.pag||'']);
  A.push(['Prazo de entrega', pr.prazo||'']);
  A.push(['Local de entrega', pr.local||'']);
  A.push(['Observações', pr.obs||'']);
  A.push([]);
  A.push(['Pos','Código IP','Nomenclatura','Designação','Un','Quantidade','Preço unit. (€)','Valor (€)']);
  var t=0;
  pr.itens.forEach(function(it,i){
    var it2=look(it.cod), v=num(it.qt)*num(it.pu); t+=v;
    A.push([i+1, it.cod, it2?it2.sap:'', it.des||(it2?it2.des:''), it.un, num(it.qt)||null, num(it.pu)||null, +v.toFixed(2)||null]);
  });
  A.push([]);
  A.push(['','','','','','','TOTAL', +t.toFixed(2)]);
  var ws=XLSX.utils.aoa_to_sheet(A);
  ws['!cols']=[{wch:6},{wch:14},{wch:14},{wch:54},{wch:7},{wch:13},{wch:15},{wch:15}];
  var ref=XLSX.utils.decode_range(ws['!ref']);
  for(var r=12;r<=ref.e.r;r++)for(var c=5;c<=7;c++){
    var cl=ws[XLSX.utils.encode_cell({r:r,c:c})]; if(cl&&cl.t==='n')cl.z=M2;
  }
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Proposta de NE');
  guardaWb(wb,('Proposta NE - '+(ST.obra||'')+' - '+(pr.forn||'fornecedor')).replace(/[\\\/:*?"<>|]/g,'-')+'.xlsx');
  toast('Proposta exportada com '+pr.itens.length+' artigos.');
}

function imprimeJanela(w,ms){
  var feito=false, falta=0;
  function fim(){ if(feito)return; feito=true; try{ w.focus(); w.print() }catch(e){} }
  Array.prototype.forEach.call(w.document.images,function(im){ if(!(im.complete&&im.naturalWidth>0)){ falta++; im.onload=im.onerror=function(){ if(--falta<=0)fim() } } });
  if(!falta)setTimeout(fim,ms||250);
  setTimeout(fim,3000);
}
function imprimeProposta(pr){

    'th{background:#eee;text-align:left}'+

/* ---- vendas e empréstimos de material ---- */
function movsObra(o){ o=o||ST; o.movs=o.movs||[]; return o.movs }
function movKey(x){ return x.cod?keyOf(x.cod):'DES:'+norm(x.des||'sem identificação') }
/* transferência: sai da obra onde está registada; se o destino for uma obra da app, entra lá */
function idxDestTransf(m){
  if(!m||m.tipo!=='transferencia'||m.destTipo!=='app')return -1;
  var k=norm(m.destino||''); if(!k)return -1;
  for(var i=0;i<OBRAS.length;i++){ if(norm(OBRAS[i].obra||OBRAS[i].nome||'')===k)return i }
  return -1;
}
function totaisMov(){
  var T={};
  OBRAS.forEach(function(o){
    (o.movs||[]).forEach(function(m){
      var k=movKey(m);
      var t=T[k]||(T[k]={vend:0,vendVal:0,empr:0,dev:0,transExt:0});
      if(m.tipo==='venda'){ t.vend+=num(m.qt); t.vendVal+=num(m.valor) }
      else if(m.tipo==='emprestimo'){ if(m.devolvido)t.dev+=num(m.qt); else t.empr+=num(m.qt) }
      else if(m.tipo==='transferencia'){ if(idxDestTransf(m)<0)t.transExt+=num(m.qt) }
    });
  });
  return T;
}
function consumoObra(o){
  o=o||ST; var C={};
  (o.cons||[]).forEach(function(c){ c.linhas.forEach(function(l){
    var k=movKey(l); C[k]=(C[k]||0)+num(l.qt);
  }) });
  return C;
}
function consumoTotal(){
  var C={};
  OBRAS.forEach(function(o){
    (o.cons||[]).forEach(function(c){ c.linhas.forEach(function(l){
      var k=movKey(l); C[k]=(C[k]||0)+num(l.qt);
    }) });
  });
  return C;
}
function abreMov(tipo,base,obraIdx){
  garanteObra();
  MF.tipo='mov'; MF.movTipo=tipo; MF.obraIdx=(obraIdx===undefined||obraIdx===null||obraIdx==='')?null:obraIdx;
  var d=base||{cod:'',des:'',un:'',qt:'',valor:'',pu:'',destTipo:'fora',just:'',destino:'',local:'',data:hoje(),nota:''};
  if(!d.pu&&num(d.valor)&&num(d.qt))d.pu=+(num(d.valor)/num(d.qt)).toFixed(4);
  if(!d.destTipo)d.destTipo='fora';
  var oOrig=(MF.obraIdx!=null&&OBRAS[MF.obraIdx])?OBRAS[MF.obraIdx]:ST, kOrig=norm(oOrig.obra||oOrig.nome||'');
  var outras=OBRAS.filter(function(o){ return norm(o.obra||o.nome||'')!==kOrig });
  if(tipo==='transferencia'&&!d.destino)d.destino=outras.length?(outras[0].obra||outras[0].nome||''):'__fora__';
  MF.cab=d;
  $('#mTit').textContent = (tipo==='venda' ? 'Venda de material' : (tipo==='transferencia' ? 'Transferência de material' : 'Empréstimo de material'))+' · '+(oOrig.obra||oOrig.nome||'obra ativa');
  var h=campo('c4','Código','cod',d.cod,{ph:'código IP ou sem código'})+
        campo('c8','Designação','des',d.des)+
        campo('c2','Quantidade','qt',d.qt,{cls:'num'})+
        campo('c2','Unidade','un',d.un)+
        (tipo==='venda'
          ? campo('c3','Preço unitário (€)','pu',d.pu,{cls:'num'})+campo('c5','Comprador','destino',d.destino)+
            '<div class="fld c4"><label for="m_destTipo">Tipo de destino</label><select id="m_destTipo" data-cab="destTipo">'+
              DESTTIPOS.map(function(x){ return '<option value="'+x[0]+'"'+(d.destTipo===x[0]?' selected':'')+'>'+x[1]+'</option>' }).join('')+'</select></div>'+
            campo('c8','Justificação (obrigatória se for abaixo do custo)','just',d.just)
          : (tipo==='transferencia'
              ? '<div class="fld c5"><label for="m_destino">Para a obra</label><select id="m_destino" data-cab="destino">'+
                outras.map(function(o){ var v=o.obra||o.nome||''; return '<option value="'+esc(v)+'"'+(d.destino===v?' selected':'')+'>'+esc(v+(o.nome&&o.obra?' · '+o.nome:''))+'</option>' }).join('')+
                '<option value="__fora__"'+(d.destino==='__fora__'?' selected':'')+'>Outro (fora da app)…</option></select></div>'+
                campo('c4','Se for fora da app: obra ou centro de custo','destFora',d.destFora,{ph:'4002500'})+campo('c3','Onde fica','local',d.local)
              : campo('c4','Obra ou centro de custo','destino',d.destino,{ph:'4002500'})+campo('c4','Onde fica','local',d.local)))+
        campo('c3','Data','data',d.data,{cls:'mono'})+
        campo('c12','Nota','nota',d.nota)+
        '<div class="fld c12"><div class="eco" id="movEco" style="font-size:12px;color:var(--muted)"></div></div>';
  $('#mBody').innerHTML=h;
  $$('#mBody [data-cab]').forEach(function(e){
    e.addEventListener('input',function(){ MF.cab[e.dataset.cab]=e.value; validaMov() });
    e.addEventListener('change',function(){ MF.cab[e.dataset.cab]=e.value; validaMov() });
  });
  $('#mMais').style.display='none';
  $('#mDel').hidden=true;
  $('#mOk').textContent='Registar';
  $('#modal').hidden=false;
  validaMov();
  var f=$('#m_cod'); if(f)f.focus();
}
function validaMov(){
  var d=MF.cab, av=[], it=d.cod?look(d.cod):null, k=d.cod?keyOf(d.cod):'';
  var eco=$('#movEco');
  if(it&&!d._des){ d.des=it.des; var e2=$('#m_des'); if(e2&&e2.value!==it.des)e2.value=it.des }
  if(!k&&d.des)k='DES:'+norm(d.des);
  var oi2=(MF.obraIdx!=null)?MF.obraIdx:null;
  var G=null; (oi2!=null?stockBase(oi2):globalMateriais()).forEach(function(L){ if(L.k===k)G=L });
  if(eco){
    eco.innerHTML = G
      ? (oi2!=null
          ? 'Nesta obra: recebido '+q(G.qgr)+' · gasto '+q(G.cons)+' · vendido '+q(G.vend)+(Math.abs(G.transf||0)>1e-9?' · transferido '+q(G.transf):'')+' · <b>stock '+q(G.stock)+'</b> · disponível '+q(G.disp)
          : 'Recebido '+q(G.qgr)+' · preciso nas obras '+q(G.nec)+' · sobra '+q(Math.max(0,G.sobra)))+
        (G.pu?' · preço de compra '+nf2.format(G.pu)+' €':'')
      : (d.cod?'Este material ainda não tem receções registadas.':'');
  }
  if(!d.cod&&!d.des)av.push(['a','Escreve o código ou pelo menos a designação.','']);
  if(!num(d.qt))av.push(['a','Sem quantidade.','']);
  if(G&&oi2!=null&&num(d.qt)>G.disp+1e-9)av.push(['a','Estás a mexer em '+q(num(d.qt))+' e só há '+q(G.disp)+' disponível nesta obra.','']);
  else if(G&&oi2==null&&num(d.qt)>G.qgr+1e-9)av.push(['a','Estás a mexer em '+q(num(d.qt))+' e só entraram '+q(G.qgr)+' em obra.','']);
  if(MF.movTipo==='transferencia'){
    if(d.destino==='__fora__'&&!String(d.destFora||'').trim())av.push(['a','Escreve a obra ou centro de custo de destino.','']);
    else if(d.destino!=='__fora__'&&d.destino)av.push(['o','Sai do stock desta obra e entra no stock de '+esc(d.destino)+'. Não tem valor de venda.','']);
  }
  MF.abaixo=false;
  if(MF.movTipo==='venda'&&!num(d.pu))av.push(['a','Venda sem preço unitário: não entra proveito nenhum nas contas.','']);
  if(MF.movTipo==='emprestimo'&&!d.destino)av.push(['a','Sem obra ou centro de custo de destino.','']);
  if(MF.movTipo==='venda'&&num(d.pu)&&num(d.qt)){
    d.valor=+(num(d.pu)*num(d.qt)).toFixed(2);
    var ult=d.cod?ultimoPreco(d.cod):null, cu=(G&&G.pu)||0;
    if(cu){
      var marg=(num(d.pu)-cu)/cu*100, dif=d.valor-cu*num(d.qt);
      var et=Math.abs(marg)<=2?'ao custo':(marg>0?'com margem +'+marg.toFixed(0)+'%':'abaixo do custo '+marg.toFixed(0)+'%');
      MF.abaixo=marg<-2;
      av.push([marg>=-2?'o':'a','Total '+eurz(d.valor)+' € · custo médio '+nf2.format(cu)+' €/un'+(ult&&ult.pu?' · última compra '+nf2.format(num(ult.pu))+' €':'')+' · <b>'+et+'</b> · '+(dif>=0?'mais-valia':'menos-valia')+' de '+eurz(Math.abs(dif))+' €.','']);
      if(MF.abaixo&&!String(d.just||'').trim())av.push(['a','Vendes abaixo do custo: escreve a justificação.','']);
    } else av.push(['o','Total '+eurz(d.valor)+' €. Sem preço de compra para comparar.','']);
  }
  $('#mAvisos').innerHTML=av.map(function(x){ return '<div class="al '+x[0]+'"><span>'+x[1]+'</span></div>' }).join('');
}
function guardaMov(){
  var d=MF.cab;
  if(!d.cod&&!d.des){ toast('Escreve o código ou a designação.'); return }
  if(!num(d.qt)){ toast('Escreve a quantidade.'); return }
  if(MF.movTipo==='venda'&&!num(d.pu)){ toast('Escreve o preço unitário.'); return }
  if(MF.movTipo==='venda'&&MF.abaixo&&!String(d.just||'').trim()){ toast('Vendes abaixo do custo: escreve a justificação.'); return }
  if(MF.movTipo==='venda')d.valor=+(num(d.pu)*num(d.qt)).toFixed(2);
  var dTipo=MF.movTipo==='venda'?(d.destTipo||'fora'):'', dDest=d.destino||'';
  if(MF.movTipo==='transferencia'){
    if(d.destino==='__fora__'||!d.destino){
      if(!String(d.destFora||'').trim()){ toast('Escreve a obra ou centro de custo de destino.'); return }
      dTipo='fora'; dDest=String(d.destFora).trim();
    } else { dTipo='app'; dDest=d.destino }
    d.valor=0; d.pu=0;
  }
  var oM=(MF.obraIdx!=null&&OBRAS[MF.obraIdx])?OBRAS[MF.obraIdx]:ST;
  if(MF.movTipo==='transferencia'&&dTipo==='app'&&norm(dDest)===norm(oM.obra||oM.nome||'')){ toast('A obra de destino é a própria obra.'); return }
  movsObra(oM).push({id:'mv'+Date.now().toString(36)+Math.floor(Math.random()*1000), tipo:MF.movTipo,
    data:d.data||hoje(), cod:d.cod||'', des:d.des||'', un:d.un||'', qt:num(d.qt),
    valor:num(d.valor), pu:num(d.pu), destTipo:dTipo, just:d.just||'',
    destino:dDest, local:d.local||'', devolvido:false, nota:d.nota||''});
  fechaForm(); render();
  toast(MF.movTipo==='venda'
    ? 'Venda registada: '+q(num(d.qt))+' de '+(d.cod||d.des)+' por '+eurz(num(d.valor))+' €.'
    : (MF.movTipo==='transferencia'
        ? 'Transferência registada: '+q(num(d.qt))+' de '+(d.cod||d.des)+' de '+(oM.obra||oM.nome||'obra')+' para '+dDest+'.'
        : 'Empréstimo registado: '+q(num(d.qt))+' de '+(d.cod||d.des)+' para '+(d.destino||'')+'.'));
}
function renderMovs(){
  var f=lower(flt.obr), lst=[];
  OBRAS.forEach(function(o){ (o.movs||[]).forEach(function(m){ lst.push({o:o,m:m}) }) });
  lst=lst.filter(function(x){ return !f||lower([x.m.cod,x.m.des,x.m.destino,x.m.local,x.m.nota].join(' ')).indexOf(f)>-1 });
  lst.sort(function(x,y){ return (y.m.data||'').localeCompare(x.m.data||'') });
  var h='<table class="g"><thead><tr><th>Data</th><th>Movimento</th><th>Código</th><th>Designação</th>'+
    '<th class="n">Quantidade</th><th class="n">PU (€)</th><th class="n">Valor (€)</th><th class="n">Custo (€)</th><th class="n">Resultado (€)</th><th>Preço</th>'+
    '<th>Destino</th><th>Onde fica</th><th>Estado</th><th>Nota</th><th></th></tr></thead><tbody>';
  var tv=0,tc=0,te=0;
  var G={}; globalMateriais().forEach(function(L){ G[L.k]=L });
  lst.forEach(function(x){
    var m=x.m, L=G[movKey(m)], pu2=L?L.pu:0, custo=pu2*num(m.qt);

/* ---- produção: material gasto por mês ---- */
function mesAtual(){ return autoDe(hoje()) }
function mesesCons(){
  var m={}; (ST.cons||[]).forEach(function(c){ if(c.mes)m[c.mes]=1 });
  if(prodMes)m[prodMes]=1;
  var l=Object.keys(m).sort(); if(!l.length)l=[mesAtual()];
  return l;
}
function nomeMes(m){
  var M=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var p=String(m||'').split('-');
  return p.length>1? (M[+p[1]-1]+' de '+p[0]) : m;
}
function leMedicaoCSV(txt){
  var linhas=String(txt).replace(/^\uFEFF/,'').split(/\r?\n/).filter(function(x){ return x.trim() });
  if(!linhas.length)return null;
  var sep=(linhas[0].split(';').length>=linhas[0].split(',').length)?';':',';
  var cab=linhas[0].split(sep).map(function(x){ return lower(x.replace(/"/g,'').trim()) });
  function idx(nomes){ for(var i=0;i<cab.length;i++){ for(var j=0;j<nomes.length;j++){ if(cab[i].indexOf(lower(nomes[j]))===0)return i } } return -1 }
  var iC=idx(['codigo','código']), iA=idx(['codigo antigo','código antigo']), iN=idx(['nomenclatura']),
      iD=idx(['designacao','designação']), iF=idx(['familia','família']), iQ=idx(['quantidade']), iU=idx(['unidade','un']);
  if(iC<0&&iD<0)return null;
  var out=[];
  for(var i=1;i<linhas.length;i++){
    var c=linhas[i].split(sep).map(function(x){ return x.replace(/^"|"$/g,'').trim() });
    var cod=iC>=0?c[iC]:'', des=iD>=0?c[iD]:'';
    if(!cod&&!des)continue;
    out.push({cod:cod, mn:iA>=0?c[iA]:'', sap:iN>=0?c[iN]:'', des:des, fam:iF>=0?c[iF]:'',
      qt:iQ>=0?num(c[iQ]):0, un:iU>=0?c[iU]:''});
  }
  return out.length?out:null;
}
function leMedicaoWB(wb){
  var out=null;
  wb.SheetNames.forEach(function(n){
    if(out)return;
    var rows=aoa(wb.Sheets[n]); var hr=findHeader(rows,['quantidade']); if(hr<0)return;
    var m=colMap(rows[hr]);
    var iC=pickCol(m,['código','codigo']),iA=pickCol(m,['código antigo','codigo antigo']),iN=pickCol(m,['nomenclatura']),
        iD=pickCol(m,['designação','designacao']),iF=pickCol(m,['família','familia']),iQ=pickCol(m,['quantidade']),iU=pickCol(m,['unidade','unid']);
    if(iC<0&&iD<0)return;
    var L=[];
    for(var i=hr+1;i<rows.length;i++){
      var r=rows[i]||[];
      function g(c){ return c>=0&&r[c]!=null?String(r[c]).trim():'' }
      if(!g(iC)&&!g(iD))continue;
      L.push({cod:g(iC),mn:g(iA),sap:g(iN),des:g(iD),fam:g(iF),qt:iQ>=0?num(r[iQ]):0,un:g(iU)});
    }
    if(L.length)out=L;
  });
  return out;
}
function juntaMedicaoProd(nome,linhas){
  garanteObra();

function consumoDoMes(mes){
  var G={}, ordem=[];
  (ST.cons||[]).forEach(function(c){
    if(mes&&c.mes!==mes)return;
    c.linhas.forEach(function(l){
      var k=keyOf(l.cod||l.des)+'|'+lower(l.un||'');
      var g=G[k];
      if(!g){ var it=look(l.cod);
        g=G[k]={cod:l.cod||'', des:(it?it.des:'')||l.des, fam:(it?(it.fam||''):'')||l.fam, un:l.un||'', qt:0, k:keyOf(l.cod||l.des), med:{}};
        ordem.push(k) }
      g.qt+=num(l.qt); g.med[c.nome]=1;
    });
  });
  return ordem.map(function(k){
    var g=G[k];
    var s=D[g.k]||{qne:0,vne:0,qgr:0};
    g.pu = s.qne? s.vne/s.qne : 0;
    g.val = g.qt*g.pu;
    g.rec = s.qgr;
    var cTotal=0;
    (ST.cons||[]).forEach(function(c){ c.linhas.forEach(function(l){ if(keyOf(l.cod||l.des)===g.k)cTotal+=num(l.qt) }) });
    var vend=0; (ST.movs||[]).forEach(function(m){ if(m.tipo==='venda'&&keyOf(m.cod||m.des)===g.k)vend+=num(m.qt) });
    g.consTotal=cTotal; g.stock=(s.qgr||0)-cTotal-vend;
    return g;
  });
}
function mapaMensal(){
  var M={}, ordem=[];
  function mm(m){ if(!M[m]){ M[m]={mes:m,ent:0,entVal:0,cons:0,consVal:0,vend:0,vendVal:0,prov:0}; ordem.push(m) } return M[m] }
  ST.gr.forEach(function(r){
    var d=dstr(r.data); if(!d)return;
    var g=mm(autoDe(d)||d.slice(0,7)), s=D[rowKey(r)]||{qne:0,vne:0};
    var pu2=s.qne? s.vne/s.qne : 0;
    g.ent+=num(r.qt); g.entVal+=num(r.qt)*pu2;
  });
  (ST.cons||[]).forEach(function(c){
    var g=mm(c.mes);
    c.linhas.forEach(function(l){
      var s=D[keyOf(l.cod||l.des)]||{qne:0,vne:0};
      var pu2=s.qne? s.vne/s.qne : 0;
      g.cons+=num(l.qt); g.consVal+=num(l.qt)*pu2;
    });
  });
  (ST.movs||[]).forEach(function(v){
    if(v.tipo!=='venda')return;
    var d=dstr(v.data); if(!d)return;
    var g=mm(autoDe(d)||d.slice(0,7)), s=D[keyOf(v.cod||v.des)]||{qne:0,vne:0};
    var pu2=s.qne? s.vne/s.qne : 0;
    g.vend+=num(v.qt); g.vendVal+=num(v.qt)*pu2; g.prov+=num(v.valor);
  });
  ordem.sort();
  var acQ=0, acV=0;
  return ordem.map(function(m){
    var g=M[m];
    acQ+=g.ent-g.cons-g.vend; acV+=g.entVal-g.consVal-g.vendVal;
    g.stockQt=acQ; g.stockVal=acV;
    return g;
  });
}

function precosConhecidos(){
  var P={};
  function poe(cod,forn,pu,data,origem,obra){
    if(!cod||!forn||!num(pu))return;
    var k=keyOf(cod);
    var lst=P[k]||(P[k]=[]);
    lst.push({forn:forn,pu:num(pu),data:dstr(data)||'',origem:origem,obra:obra||''});
  }
  OBRAS.forEach(function(o){
    o.ne.forEach(function(r){ poe(r.cod,r.forn,r.pu,r.data,'NE '+(r.ne||''),o.obra) });
    (o.mcs||[]).forEach(function(m){
      m.itens.forEach(function(it,i){
        m.forns.forEach(function(f,j){
          poe(it.cod,f.nome,(it.pu||[])[j],f.data||m.data,'proposta'+(f.ref?' '+f.ref:''),o.obra);
        });
      });
    });
  });
  Object.keys(P).forEach(function(k){
    P[k].sort(function(x,y){ return (y.data||'').localeCompare(x.data||'') });
  });
  return P;
}
function ultimoPreco(cod,forn){
  var l=(precosConhecidos()[keyOf(cod)]||[]).filter(function(x){ return !forn||norm(x.forn)===norm(forn) });

/* ---- resumo e avisos ---- */
/* recebido face ao encomendado, em euros */
function recPct(o){
  var q=0,g=0;
  Object.keys(D).forEach(function(k){ var s=D[k]; if(!s.qne)return; var pc=s.vne/s.qne; q+=s.vne; g+=Math.min(s.qgr,s.qne)*pc });
  return {q:q,g:g};
}
/* encomendado face à medição a apresentar, em euros */
function cobPct(o){
  var n=0,c=0;
  o.med.forEach(function(a){
    if(a._dup)return; var s=D[a._k]||{nA:a._qa}, p=a._pa||a._pv||0;
    n+=s.nA*p; c+=Math.min(a._qne,s.nA)*p;
  });
  return {n:n,c:c};
}
function totaisObra(o){
  var keep=ST; ST=o; calc(); calcRec();
  var t={vig:0,apr:0,ne:0,qa:0,qne:0,qgr:0,art:o.med.length,nne:o.ne.length,ngr:o.gr.length,av:0,
         stock:0,semCod:0,atraso:0,semNE:0,sobra:0};
  var A=avisos(); t.av=A.length;
  A.forEach(function(x){
    if(x.t.indexOf('fora do catálogo')>-1)t.semCod++;
    else if(x.t==='Já devia ter chegado')t.atraso++;
    else if(x.t==='Guia sem NE correspondente')t.semNE++;
  });
  Object.keys(D).forEach(function(k){
    var s=D[k]; if(!s.qgr)return;
    if(slotEhVerba(s,o))return; /* Outros Custos: já é dinheiro imputado, não stock */
    var pu2=s.qne? s.vne/s.qne : (s.med>=0?pu(o.med[s.med]):0);
    t.stock+=s.qgr*pu2;
  });
  o.med.forEach(function(a2){ if(a2._exc>1e-9&&a2._qgr>0)t.sobra++ });
  o.med.forEach(function(a){ t.vig+=a._cv; t.apr+=a._ca; t.qa+=a._qa; t.qne+=a._qne; t.qgr+=Math.min(a._qgr,a._qne) });
  o.ne.forEach(function(r){ t.ne+=num(r.qt)*num(r.pu) });
  var rp=recPct(o), cp=cobPct(o);
  t.vNE=rp.q; t.vRec=rp.g; t.cob=cp.n? Math.min(100,cp.c/cp.n*100):0; t.rec=rp.q? Math.min(100,rp.g/rp.q*100):0;
  ST=keep; calc(); calcRec();
  return t;
}



/* ---------- cruzamento: o que a medição pede vs o que foi comprado ---------- */
function cruzDados(fid){
  var o=ST; calc(); calcRec();
  var fases=o.fases||[];
  var fase=fases.filter(function(x){ return x.id===fid })[0]||fases[fases.length-1];
  var lim=(cruzData&&fase.data)?String(fase.data):'';
  var K={};
  function slot(k){ return K[k]||(K[k]={k:k,need:0,qne:0,vne:0,qgr:0,vend:0,p:0,med:[],cod:'',des:'',un:'',fam:''}) }
  o.med.forEach(function(a){
    var s2=slot(a._k), st=estadoAte(o,a,fid,true);
    s2.need+=st.q; if(st.p)s2.p=st.p; s2.med.push(a);
    if(!s2.cod){ s2.cod=a.cod; s2.des=a.des; s2.un=a.un }
  });
  o.ne.forEach(function(r){ if(lim&&String(dstr(r.data))>lim)return; var s2=slot(rowKey(r)); s2.qne+=num(r.qt); s2.vne+=num(r.qt)*num(r.pu); if(!s2.cod&&r.cod)s2.cod=r.cod; if(!s2.des)s2.des=r.des||'' });
  o.gr.forEach(function(r){ if(lim&&String(dstr(r.data))>lim)return; var s2=slot(rowKey(r)); s2.qgr+=num(r.qt) });
  (o.movs||[]).forEach(function(m){ if(m.tipo!=='venda')return; if(lim&&String(dstr(m.data))>lim)return; slot(keyOf(m.cod||m.des)).vend+=num(m.qt) });
  var rows=[], T={need:0,comp:0,falta:0,parado:0,desv:0,nFalta:0,nParado:0}, C={'':0,compr:0,ok:0,mais:0,saiu:0,fora:0};
  Object.keys(K).forEach(function(k){
    var s2=K[k], it=look(s2.cod||k);

/* ---- lista de material vinda da app Medições CAT ---- */
function aplicaMedicao(o,lista,substituir){
  var keep=ST; ST=o; calc();
  if(!o.fases||!o.fases.length)o.fases=fasesNovas();
  var fc=faseCurso(o), vazia=!o.med.length, novos=0, alt=0, zerados=0, tirados=0;
  var tocados={};

  function baseSem(a){                     /* quantidade sem os lançamentos desta importação */
    var b=num(a.qo);
    (a.lanc||[]).forEach(function(l){
      if(ehImp(l))return;
      var f=fasePorId(o,l.f);
      if(f&&f.estado==='validado')b+=num(l.qt);
      else if(f&&f.id===fc.id)b+=num(l.qt);
    });
    return b;
  }
  function ehImp(l){ return l.f===fc.id && (l.src==='medapp'||/^importado da app de medi|^importado \(revis/i.test(String(l.just||''))) }
  function poe(a,qt){
    delete a.pm; delete a.pmLanc;
    var ant=(a.lanc||[]).filter(ehImp);
    a.lanc=(a.lanc||[]).filter(function(l){ return !ehImp(l) });
    if(ant.length){ var qAnt=baseSem(a); ant.forEach(function(l){ qAnt+=num(l.qt) });
      if(Math.abs(qAnt-qt)>1e-9){ a.hist=a.hist||[]; a.hist.push({f:fc.id,data:hoje(),de:qAnt,para:qt,ver:ant[0].ver||'',comp:(D[keyOf(a.cod||a.des)]||{}).qne||0}) } }
    if(vazia){ a.qo=qt; return }
    var b=baseSem(a), d=qt-b;
    if(Math.abs(d)>1e-9){
      a.lanc.push({f:fc.id,mot:'Nova medição',qt:d,pu:pu(a)?+pu(a).toFixed(4):0,doc:'',
        just:'Importado da app Medições CAT'+medVersTxt(),ver:(typeof MEDVERS!=='undefined'?MEDVERS:''),data:hoje(),src:'medapp'});
    }
  }

  lista.forEach(function(x){
    var k=keyOf(x.cod||x.des), alvo=null;
    o.med.forEach(function(a){ if(!alvo&&keyOf(a.cod||a.des)===k)alvo=a });
    if(!alvo){
      alvo=novoArt(x.cod);
      alvo.des=x.des||alvo.des; alvo.un=x.un||''; alvo.mn=x.mn||alvo.mn;
      o.med.push(alvo); novos++;
    } else alt++;
    if(!alvo.un&&x.un)alvo.un=x.un;
    tocados[keyOf(alvo.cod||alvo.des)]=1;
    poe(alvo,num(x.qt));
  });

  if(substituir){
    for(var i=o.med.length-1;i>=0;i--){
      var a=o.med[i], k2=keyOf(a.cod||a.des);
      if(tocados[k2])continue;
      if(a.pm)continue;
      marcaPm(a,fc); zerados++;                       /* não veio: fica por medir, não a zero */
    }
  }
  ST=keep; calc(); calcRec();
  return {novos:novos,alt:alt,zerados:zerados,tirados:tirados,vazia:vazia,fase:fc.nome};
}

    var d=qt-base;

function idb(){ return new Promise(function(ok,ko){ try{ var r=indexedDB.open('controlo-materiais',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv') }; r.onsuccess=function(){ ok(r.result) }; r.onerror=function(){ ko(r.error) } }catch(e){ ko(e) } }) }

function idbGet(k){ return idb().then(function(db){ return new Promise(function(ok,ko){ var r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=function(){ ok(r.result) }; r.onerror=function(){ ko(r.error) } }) }).catch(function(){ return undefined }) }
function idbDel(k){ return idb().then(function(db){ return new Promise(function(ok,ko){ var t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=ok; t.onerror=function(){ ko(t.error) } }) }).catch(function(){}) }
function estadoHash(){
  var t=JSON.stringify(OBRAS,function(k,v){ return (typeof k==='string'&&k.charAt(0)==='_')?undefined:v }), h=5381;
  for(var i=0;i<t.length;i++){ h=((h<<5)+h+t.charCodeAt(i))|0 }
  return h+':'+t.length;
}
function mostraSujo(){ var e=$('#dirty'); if(e)e.hidden=!DIRTY }

function stampAgora(){ var d=new Date(), p=function(n){ return ('0'+n).slice(-2) }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+p(d.getMinutes()) }
function nomeSeguro(n){ return String(n||'').replace(/[\\\/:*?"<>|]/g,'-') }
function pedePermissao(h){
  if(!h||!h.queryPermission)return Promise.resolve(true);
  return h.queryPermission({mode:'readwrite'}).then(function(p){ if(p==='granted')return true; return h.requestPermission({mode:'readwrite'}).then(function(p2){ return p2==='granted' }) });
}
function gravaEm(dir,sub,nome,dados){
