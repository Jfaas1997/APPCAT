:root{
  --paper:#F1F1EF; --sheet:#FFFFFF; --ink:#2B3038; --muted:#6E7178;
  --rule:#D8D8D4; --soft:#EAEAE6; --brand:#F9D115; --verd:#7A5E00; --verdbg:#FDF3CE;
  --amber:#8F5D00; --amberbg:#F7EEDC; --red:#9B2C2C; --redbg:#F7E4E4;
  --ok:#2F6B4F; --okbg:#E4F0E9;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:3px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default;border-color:var(--rule)}
button.pri{background:var(--brand);border-color:var(--brand);font-weight:500}
button.x{border:none;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:2px 6px}
button.x:hover{color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:6px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:15px;padding:0 15px;height:58px;background:var(--ink);flex:0 0 auto}
header img.logo{height:34px;width:auto;display:block;border-radius:2px}
header .sep{width:1px;height:26px;background:rgba(255,255,255,.16)}
#obraNome{border:1px solid transparent;background:transparent;color:#fff;font-size:15px;font-weight:600;padding:4px 7px;width:230px;border-radius:var(--r)}
#obraNome::placeholder{color:rgba(255,255,255,.4)}
#obraNome:hover{border-color:rgba(255,255,255,.2)}
#obraNome:focus{border-color:var(--brand);background:rgba(255,255,255,.06);outline:none}
.stats{display:flex;margin-left:auto}
.stat{padding:2px 14px;border-left:1px solid rgba(255,255,255,.13);text-align:right;min-width:92px}
.stat b{display:block;font-family:var(--mono);font-size:16px;font-weight:500;line-height:1.25;color:var(--brand)}
.stat span{font-size:11px;color:rgba(255,255,255,.55)}
.tools{display:flex;gap:7px;padding-left:14px;border-left:1px solid rgba(255,255,255,.13)}
.tools button{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.tools button:hover{border-color:var(--brand);color:var(--brand)}
.tools button.pri{background:var(--brand);border-color:var(--brand);color:var(--ink);font-weight:500}
.tools button.pri:hover{color:var(--ink)}

main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.ph{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--rule);flex:0 0 auto}
.ph h2{margin:0;font-size:13px;font-weight:600}
.ph .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:auto}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:4px 11px;border-radius:var(--r);color:var(--muted);font-size:13px}
.tab:hover{background:var(--soft);border-color:transparent;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab.on:hover{color:#fff}
.view{display:none;flex:1 1 auto;flex-direction:column;min-height:0}
.view.on{display:flex}
.bar{display:flex;gap:6px;padding:8px 11px;border-bottom:1px solid var(--rule);flex:0 0 auto;align-items:center;flex-wrap:wrap}
.bar input,.bar select{font-size:13px;padding:5px 8px}
.bar input.grow{flex:1 1 auto;min-width:90px;max-width:320px}
.bar .sp{margin-left:auto}
.scroll{flex:1 1 auto;overflow:auto;min-height:0}
.pad{padding:14px}
.foot{flex:0 0 auto;border-top:1px solid var(--rule);padding:7px 13px;font-size:12px;color:var(--muted);background:var(--paper)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:2;background:var(--paper);text-align:left;font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr:hover td{background:#FBFBF9}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td input,td select{border-color:transparent;background:transparent;padding:3px 5px;width:100%;font-size:13px}
td input:hover,td select:hover{border-color:var(--rule)}
td input:focus,td select:focus{border-color:var(--ink);background:var(--sheet)}
td input.num{text-align:right;font-family:var(--mono)}
tr.grp td{background:var(--soft);font-weight:600;font-size:12px}
tr.grp:hover td{background:var(--soft)}
.w1{width:1%;white-space:nowrap}

.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.wait{background:var(--verdbg);color:var(--verd)}
.chip.warn{background:var(--amberbg);color:var(--amber)}
.chip.bad{background:var(--redbg);color:var(--red)}
.chip.none{background:var(--soft);color:var(--muted)}

.cards{display:flex;flex-wrap:wrap;gap:12px}
.card{flex:1 1 190px;min-width:170px;border:1px solid var(--rule);border-radius:4px;padding:11px 13px;background:var(--sheet)}
.card b{display:block;font-family:var(--mono);font-size:21px;font-weight:500;line-height:1.2}
.card span{font-size:11.5px;color:var(--muted)}
.card small{display:block;font-size:11px;color:var(--muted);margin-top:3px}
h3.sec{margin:22px 0 9px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
h3.sec:first-child{margin-top:0}
.bars{border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.brow{display:flex;align-items:center;gap:10px;padding:5px 10px;border-bottom:1px solid var(--soft);font-size:12.5px}
.brow:last-child{border-bottom:none}
.brow .lbl{flex:0 0 250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .trk{flex:1 1 auto;height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.brow .fil{height:100%;background:var(--brand)}
.brow .fil.ok{background:var(--ok)}
.brow .val{flex:0 0 108px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* editor da parte diária */
#pdWrap{max-width:1080px;margin:0 auto;padding:14px 14px 60px}
.pdhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pdhead h2{margin:0;font-size:17px;font-weight:600}
.fields{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:6px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.f input,.f select,.f textarea{min-width:120px}
.f.wide{flex:1 1 320px}
.f.wide input,.f.wide textarea{width:100%}
.box{border:1px solid var(--rule);border-radius:4px;margin-bottom:16px;overflow:hidden}
.box>.bh{display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--paper);border-bottom:1px solid var(--rule);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.box>.bh .sp{margin-left:auto}
.box .bb{padding:0}
.box .bb.p{padding:11px}
.two{display:flex;gap:16px;flex-wrap:wrap}
.two>*{flex:1 1 380px;min-width:320px}
.hint{font-size:11.5px;color:var(--muted)}
.tablewrap{overflow-x:auto;max-width:100%}
.tbAmb th{white-space:nowrap}
.tbAmb td input{box-sizing:border-box}
.semPeso{background:var(--amberbg)!important}
.eqSem{display:grid;grid-template-columns:repeat(7,minmax(172px,1fr));gap:8px;overflow-x:auto;align-items:start;padding-bottom:6px}
.eqCol{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:8px;min-height:120px}
.eqCol.hoje{outline:2px solid var(--brand);outline-offset:-1px}
.eqH{font-weight:600;margin-bottom:4px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.eqLocH{font-size:12px;font-weight:600;margin:8px 0 3px}
.eqBl{margin:0 0 6px;padding:4px 6px;background:var(--soft);border-radius:3px}
.eqBn{font-weight:600;font-size:12px}
.eqP{font-size:11.5px;line-height:1.35}
.eqM{margin:2px 0 3px}
.chip.meio{background:#fde68a;color:#78350f;margin:0 3px 2px 0}
.eqP .ld{font-weight:700}
.escCoord{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px;padding:7px 10px;background:var(--soft);border-radius:4px}
.escCoord select{min-width:230px}
table.grelha td.grpS{position:sticky;left:0;text-align:left;padding:3px 8px;background:var(--soft);font-size:11.5px;font-weight:600;border-right:none}
table.grelha tr.grp0 td.grpS{background:var(--verdbg)}
.semTh{font-size:9.5px!important;font-weight:500!important;opacity:.85}
.diaCel.plan{color:var(--muted);font-weight:400;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--soft) 4px 8px)}
.diaCel.dif::after{content:'≠';position:absolute;bottom:0;right:2px;font-size:9px;color:var(--amber)}
.escNav{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.escPincel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
table.grelha.gesc .diaCol,table.grelha.gesc .diaCel{width:80px;min-width:80px}
.escC{height:36px!important;font-size:10.5px;line-height:1.15;font-weight:500;padding:2px!important;color:var(--ink)}
.escC .eL{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:76px;margin:0 auto}
.escC .eT{font-size:9px;opacity:.7}
.escC.jaPto::after{content:'●';position:absolute;top:0;right:3px;font-size:7px;color:var(--ok)}
.escNome{cursor:pointer}

table.grelha.gdet{width:auto}
.gdet .diaCol,.gdet .diaCel{width:30px;min-width:30px}
.gdet td.diaCel{height:24px;padding:0}
.gdet .stick.nm{width:140px;min-width:140px;max-width:140px;white-space:normal;line-height:1.2;vertical-align:middle;font-weight:600}
.gdet td.sub{position:sticky;left:140px;z-index:1;background:var(--sheet);width:40px;min-width:40px;font-size:10px;font-weight:600;color:var(--muted);text-align:left;padding:0 5px;border-right:2px solid var(--rule)}
.gdet th.sub0{position:sticky;left:140px;z-index:2;background:var(--soft);width:40px;min-width:40px}
.gdet td.detT{font-weight:700}
.gdet .detI{position:absolute;right:1px;bottom:0;font-size:9px;line-height:1;opacity:.75;cursor:pointer;padding:0 1px}
.gdet tr.detL td{border-bottom:2px solid var(--ink)}
.gdet td.fds.vazio{background:var(--soft)}
.gdet td.detT.fds:empty{background:var(--soft)}
.gdet .totc{min-width:64px;width:64px}
.detBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.eqM .chip{white-space:normal;max-width:100%;overflow-wrap:anywhere;border-radius:9px}
.gesc .escNome{max-width:230px;min-width:150px;white-space:normal!important;line-height:1.2;overflow-wrap:anywhere}
.escNome:hover{background:var(--verdbg)!important}
.chipcor{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle;border:1px solid var(--rule)}
.ondeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.ondeP{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--soft)}
tr.grp td{background:var(--soft);padding:4px 8px;border-top:1px solid var(--rule)}
tr.grp0 td{background:var(--verdbg);font-weight:600;padding:7px 8px;border-top:2px solid var(--rule)}
.grpNome{font-weight:600;border:1px solid transparent!important;background:transparent!important;width:260px}
.grpNome:hover,.grpNome:focus{border-color:var(--rule)!important;background:var(--sheet)!important}
.grpTg{border:none;background:transparent;padding:2px 4px;vertical-align:middle}
.grpTg svg{width:14px;height:14px;transform:rotate(-90deg);transition:transform .15s}
.grpTg.fech svg{transform:rotate(180deg)}
.grpAdd{display:inline-flex;gap:6px;align-items:center;float:right;font-weight:400}
.grpAdd input{width:200px}
.pesoEst{margin-top:4px}
.tbAmb2 th{white-space:normal;vertical-align:bottom}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;max-width:80vw}
#toast.on{opacity:1}

.dirty{color:var(--brand);font-size:11.5px;align-self:center;margin-right:2px;white-space:nowrap}
tr.linaberta{background:var(--verdbg)}
td .chip{margin-right:5px}
#fTipoGlobal{margin-right:2px}
.modalOverlay{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
[hidden]{display:none!important}
.modalBox{background:var(--sheet);border-radius:6px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modalBox h3{margin:0 0 2px;font-size:16px}
.gridWrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px}
table.grelha{border-collapse:collapse;font-size:12px}
table.grelha th,table.grelha td{border:1px solid var(--rule);padding:0;text-align:center}
table.grelha thead th{background:var(--soft);font-weight:600;padding:3px 2px;font-size:10.5px;white-space:nowrap}
table.grelha .stick{position:sticky;left:0;background:var(--sheet);z-index:1;text-align:left;padding:4px 8px;white-space:nowrap;font-size:11.5px;border-right:2px solid var(--rule)}
table.grelha thead .stick{background:var(--soft);z-index:2}
.diaCol,.diaCel{width:26px;min-width:26px}
.diaCel{height:26px;cursor:pointer;font-weight:600;position:relative;user-select:none}
.diaCel:hover{outline:2px solid var(--brand);outline-offset:-2px}
.fds{background:var(--paper)}
.semNova{border-left:2px solid var(--ink)}
.diaCel.dia{background:var(--okbg);color:var(--ok)}
.diaCel.noite{background:#2B3038;color:#F1F1EF}
.diaCel .marca{position:absolute;top:0;right:1px;font-size:7px;line-height:1}
.modos{display:inline-flex;margin-left:12px}
.modos button{border-radius:0;margin-left:-1px}
.modos button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.modos button:last-child{border-radius:0 3px 3px 0}
.modos button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
table.grelha.gnum .diaCol,table.grelha.gnum .diaCel{width:42px;min-width:42px}
.pti{width:100%;height:26px;border:0;border-radius:0;background:transparent;text-align:center;font:inherit;font-size:12px;color:var(--ink);padding:0;outline:none}
.pti:focus{background:var(--verdbg);box-shadow:inset 0 0 0 2px var(--brand)}
.diaCel.pres{background:var(--okbg)}
.gdet td.nm{position:relative;padding-right:22px}.gdet .detTira{position:absolute;right:2px;top:4px;opacity:.35;padding:0 5px;line-height:1.3}.gdet tr:hover .detTira,.gdet .detTira:focus-visible{opacity:1}
.gesc tr.escEq td{background:var(--soft)!important;font-weight:600;border-top:2px solid var(--rule)}.gesc tr.escLid td.escNome{font-weight:600}.gesc .lidS{color:#C98500}.gesc tr.escMeio td.escNome .chip{font-size:10px;padding:0 5px}
.gaus .diaCol,.gaus .diaCel{width:30px;min-width:30px}.gaus .ausC{cursor:pointer;text-align:center;font-weight:600;font-size:11px;position:relative}.gaus .ausC.ausP{color:var(--muted);font-weight:400}.gaus .ausC.ausConf{box-shadow:inset 0 0 0 2px var(--amber)}.gaus .ausCc{display:block;font-size:8px;font-weight:400;line-height:1}

.gnum .diaCel.vazio{cursor:default}
.gnum .diaCel:hover{outline:none}
table.grelha .totc{position:sticky;right:0;background:var(--sheet);z-index:1;border-left:2px solid var(--rule);min-width:84px;width:84px;font-weight:600;font-size:11.5px;white-space:nowrap}
table.grelha thead .totc{background:var(--soft)}
table.grelha tr.rodape td{background:var(--soft);font-weight:600;font-size:11px;height:24px}
.rep{padding:0 4px;font-size:11px;margin-left:4px}

/* ===== aspeto moderno: tema, barra lateral, cartões, animações ===== */
:root{--r:8px;--rc:12px;--sw:228px;--sh:0 1px 2px rgba(20,24,32,.05),0 4px 14px rgba(20,24,32,.05);color-scheme:light}
@media screen and (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --paper:#0F1216;--sheet:#171B21;--ink:#E7E9ED;--muted:#9AA2AE;--rule:#2A2F38;--soft:#1F242C;--verd:#E9C64A;--verdbg:#3A3213;
  --amber:#F2C14E;--amberbg:#352B10;--red:#F08A8A;--redbg:#3B1E1E;--ok:#6FCF9F;--okbg:#16302A;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-tema="escuro"]{
  --paper:#0F1216;--sheet:#171B21;--ink:#E7E9ED;--muted:#9AA2AE;--rule:#2A2F38;--soft:#1F242C;--verd:#E9C64A;--verdbg:#3A3213;
  --amber:#F2C14E;--amberbg:#352B10;--red:#F08A8A;--redbg:#3B1E1E;--ok:#6FCF9F;--okbg:#16302A;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"side head" "side main";height:100vh;height:100dvh}
#side{grid-area:side;background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto}
.sbrand{padding:2px 8px 12px}
.sbrand img.logo{height:34px;width:auto;display:block;border-radius:3px}
.sgrp{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px;font-weight:500}
#side .tab,#side .tema{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-left:3px solid transparent;border-radius:var(--r);background:transparent;color:var(--muted);font-size:13.5px;transition:background .15s,color .15s}
#side .tab:hover,#side .tema:hover{background:var(--soft);color:var(--ink);border-color:transparent}
#side .tab.on{background:var(--verdbg);color:var(--ink);font-weight:500;border-left-color:var(--brand)}
#side .tab.on:hover{color:var(--ink)}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--rule)}
.sfoot kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:0 5px}
header{grid-area:head;height:auto;min-height:58px;flex-wrap:wrap;background:var(--sheet);border-bottom:1px solid var(--rule);padding:8px 18px;gap:12px}
header .sep{display:none}
#obraNome{color:var(--ink);font-size:15px;font-weight:600;width:min(32vw,330px)}
#obraNome::placeholder{color:var(--muted)}
#obraNome:hover{border-color:var(--rule)}
#obraNome:focus{border-color:var(--brand);background:var(--sheet)}
.stats{margin-left:auto;gap:8px}
.stat{padding:4px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);text-align:left;min-width:100px}
.stat b{color:var(--ink);font-size:15px}
.stat span{color:var(--muted)}
.tools{border-left:0;padding-left:0;align-items:center;flex-wrap:wrap}

<style id="norma-comum">
/* Norma comum v1 · Produção v2 */
#dirty{display:none!important}
#gst{font-size:12px;color:var(--muted);white-space:nowrap;align-self:center;margin-right:4px}
#gst.ok{color:#2E7D32}#gst.av{color:#B26A00}#gst.er{color:#C62828}
.ccchip{font-family:var(--mono);font-size:12px;background:var(--brand);color:#2B3038;padding:1px 7px;border-radius:var(--r);font-weight:500;white-space:nowrap}
.ccchip[hidden]{display:none}
#obraNome[readonly]{cursor:default}
.tools{position:relative}
.tools button{white-space:nowrap}
#bPasta{display:none!important}
.nmenu{position:absolute;right:0;top:100%;margin-top:8px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:260px;padding:4px 0;z-index:70}
.nmenu[hidden]{display:none}
.tools .nmenu button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent;color:var(--ink);padding:7px 14px;font-size:13px}
.tools .nmenu button:hover{background:var(--paper);color:var(--ink);border:0}
.nmenu small{display:block;padding:4px 14px;color:var(--muted);font-size:11px}
.sver{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:6px;font-weight:400;align-self:center}
.nmW{position:fixed;inset:0;z-index:95;background:rgba(43,48,56,.45);display:flex;align-items:flex-start;justify-content:center;padding:46px 20px;overflow:auto}
.nmCard{background:var(--sheet);color:var(--ink);border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:18px 22px;max-width:620px;width:100%}
.nmCard h3{margin:0 0 8px;font-size:16px;font-weight:600}
.nmCard p{margin:6px 0}
.nmCard label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.nmCard input[type=text]{width:100%}
.nmCard kbd{font-family:var(--mono);font-size:12px;background:var(--soft);border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.nmCard table{border-collapse:collapse;width:100%;font-size:13px}.nmCard td{padding:3px 8px 3px 0;vertical-align:top}
.nmAcs{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.nmAcs .p{background:var(--brand);border-color:var(--brand);color:#2B3038;font-weight:500}
.nmLista{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r);margin:10px 0;max-height:50vh;overflow:auto}
.nmLista button{border:0;border-bottom:1px solid var(--soft);border-radius:0;text-align:left;display:flex;justify-content:space-between;gap:10px;padding:7px 12px;background:var(--sheet)}
.nmLista button:hover{background:var(--verdbg)}
/* uma obra por pasta: sem vistas gerais nem criação de obras */

body.obraAtiva .tab[data-n="g"],body.obraAtiva .sgrp[data-n="g"]{display:none!important}
.ctrSel{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);color:var(--ink);max-width:150px}
.pcal{display:grid;grid-template-columns:minmax(560px,1fr) 300px;gap:18px;padding:14px 16px 40px;align-items:start}
@media(max-width:1100px){.pcal{grid-template-columns:1fr}}
.pcStats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pcSt{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 16px;display:flex;align-items:center;gap:12px;min-width:130px}
.pcSt b{font-family:var(--mono);font-size:22px;font-weight:500}.pcSt span{font-size:11.5px;color:var(--muted);line-height:1.4}
.pcSt.warn b{color:var(--amber)}.pcSt.bad b{color:var(--red)}
.pcBox{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pcBar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.pcBar h3{margin:0;font-size:17px;text-transform:capitalize}
.pcNav{display:flex;gap:6px;align-items:center}
.pcNav input{padding:4px 6px}
.pcGrid{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr))}
.pcWd{padding:9px 4px;text-align:center;font-size:11px;background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.7px}
.pcWd.fds{background:var(--brand);color:#2B3038}.pcWd.pcWk{background:var(--ink)}
.pcWn{background:var(--soft);font-size:11px;text-align:center;padding-top:10px;color:var(--muted);border-bottom:1px solid var(--rule);font-family:var(--mono)}
.pcDia{min-height:104px;border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;overflow:hidden;background:var(--sheet)}
.pcDia:hover{background:var(--soft)}.pcDia.fora{opacity:.45}.pcDia.fds{background:color-mix(in srgb,var(--soft) 60%,var(--sheet))}
.pcDia.sel{box-shadow:inset 0 0 0 2px var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--sheet))}
.pcN{font-size:12px;font-weight:600;align-self:flex-start;min-width:22px;text-align:center;padding:2px 4px;border-radius:11px}
.pcDia.hoje .pcN{background:var(--ink);color:var(--sheet)}
.pcChip{font-size:10.5px;border-radius:3px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-family:var(--mono);cursor:pointer}
.pcChip.dia{background:color-mix(in srgb,var(--brand) 45%,var(--sheet));color:#2B3038}
.pcChip.noite{background:var(--ink);color:var(--sheet)}
.pcChip.inc{box-shadow:inset 3px 0 0 var(--amber)}
.pcChip.semOs{background:var(--redbg);color:var(--red);cursor:default}
.pcMais{font-size:10px;color:var(--muted)}
.pcLeg{display:flex;gap:16px;align-items:center;padding:10px 16px;font-size:12px;color:var(--muted)}
.pcLeg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pcLeg i.dia{background:color-mix(in srgb,var(--brand) 45%,var(--sheet));border:1px solid var(--rule)}.pcLeg i.noite{background:var(--ink)}.pcLeg i.inc{background:var(--amber)}
.pcRes{margin-left:auto}
.pcSideBox{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
.pcEy{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pcSideBox h3{margin:0 0 10px;font-size:16px;text-transform:capitalize}
.pcCard{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);color:var(--ink)}

.pcMeta{display:flex!important;gap:8px;margin-top:6px;flex-wrap:wrap}.pcMeta em{font-style:normal;font-size:11px}.pcMeta em.w{color:var(--amber)}.pcMeta em.o{color:var(--ok)}
.pcVazio{padding:14px 0;color:var(--muted);font-size:12.5px}
.pcInt{font-size:12px;padding:3px 0;color:var(--ink)}
.pcAcs{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pcNota{font-size:11.5px;color:var(--muted);margin:10px 0 0}

.nmLogin{position:fixed;inset:0;background:var(--bg,#fff);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.nmLogin[hidden]{display:none}
.nmLogin form,.nmLogin .box{width:min(380px,100%);display:flex;flex-direction:column;gap:8px}
.nmLogin .ob{text-align:left;padding:10px 12px}.nmLogin .er{color:#C62828;min-height:1em}
/* Camada de movimento · norma comum v1 · partilhada pela Somafel Catenária online, App de Obra e Produção.
   Só transições curtas (≤ 250 ms) e nada que bloqueie. Respeita «reduzir movimento». */
:root{--mv-ease:cubic-bezier(.2,.7,.2,1);--mv-t:.22s}
/* entrada de ecrã: os blocos aparecem em cascata */
@keyframes mv-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vz>*,#m.entra>*{animation:mv-in .26s var(--mv-ease) both}
.vz>*:nth-child(2),#m.entra>*:nth-child(2){animation-delay:.03s}
.vz>*:nth-child(3),#m.entra>*:nth-child(3){animation-delay:.06s}
.vz>*:nth-child(4),#m.entra>*:nth-child(4){animation-delay:.09s}
.vz>*:nth-child(5),#m.entra>*:nth-child(5){animation-delay:.12s}
.vz>*:nth-child(n+6),#m.entra>*:nth-child(n+6){animation-delay:.15s}
/* listas: linhas entram em sequência curta */
tbody tr,.lin{animation:mv-in .22s var(--mv-ease) both}
tbody tr:nth-child(2),.lin:nth-child(2){animation-delay:.02s}tbody tr:nth-child(3),.lin:nth-child(3){animation-delay:.04s}
tbody tr:nth-child(4),.lin:nth-child(4){animation-delay:.06s}tbody tr:nth-child(n+5),.lin:nth-child(n+5){animation-delay:.08s}
/* linhas: só animam ao entrar num ecrã, não enquanto se edita; só as 12 primeiras (tabelas grandes ficam leves) */
tbody tr:nth-child(n+13),.lin:nth-child(n+13){animation:none}
html.mv-calmo tbody tr,html.mv-calmo .lin{animation:none!important}
/* linha nova ou alterada: brilho curto */
@keyframes mv-novo{0%{background-color:rgba(249,209,21,.42)}100%{background-color:transparent}}
tr.mv-novo>td,.mv-novo{animation:mv-novo 1.6s ease-out}
/* toque: resposta imediata */
button:active:not(:disabled),a.btn:active{transform:scale(.97)}

/* cartões clicáveis: pequena elevação */
.card.obra,.obra{transition:transform var(--mv-t) var(--mv-ease),box-shadow var(--mv-t) var(--mv-ease),border-color .15s}
.card.obra:hover,.obra:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.10)}
.card.obra:active,.obra:active{transform:scale(.985)}
/* janelas e avisos */
@keyframes mv-pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes mv-fade{from{opacity:0}to{opacity:1}}
.jan,.nmCard{animation:mv-pop .2s var(--mv-ease) both}
.fundo,.nmW{animation:mv-fade .18s ease-out both}
@keyframes mv-slide{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.aviso,.toast.on{animation:mv-slide .22s var(--mv-ease) both}
/* estados e botões */
.pill{transition:background .2s,color .2s}
button,a.btn{transition:border-color .15s,background .15s,transform .1s,box-shadow .15s}
button.pri:hover{box-shadow:0 2px 10px rgba(0,0,0,.14)}
/* a carregar: esqueleto com brilho */
@keyframes mv-sk{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.skel{display:block;height:14px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,rgba(128,128,128,.14) 0,rgba(128,128,128,.26) 40px,rgba(128,128,128,.14) 80px);background-size:200px 100%;animation:mv-sk 1.2s linear infinite}
.skel.b{height:54px;border-radius:10px}.skel.s{width:45%}.skel.m{width:70%}
/* indicador «guardado» */
#gst,#et{transition:color .25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* Controlo de produção — Catenária */
(function(){
'use strict';

/* ---------- utilitários ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return isFinite(v)?v:0;
  var s=String(v).trim().replace(/\s|€/g,'');
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0){ s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'') }
  else if(s.indexOf(',')>=0){ s=s.replace(',','.') }
  var n=parseFloat(s); return isFinite(n)?n:0}
function lower(s){return String(s==null?'':s).toLowerCase()}
function eur(n){return (num(n)).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})}
function qtf(n){n=num(n);return (Math.abs(n-Math.round(n))<1e-9? n.toLocaleString('pt-PT') : n.toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:3}))}
function pct(n){return (num(n)*100).toLocaleString('pt-PT',{minimumFractionDigits:0,maximumFractionDigits:1})+'%'}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2600)}

/* datas */
function hoje(){var d=new Date();return iso(d)}
function iso(d){if(!d)return '';var m=d.getMonth()+1,a=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(a<10?'0':'')+a}
function dstr(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return iso(v);
  if(typeof v==='number'){ var d=new Date(Date.UTC(1899,11,30+Math.floor(v))); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())) }
  var s=String(v).trim();
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return s;
}
function mes(d){return String(d||'').slice(0,7)}
function mesAnt(m){var p=m.split('-');var t=new Date(+p[0],+p[1]-2,1);return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)}
function mesProx(m){var p=m.split('-');var t=new Date(+p[0],+p[1],1);return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)}
function diasDoMes(m){var p=m.split('-');return new Date(+p[0],+p[1],0).getDate()}
function mesNome(m){
  if(!m)return '';var p=m.split('-');
  var N=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return (N[+p[1]-1]||'')+' '+p[0];
}
function ptbr(d){var p=String(d||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:(d||'')}
var DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function diaSem(d){var p=String(d||'').split('-');if(p.length!==3)return '';return DIAS[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}
function semana(d){
  var p=String(d||'').split('-');if(p.length!==3)return '';
  var t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  var dn=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  var a=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-a)/86400000+1)/7);
}
function addD(d,n){var p=String(d).split('-');var t=new Date(+p[0],+p[1]-1,+p[2]);t.setDate(t.getDate()+n);return iso(t)}

/* horas */
function hm(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return v.getHours()*60+v.getMinutes();
  if(typeof v==='number'){ if(v>0&&v<1)return Math.round(v*1440); var d=new Date(Date.UTC(1899,11,30+Math.floor(v),0,0,Math.round((v-Math.floor(v))*86400))); return d.getUTCHours()*60+d.getUTCMinutes() }
  var m=String(v).trim().match(/^(\d{1,2})[:h.](\d{2})/);
  if(m)return (+m[1])*60+(+m[2]);
  m=String(v).trim().match(/^(\d{1,2})$/); if(m)return (+m[1])*60;
  return null;
}
function hstr(min){ if(min==null)return ''; min=Math.round(min); var h=Math.floor(min/60),m=min%60; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m }
function dur(a,b){ var x=hm(a),y=hm(b); if(x==null||y==null)return 0; if(y<x)y+=1440; return (y-x)/60 }
function hdec(h){ h=num(h); if(!h)return '0:00'; return hstr(Math.round(h*60)) }

/* ---------- estado ---------- */
var ST=novo();
function novo(){ return {obra:'',nome:'',contrato:'',cliente:'INFRAESTRUTURAS DE PORTUGAL, S.A.',disc:'CATENÁRIA',
  tipos:[{id:'cat',nome:'Catenária',prefixo:'CAT'},{id:'sin',nome:'Sinalização',prefixo:'SIN'},{id:'vt',nome:'Varas de terra',prefixo:'VT'}],
  art:[],mo:[],eqp:[],int:[],pd:[],ponto:[],adicionais:[],locais:[],diaAuto:20,autosEnviados:[],ajustes:[],plano:[],planoOriginal:null,prev:[],prevOriginal:null,prevPes:[],mat:null,materialAuto:{}} }
function tipoAtual(){ return (ST.tipos||[]).filter(function(t){return t.id===flt.tipo})[0]||(ST.tipos||[])[0]||null }
function tipoNome(id){ var t=(ST.tipos||[]).filter(function(x){return x.id===id})[0]; return t?t.nome:(id||'—') }

var IX={};                 /* código -> artigo */
function buildIX(){ IX={}; ST.art.forEach(function(a){ if(a.cod)IX[String(a.cod).trim().toUpperCase()+'|'+(a.origem||'contrato')]=a }) }
function look(c,origem){ return IX[String(c||'').trim().toUpperCase()+'|'+(origem||'contrato')]||null }
function origemNome(id){ if(!id||id==='contrato')return 'Contrato'; var a=(ST.adicionais||[]).filter(function(x){return x.id===id})[0]; return a?a.nome:'—' }

/* frentes que ficaram "em curso": a última ocorrência de cada frenteId, se ainda estiver aberta */
function frentesAbertas(tipo){
  var ult={}; /* frenteId -> {linha, pd} mais recente encontrada, por ordem de leitura das PDs ordenadas por data */
  var pds=ST.pd.slice().sort(function(a,b){return (a.data||'').localeCompare(b.data||'')});
  pds.forEach(function(p){
    if(tipo && (p.tipo||'cat')!==tipo)return;
    (p.lin||[]).forEach(function(l){
      if(!l.frenteId)return;
      ult[l.frenteId]={l:l,p:p};
    });
  });
  var hoje0=hoje();
  return Object.keys(ult).map(function(fid){ return ult[fid] }).filter(function(x){return (x.l.estado||'fechada')==='aberta'})
    .map(function(x){
      var dias=Math.max(0,Math.round((hm2days(hoje0)-hm2days(x.p.data))));
      return {frenteId:x.l.frenteId,cod:x.l.cod||'',des:x.l.des||'',pki:x.l.pki||'',pkf:x.l.pkf||'',

    }).sort(function(a,b){return a.desde.localeCompare(b.desde)});

/* ---------- cálculos ---------- */
function chaveRub(cod,origem){ return String(cod||'').trim().toUpperCase()+'|'+(origem||'contrato') }
function execArt(codMes,tipo,origem){
  /* devolve {cod|origem:{qt, valor}} de produção; codMes = '' (tudo) ou 'YYYY-MM' (período do auto); tipo/origem = '' para todos */
  var out={};
  ST.pd.forEach(function(p){
    if(tipo && (p.tipo||'cat')!==tipo) return;
    (p.lin||[]).forEach(function(l){
      if((l.estado||'fechada')!=='fechada')return; /* linhas "em curso" ainda não contam */
      if(origem && (l.origem||'contrato')!==origem) return;
      var per=l.auto||autoDe(p.data);
      if(codMes && per!==codMes) return;
      if(!l.cod)return;
      var k=chaveRub(l.cod,l.origem);
      var a=look(l.cod,l.origem); var q=num(l.qt);
      if(!out[k])out[k]={qt:0,val:0};
      out[k].qt+=q; out[k].val+=q*(a?num(a.pu):0);
    });
  });
  return out;
}
function acumArt(tipo,origem){
  /* produção acumulada por rubrica (cod+origem) = saldo anterior (importado) + partes diárias */
  var out=execArt('',tipo,origem);
  ST.art.forEach(function(a){
    if(tipo && (a.tipo||'cat')!==tipo) return;
    if(origem && (a.origem||'contrato')!==origem) return;
    if(!a.cod)return;
    var q=num(a.aini); if(!q)return;
    var k=chaveRub(a.cod,a.origem);
    if(!out[k])out[k]={qt:0,val:0};
    out[k].qt+=q; out[k].val+=q*num(a.pu);
  });
  return out;
}
function totalAcum(tipo,origem){ var o=acumArt(tipo,origem),v=0; Object.keys(o).forEach(function(k){v+=o[k].val}); return v }
function totContrato(tipo,origem){ var t=0; ST.art.forEach(function(a){ if(tipo&&(a.tipo||'cat')!==tipo)return; if(origem&&(a.origem||'contrato')!==origem)return; t+=num(a.qt)*num(a.pu) }); return t }

function horasInt(i){
  return { pt:dur(i.ptI,i.ptF), os:dur(i.osI,i.osF), conc:dur(i.cI,i.cF), trab:dur(i.tI,i.tF) };
}
function fechada(i){ return !!(i.tI||i.tF) }
function totaisInt(filtroMes,tipo){
  /* conc/trab/perdidas contam só interdições já fechadas (com horas trabalhadas preenchidas) */
  var t={pt:0,os:0,conc:0,trab:0,n:0,perdidas:0,abertas:0,concAb:0};
  ST.int.forEach(function(i){
    if(filtroMes && mes(i.data)!==filtroMes)return;
    if(tipo && (i.tipo||'cat')!==tipo)return;
    var h=horasInt(i); if(!h.conc&&!h.trab&&!h.os&&!h.pt)return;
    t.n++; t.pt+=h.pt; t.os+=h.os;
    if(fechada(i)){ t.conc+=h.conc; t.trab+=h.trab; if(h.conc>h.trab)t.perdidas+=(h.conc-h.trab) }
    else if(h.conc>0){ t.abertas++; t.concAb+=h.conc }
  });
  return t;
}

}

/* auto de medição: fecha no dia ST.diaAuto (20). O auto de setembro cobre de 21/08 a 20/09; uma PD a 21/09 já é do auto de outubro */
function autoDe(data){
  if(!data)return '';
  var d=+String(data).slice(8,10)||1, lim=+ST.diaAuto||20, m=mes(data);
  return d>lim?mesProx(m):m;
}

function pdFalta(p){

/* encontra a PD de um tipo+data; cria-a (sem mudar de vista) se ainda não existir */
/* a numeração «PREFIXO - n» segue a data: dentro de cada tipo, as PDs ficam por ordem de data e o primeiro número é o que já lá estava.
   Números escritos noutro formato ficam como estão. */
function renumeraPDs(){
  var mudou=0;
  (ST.tipos||[]).forEach(function(t){
    var re=new RegExp('^'+String(t.prefixo||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*-\\s*(\\d+)\\s*$','i');
    var lst=[]; ST.pd.forEach(function(p){ if((p.tipo||'cat')!==t.id)return; var m=String(p.num||'').match(re); if(m)lst.push({p:p,n:+m[1]}) });
    if(lst.length<1)return;
    var ini=Math.min.apply(null,lst.map(function(x){return x.n}));
    var usados={}; lst.forEach(function(x){ if(x.p.bloq)usados[x.n]=1 });   /* as impressas ficam com o número que têm */
    var livres=lst.filter(function(x){return !x.p.bloq}).sort(function(a,b){ return (a.p.data||'9999').localeCompare(b.p.data||'9999')||(a.n-b.n)||String(a.p.id).localeCompare(String(b.p.id)) });
    var c=ini;
    livres.forEach(function(x){ while(usados[c])c++; var nn=t.prefixo+' - '+c; c++; if(x.p.num!==nn){ x.p.num=nn; mudou++ } });
  });
  return mudou;
}
function pdBloq(p){ return !!(p&&p.bloq) }
function pdBloqId(id){ return !!id&&pdBloq(porId(ST.pd,id)) }
function avisoBloq(p){ toast('A parte diária '+(p&&p.num||'')+' está bloqueada porque já foi impressa. Desbloqueia-a primeiro, dentro da própria parte diária.') }
function bloqueiaPD(p,acao){ p.bloq=true; p.impEm=new Date().toISOString(); p.hist=p.hist||[]; p.hist.push({d:p.impEm,a:acao||'impressa'}) }
var pdDesbl=false;
function imprimeEBloqueia(p){
  if(!p){ toast('Abre primeiro uma parte diária.'); return }
  if(!p.bloq){
    var fal=pdFalta(p);
    if(!confirm('Ao imprimir, a parte diária '+(p.num||'')+' fica BLOQUEADA: só se altera com um desbloqueio justificado.'+(fal.length?'\n\nAtenção: está incompleta (falta '+fal.join(', ')+').':'')+'\n\nImprimir e bloquear?'))return;
    imprimePD(p); bloqueiaPD(p,'impressa');
  } else { imprimePD(p); bloqueiaPD(p,'reimpressa') }
  pdDesbl=false; render();
}
function pdDoDia(tipoId,data){
  var achada=ST.pd.filter(function(p){return (p.tipo||'cat')===tipoId&&p.data===data})[0];

  var tp=(ST.tipos||[]).filter(function(t){return t.id===tipoId})[0], pref=tp?tp.prefixo:'CAT';
  var n=0; ST.pd.forEach(function(p){ if((p.tipo||'cat')!==tipoId)return; var m=String(p.num||'').match(/(\d+)\s*$/); if(m)n=Math.max(n,+m[1]) });
  var p={id:uid(),tipo:tipoId,num:pref+' - '+(n+1),data:data,turno:'noite',ficha:'',dae:'',obs:'',ints:[],lin:[],mo:[],eqP:[],eqL:[],eqIds:[],lev:[],apl:[]};
  ST.int.forEach(function(i){ if(i.data===data&&(i.tipo||'cat')===tipoId&&(dur(i.cI,i.cF)||i.os))p.ints.push(i.id) });

function normTxt(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim() }
function catMOCanon(cat){
  var n=normTxt(cat); if(!n)return '';
  var ex=(ST.catMO||[]).filter(function(c){return normTxt(c)===n})[0]; if(ex)return ex;
  var A=[[/^eng/,'Engenheiro'],[/tecnico.*producao/,'Técnico de Produção'],[/auxiliar/,'Auxiliar de Catenária'],[/manobrador|condutor|\bcvi\b/,'Condutor de Via Interdita'],[/^pvi$|piloto/,'Piloto de Via Interdita']];
  for(var i=0;i<A.length;i++)if(A[i][0].test(n))return (ST.catMO||[]).indexOf(A[i][1])>=0?A[i][1]:'';
  return '';
}
function chaveEq(s){ return normTxt(s).replace(/ /g,'').replace(/s/g,'') }
function catEqCanon(e){
  var n=chaveEq(e.nome), best=null;
  (ST.catEq||[]).forEach(function(c){ var k=chaveEq(c.nome); if(k&&n.indexOf(k)===0&&(!best||k.length>chaveEq(best.nome).length))best=c });
  return best;
}
/* agrupa itens pelas categorias da lista (por ordem), depois as que existem nos dados mas não na lista, e por fim «sem categoria» */
function recGrupos(itens,lista,getCat){
  var mapa={}, ordem=lista.slice();
  itens.forEach(function(x){ var c=getCat(x)||''; (mapa[c]=mapa[c]||[]).push(x); if(c&&ordem.indexOf(c)<0)ordem.push(c) });
  if(mapa[''])ordem.push('');
  return ordem.map(function(n){ return {nome:n,itens:mapa[n]||[],lista:lista.indexOf(n)>=0} });
}

    var diasOn={}; $$('.ltDia:checked').forEach(function(c){ diasOn[+c.value]=1 });

    var n=0, bloq2=0, d=de;

  });
}

function lancamentosRubrica(cod,origem){
  var out=[];
  ST.pd.forEach(function(p){
    (p.lin||[]).forEach(function(l,ix){
      if((l.estado||'fechada')!=='fechada')return;
      if(String(l.cod||'').trim().toUpperCase()!==String(cod).trim().toUpperCase())return;
      if((l.origem||'contrato')!==(origem||'contrato'))return;
      out.push({pdId:p.id,pdNum:p.num,pdTipo:p.tipo,data:p.data,pki:l.pki||'',qt:l.qt,lineIx:ix});
    });
  });
  return out.sort(function(a,b){return (b.data||'').localeCompare(a.data||'')});
}
function limitePoste(a){ return a&&/^un/i.test(String(a.un||'').trim())?1:0 }
function somaPk(lancs,pk){ var t=0; lancs.forEach(function(x){ if(x.pki===pk)t+=num(x.qt) }); return t }
var lancEdit=null; /* {pdId,ix} do lançamento em correção na ficha da rubrica */
function parseLotePostes(txt,qtPad){
  var out=[];
  String(txt||'').split(/\r?\n/).forEach(function(ln){
    ln=ln.trim(); if(!ln)return;
    var pk,qt,m;
    if(ln.indexOf(';')>=0||ln.indexOf('\t')>=0){ var pt=ln.split(/[;\t]/); pk=pt[0].trim(); qt=(pt[1]!==undefined&&pt[1].trim()!=='')?num(pt[1]):qtPad }
    else if((m=ln.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/))){ pk=m[1].trim(); qt=num(m[2]) }
    else if((m=ln.match(/^([^,]+),\s*(\d+(?:[.,]\d+)?)$/))){ pk=m[1].trim(); qt=num(m[2]) }
    else { pk=ln; qt=qtPad }
    if(pk)out.push({pk:pk,qt:qt||qtPad});
  });
  return out;
}

var mapModo='r', capFechados={};
function naturalCmp(a,b){
  var ra=String(a).match(/\d+|\D+/g)||[], rb=String(b).match(/\d+|\D+/g)||[];
  for(var i=0;i<Math.max(ra.length,rb.length);i++){
    var x=ra[i],y=rb[i]; if(x===undefined)return -1; if(y===undefined)return 1;
    var nx=/^\d+$/.test(x), ny=/^\d+$/.test(y);
    if(nx&&ny){ if(+x!==+y)return +x-+y } else if(x!==y)return x<y?-1:1;
  }
  return 0;
}

function lerAutoOficial(wb){

  var hr=-1, blocos=[];

    var b=[]; (rows[i]||[]).forEach(function(c,ix){ var m=String(c==null?'':c).match(/AUTO\s*N[ºo°.]*\s*(\d+)/i); if(m)b.push({n:+m[1],q:ix}) });

  if(!blocos.length)return null;

function reconDiffs(){
  var recon=rcAt(); if(!recon)return [];
  var n=recon.bloco, of={}, nomes={};
  recon.linhas.forEach(function(l){ var q=l.q[n]||0; if(q){ var k=l.cod.toUpperCase(); of[k]=(of[k]||0)+q; nomes[k]=l.des } });
  var env=ultimoEnviado(autSel,autOrig), base=[];
  if(env)base=env.linhas.map(function(x){return {tipo:x.tipo,origem:x.origem,cod:x.cod,qt:x.qt}});
  else autoLinhas(autSel,autOrig).forEach(function(r){ if(r.est)base.push({tipo:r.tipo,origem:r.origem,cod:r.cod,qt:r.est}) });
  var app={}; base.forEach(function(x){

  var reg={}; (ST.ajustes||[]).forEach(function(j){ if(j.auto===autSel&&(j.origem||'contrato')===autOrig){ var k=String(j.cod).toUpperCase(); reg[k]=(reg[k]||0)+num(j.qt) } });
  var ks={}; Object.keys(of).forEach(function(k){ks[k]=1}); Object.keys(app).forEach(function(k){ks[k]=1});
  var out=[];

  return out.sort(function(x,y){return naturalCmp(x.cod,y.cod)});

/* peso (kg/un.), toneladas e resíduo do quadro de uma linha de «materiais levantados» */
function levInfo(x){
  var c=x.compId?compPorId(x.compId):null, r=(!c&&x.resId&&x.resId!=='__outro')?resPorId(x.resId):null, un, peso=0, resId='';
  if(c){ un=c.un; peso=num(c.peso); resId=c.resId||'' }
  else if(r){ un=r.un; peso=num(r.fator)*1000; resId=r.id }
  else { un=x.tipo||''; peso=pesoDaUn(un) }
  var est=num(x.pes)>0; if(est)peso=num(x.pes);
  return {c:c,r:r,un:un,q:num(x.qt),peso:peso,est:est,resId:resId,falta:peso<=0,t:num(x.qt)*peso/1000};
}
function aplicaComp(o,val){
  if(val&&val.indexOf('r:')===0){ aplicaRes(o,val.slice(2)); delete o.compId; delete o.pes; return }

  var c=compPorId(val);
  if(c){ o.compId=c.id; o.nome=c.nome; o.tipo=c.un }
  else if(val==='__outro'){ o.compId='__outro'; o.nome=''; o.tipo='un' }
  else { o.compId=''; o.nome=''; o.tipo='' }
}
function levAgg(auto){
  var o={res:{},comp:{},t:0,semPeso:0,n:0};
  ST.pd.forEach(function(p){
    if(auto&&autoDe(p.data)!==auto)return;
    (p.lev||[]).forEach(function(x){
      if(!x.compId&&!x.resId&&!x.nome)return;
      var i=levInfo(x); o.n++; if(i.falta&&i.q)o.semPeso++; o.t+=i.t;
      if(i.c){ var k=o.comp[i.c.id]||(o.comp[i.c.id]={q:0,t:0}); k.q+=i.q; k.t+=i.t }
      if(i.resId&&resPorId(i.resId))o.res[i.resId]=(o.res[i.resId]||0)+i.t;
    });
  });
  return o;
}

function semIni(d){ var p=d.split('-'), t=new Date(+p[0],+p[1]-1,+p[2]); t.setDate(t.getDate()-((t.getDay()+6)%7)); return iso(t) }
function horasPD(p){ var h=0; (p.ints||[]).forEach(function(id){ var i=porId(ST.int,id); if(i)h+=dur(i.tI,i.tF) }); return h }
function valLin(l){ var a=look(l.cod,l.origem); return num(l.qt)*(a?num(a.pu):0) }
function ritmoTipo(tipoId){
  var dias={};
  ST.pd.forEach(function(p){ if((p.tipo||'cat')!==tipoId)return; (p.lin||[]).forEach(function(l){ if((l.estado||'fechada')!=='fechada'||!l.cod)return; dias[p.data]=(dias[p.data]||0)+valLin(l) }) });
  var ds=Object.keys(dias).sort(); if(!ds.length)return {sem:0,ate:''};
  var fim=ds[ds.length-1], hj=hoje(); if(hj>fim&&addD(fim,28)>=hj)fim=hj;
  var ini=addD(fim,-27), tot=0; ds.forEach(function(d){ if(d>=ini&&d<=fim)tot+=dias[d] });
  return {sem:tot/4,ate:fim};
}

/* ---------- PLANO ---------- */
function ddias(a,b){ var x=a.split('-'), y=b.split('-'); return Math.round((new Date(+y[0],+y[1]-1,+y[2])-new Date(+x[0],+x[1]-1,+x[2]))/86400000) }
function valorPlano(e){ var a=look(e.cod,e.origem); return num(e.qt)*(a?num(a.pu):0) }
function planoAteData(lista,E){
  var t=0;
  lista.forEach(function(e){
    if(!e.de||!e.ate||e.ate<e.de)return;
    var n=ddias(e.de,e.ate)+1, f=Math.max(0,Math.min(1,(ddias(e.de,E<e.ate?E:e.ate)+1)/n));
    if(E<e.de)f=0; t+=valorPlano(e)*f;
  });
  return t;
}
function executadoAte(lista,E){
  var chaves={}; lista.forEach(function(e){ chaves[(e.tipo||'cat')+'|'+chaveRub(e.cod,e.origem)]=1 });
  var t=0;
  ST.pd.forEach(function(p){ if(!p.data||p.data>E)return; (p.lin||[]).forEach(function(l){
    if((l.estado||'fechada')!=='fechada'||!l.cod)return;
    if(chaves[(p.tipo||'cat')+'|'+chaveRub(l.cod,l.origem)])t+=valLin(l);
  }) });
  return t;
}

  var R={}; (ST.ponto||[]).forEach(function(pt){ var m=moPorId(pt.moId); if(!m||m.direto===false||!pt.data)return; var a=autoDe(pt.data), c=pesCat(m); var o=R[a]||(R[a]={}); o[c]=(o[c]||0)+1 });
  return R;
}
function pesSoma(o){ var t=0; Object.keys(o||{}).forEach(function(k){ t+=num(o[k]) }); return t }
function pesCats(){ var s={}; ST.mo.forEach(function(m){ if(m.direto!==false)s[pesCat(m)]=1 }); return Object.keys(s).sort(naturalCmp) }

function pesDados(){

  meses.forEach(function(a){
    var p=0; ST.prevPes.forEach(function(r){ p+=num((r.m||{})[a]) });
    var r=pesSoma(R[a]), pas=a<=hj; ap+=p; if(pas)ar+=r;

var matFoco='', matFam='';
function matLinhas(){ return (ST.mat&&ST.mat.linhas)||[] }
function matAutoDe(v){
  if(v==null||v==='')return '';
  var t=String(v).trim(), m;
  if(/^\d{4}-\d{2}$/.test(t))return t;
  if(/^\d{4}-\d{2}-\d{2}/.test(t))return autoDe(t.slice(0,10));
  m=t.match(/^(\d{1,2})\/(\d{4})$/); if(m)return m[2]+'-'+('0'+m[1]).slice(-2);
  return '';
}
function matNum(v){ return (v===null||v===undefined||v==='')?null:num(v) }
/* lê a folha «Materiais por auto» (ou «Materiais») de um workbook */
function lerMateriais(wb){
  var out=null;
  wb.SheetNames.forEach(function(nm){
    if(out)return; var ln=lower(nm).replace('ã','a');
    if(ln.indexOf('materiais')<0)return;
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null});
    var hr=achaHdr(rows,['auto']); if(hr<0)return;
    var m=colMap(rows[hr]), cOb=pick(m,['obra','centro de custo']), cFa=pick(m,['família','familia']), cAu=pick(m,['auto']),
        cEn=pick(m,['entradas']), cCp=pick(m,['consumo previsto','previsão de consumo','previsao de consumo']), cCo=-1, cVe=pick(m,['vendas','vendido']), cSt=pick(m,['stock']),
        cNe=pick(m,['necessidade']), cPa=pick(m,['pagamento']), cIm=pick(m,['importado em']);
    Object.keys(m).forEach(function(k){ if(cCo<0&&k.indexOf('consumo')===0&&k.indexOf('prev')<0)cCo=m[k] });
    if(cFa<0||cAu<0)return;
    var L=[], obras={}, quando='';
    for(var i=hr+1;i<rows.length;i++){
      var r=rows[i]||[], fam=String(cel(r,cFa)||'').trim(), au=matAutoDe(cel(r,cAu)); if(!fam||!au)continue;
      var ob=cOb>=0?String(cel(r,cOb)||'').trim():''; if(ob)obras[ob]=1;
      if(cIm>=0&&!quando)quando=String(cel(r,cIm)||'');
      L.push({obra:ob,fam:fam,auto:au,ent:num(cel(r,cEn)),cons:num(cel(r,cCo)),vend:num(cel(r,cVe)),stock:cSt>=0?matNum(cel(r,cSt)):null,prev:cCp>=0?num(cel(r,cCp)):0,nec:num(cel(r,cNe)),pag:num(cel(r,cPa))});
    }
    if(L.length)out={linhas:L,obras:Object.keys(obras),quando:quando};
  });
  return out;
}

/* ---------- importar mapa de quantidades para uma origem ---------- */
function lerMapaArt(wb){
  var nm=wb.SheetNames.filter(function(n){ var l=lower(n); return l.indexOf('artigo')>=0||l.indexOf('mapa')>=0||l.indexOf('auto')>=0 })[0]||wb.SheetNames[0];
  var rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null});
  var hr=achaHdr(rows,['qtd'])>=0?achaHdr(rows,['qtd']):achaHdr(rows,['quant']);
  if(hr<0)hr=achaHdr(rows,['designa']);
  if(hr<0)return null;
  var m=colMap(rows[hr]);
  var cCod=pick(m,['n.º art.º','nº art','código','codigo','artigo']), cDes=pick(m,['designação','designacao','descrição']),
      cUn=pick(m,['un.','unid.','unidade','un']), cQt=pick(m,['qtd.','qtd','quantidade','quant.']),
      cPu=pick(m,['pu','p.u.','preço unit.','preco unit','preço unitário']), cTipo=pick(m,['tipo']), cOrigem=pick(m,['origem']),
      cAc=pick(m,['acumulado anterior','qtd acumulado anterior','qtd acumulado','qtd acumulada','qt acumulado','quantidade acumulada']);
  if(cCod<0){ cCod=1;cDes=2;cUn=3;cQt=4;cPu=5 }
  var itens=[], ignoradas=0;
  for(var i=hr+1;i<rows.length;i++){
    var r=rows[i]||[], cod=String(cel(r,cCod)||'').trim(); if(!cod)continue;
    var des=String(cel(r,cDes)||'').trim(), qt=num(cel(r,cQt)), pu=num(cel(r,cPu));
    if(!des&&!qt&&!pu)continue;
    if(!qt&&!pu){ ignoradas++; continue }   /* linhas de capítulo */
    itens.push({cod:cod,des:des,un:String(cel(r,cUn)||'').trim(),qt:qt,pu:pu,tipoNome:cTipo>=0?String(cel(r,cTipo)||'').trim():'',origemNome:cOrigem>=0?String(cel(r,cOrigem)||'').trim():'',aini:cAc>=0?num(cel(r,cAc)):null});
  }
  return {folha:nm,itens:itens,ignoradas:ignoradas,temOrigem:cOrigem>=0,temTipo:cTipo>=0};
}
function origemDeNomeG(nome){
  nome=String(nome||'').trim(); if(!nome||lower(nome)==='contrato')return 'contrato';
  var a=(ST.adicionais||[]).filter(function(x){return lower(x.nome)===lower(nome)})[0];
  if(a)return a.id;
  a={id:uid(),nome:nome,data:hoje()}; ST.adicionais.push(a); return a.id;
}
function tipoDeNomeG(nome){
  nome=String(nome||'').trim(); if(!nome)return flt.tipo||'cat';
  var t=(ST.tipos||[]).filter(function(x){return lower(x.nome)===lower(nome)})[0];
  return t?t.id:(flt.tipo||'cat');
}

$('#fArtImp').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f)return; var inp=e.target;
  var rd=new FileReader();
  rd.onload=function(ev){
    try{
      var r=lerMapaArt(XLSX.read(new Uint8Array(ev.target.result),{type:'array'}));
      if(!r||!r.itens.length){ toast('Não encontrei artigos neste ficheiro. Usa «Modelo do mapa» para ver as colunas.'); return }
      var destino=flt.origem||'', usaFicheiro=!destino&&r.temOrigem;
      var nov=0, upd=0;
      r.itens.forEach(function(x){ var o=destino||(usaFicheiro?(x.origemNome&&lower(x.origemNome)!=='contrato'?'?'+x.origemNome:'contrato'):'contrato'); var ex=o.charAt(0)==='?'?null:look(x.cod,o); if(ex)upd++; else nov++ });
      var onome=destino?origemNome(destino):(usaFicheiro?'as origens indicadas no ficheiro':'Contrato');
      if(!confirm('Importar '+r.itens.length+' artigos de «'+f.name+'» (folha «'+r.folha+'») para «'+onome+'»?\n\n• '+nov+' novos\n• '+upd+' já existem e serão atualizados (descrição, un., quantidade, preço)\n• Nada é apagado.'+(r.ignoradas?'\n• '+r.ignoradas+(r.ignoradas===1?' linha de capítulo/título ignorada.':' linhas de capítulo/título ignoradas.'):'')))return;
      r.itens.forEach(function(x){
        var o=destino||(usaFicheiro?origemDeNomeG(x.origemNome):'contrato'), ex=look(x.cod,o);
        if(ex){ if(x.des)ex.des=x.des; if(x.un)ex.un=x.un; ex.qt=x.qt; ex.pu=x.pu; if(x.aini!=null)ex.aini=x.aini }
        else{ ST.art.push({id:uid(),tipo:r.temTipo?tipoDeNomeG(x.tipoNome):(flt.tipo||'cat'),origem:o,cod:x.cod,des:x.des,un:x.un||'un',qt:x.qt,pu:x.pu,aini:x.aini||0}); buildIX(); }
      });
      buildIX(); render(); toast('Mapa importado em «'+onome+'»: '+nov+' novos, '+upd+' atualizados.');
    }catch(err){ console.error(err); toast('Não consegui ler este ficheiro.') }
    inp.value='';
  };
  rd.readAsArrayBuffer(f);
});

function eqPorTipo(p,tp){
  var o={}; (p.eqIds||[]).forEach(function(id){ var e=eqPorId(id); if(!e)return; if((e.tipo==='L'||e.tipo==='V')!==(tp==='L'))return; var c=e.categoria||e.nome||'—'; o[c]=(o[c]||0)+1 });
  var r=Object.keys(o).sort().map(function(k){ return [k,o[k]] });
  ((tp==='L'?p.eqL:p.eqP)||[]).forEach(function(x){ if(x&&x.nome)r.push([x.nome,num(x.qt)||'']) });
  return r;
}

function pick(m,nomes){ for(var i=0;i<nomes.length;i++){ if(m[nomes[i]]!=null)return m[nomes[i]] }
  var ks=Object.keys(m);
  for(var j=0;j<nomes.length;j++){ for(var x=0;x<ks.length;x++){ if(ks[x].indexOf(nomes[j])===0)return m[ks[x]] } }
  return -1 }
function achaHdr(rows,palavras,lim){
  lim=lim||12;
  for(var i=0;i<Math.min(rows.length,lim);i++){
    var t=lower((rows[i]||[]).join('|'));
    var ok=palavras.every(function(p){return t.indexOf(p)>=0});
    if(ok)return i;
  }
  return -1;

    /* --- Equipamentos --- */

      var h4=achaHdr(rows,['designa']); if(h4<0)return;

    /* --- Partes diárias (cabeçalho) --- */
    if(n.indexOf('partes')>=0||n==='pd'){

      if(h5<0)return;

        if(!dd&&!nu)continue;

        var o={id:id,tipo:p7>=0?tipoIdPorNome(cel(r5,p7)):(flt.tipo||'cat'),num:nu,data:dd,
          turno:lower(String(cel(r5,p8)||''))==='dia'?'dia':'noite',

          localId:String(cel(r5,p10)||'').trim(),

          ints:[],lin:[],mo:[],eqP:[],eqL:[],eqIds:String(cel(r5,p9)||'').split(';').filter(Boolean),lev:[],apl:[]};

    }
  });

  /* segunda passagem: adicionais ao mapa de artigos (só depois de ST.art estar completo) */
  buildIX();
  wb.SheetNames.forEach(function(nm){
    if(lower(nm)!=='adicionais')return;

  /* segunda passagem: ponto (só depois de ST.mo e ST.pd estarem completos) */

  });

  /* autos enviados e ajustes (cópias guardadas pela app) */
  wb.SheetNames.forEach(function(nm){
    var ln=lower(nm);
    if(ln!=='autos enviados'&&ln!=='ajustes')return;

    var cId=pick(m,['id']),cAu=pick(m,['auto']),cTi=pick(m,['tipo']),cOr=pick(m,['origem']),cCo=pick(m,['código']),cQt=pick(m,['quantidade']);

      for(var i2=hr+1;i2<rows.length;i2++){
        var r2=rows[i2]||[]; var cod=String(cel(r2,cCo)||'').trim(); if(!cod)continue;

          cod:cod,qt:num(cel(r2,cQt)),destino:lower(String(cel(r2,cDe)||''))==='seguinte'?'seguinte':'recusado',motivo:String(cel(r2,cMo)||''),data:String(cel(r2,cDt)||'')});
      }

  });

  /* plano, plano original e material por auto */
  wb.SheetNames.forEach(function(nm){

  });

  wb.SheetNames.forEach(function(nm){
    var ln=lower(nm).replace('ã','a'), eOrig=ln==='previsao original';
    if(ln!=='previsao'&&!eOrig)return;
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null});
    var hr=achaHdr(rows,['código']); if(hr<0)return;
    var m=colMap(rows[hr]), cId=pick(m,['id']),cTi=pick(m,['tipo']),cOr=pick(m,['origem']),cCo=pick(m,['código']),cAu=pick(m,['auto']),cQt=pick(m,['quantidade']),cCg=pick(m,['congelado em']);

    for(var i=hr+1;i<rows.length;i++){

  });

  wb.SheetNames.forEach(function(nm){

    var m=colMap(rows[hr]), cId=pick(m,['id']), cFu=pick(m,['função','funcao']), cAu=pick(m,['auto']), cQt=pick(m,['dias de pessoal','dias']);
    var mp={}, lst=[];
    for(var i=hr+1;i<rows.length;i++){
      var r=rows[i]||[], fu=String(cel(r,cFu)||'').trim(); if(!fu)continue;
      var cat=lower(fu)==='total'?PES_TOT:fu, id=String(cel(r,cId)||'').trim(), k=id||cat, x=mp[k];
      if(!x){ x=mp[k]={id:id||uid(),cat:cat,m:{}}; lst.push(x) }
      var au=String(cel(r,cAu)||'').trim(), q=num(cel(r,cQt)); if(au&&q)x.m[au]=(x.m[au]||0)+q;

    if(lst.length){ ST.prevPes=lst; achou.push(lst.length+' funções na previsão de pessoal') }

  wb.SheetNames.forEach(function(nm){
    if(lower(nm)!=='materiais')return;
    var r=lerMateriais({SheetNames:[nm],Sheets:wb.Sheets}); if(!r||!r.linhas.length)return;
    var obra=r.obras[0]||'';
    ST.mat={data:r.quando||new Date().toISOString(),obra:obra,linhas:r.linhas.map(function(l){ return {fam:l.fam,auto:l.auto,ent:l.ent,cons:l.cons,vend:l.vend,stock:l.stock,prev:l.prev||0,nec:l.nec,pag:l.pag} })};
    achou.push(r.linhas.length+' linhas de materiais');
  });

  /* capítulos (cópia guardada pela app) */
  wb.SheetNames.forEach(function(nm){
    var ln=lower(nm); if(ln!=='capítulos'&&ln!=='capitulos')return;
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:null});
    var hr=achaHdr(rows,['designa']); if(hr<0)return;
    var m=colMap(rows[hr]); var cc=pick(m,['código','codigo']),cd=pick(m,['designação','designacao']);
    var caps=[];
    for(var i=hr+1;i<rows.length;i++){ var r=rows[i]||[]; var cod=String(cel(r,cc)||'').trim(); if(!cod)continue; caps.push({cod:cod,des:String(cel(r,cd)||'').trim()}) }
    if(caps.length){ ST.capitulos=caps; achou.push(caps.length+' capítulos') }
  });

  /* segunda passagem: detalhes das partes diárias */
  wb.SheetNames.forEach(function(nm){
    var n=lower(nm);

          estado:String(cel(r,pick(m,['estado']))||'fechada')||'fechada',
          frenteId:String(cel(r,pick(m,['frente']))||'')||undefined,
          auto:String(cel(r,pick(m,['auto']))||'')||undefined,
          motivoAuto:String(cel(r,pick(m,['motivo (mudança de auto)','motivo mudança de auto','motivo auto']))||'')||undefined,
          semRub:(function(){var c=pick(m,['sem rubrica']); return c>=0&&lower(String(cel(r,c)||''))==='sim'?true:undefined})()});
      }else if(n.indexOf('recursos')>=0){
        var tipo=lower(String(cel(r,pick(m,['tipo']))||''));
        var o={nome:String(cel(r,pick(m,['designação','designacao','nome','categoria']))||''),qt:num(cel(r,pick(m,['quant.','quantidade','qt'])))};
        if(tipo.indexOf('mão')>=0||tipo.indexOf('mao')>=0||tipo==='mo')p.mo.push(o);

        var cAt=pick(m,['atividade / frente','atividade']), cRi=pick(m,['resíduo id','residuo id']);

  buildIX();
  ST.pd.forEach(function(p){
    if((p.ints||[]).length)return;
    ST.int.forEach(function(i){ if(i.data===p.data&&(i.tipo||'cat')===(p.tipo||'cat')&&(dur(i.cI,i.cF)||i.os))p.ints.push(i.id) });

/* ---------- gravação: pasta de trabalho, rascunho em IndexedDB, Ctrl+S ---------- */
function idb(){ return new Promise(function(ok,ko){ try{ var r=indexedDB.open('controlo-producao',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv') }; r.onsuccess=function(){ ok(r.result) }; r.onerror=function(){ ko(r.error) } }catch(e){ ko(e) } }) }
function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(ok,ko){ var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=ok; t.onerror=function(){ ko(t.error) } }) }).catch(function(){}) }
function idbGet(k){ return idb().then(function(db){ return new Promise(function(ok,ko){ var r=db.transaction('kv').objectStore('kv').get(k); r.onsuccess=function(){ ok(r.result) }; r.onerror=function(){ ko(r.error) } }) }).catch(function(){ return undefined }) }
function idbDel(k){ return idb().then(function(db){ return new Promise(function(ok,ko){ var t=db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=ok; t.onerror=function(){ ko(t.error) } }) }).catch(function(){}) }
function cortaTxt(t,n){ t=String(t||''); return t.length>n? t.slice(0,n-1)+'…' : t }
function nomeSeguro(n){ return String(n||'').replace(/[\\\/:*?"<>|]/g,'-') }
function stampAgora(){ var d=new Date(), p=function(n){ return ('0'+n).slice(-2) }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+p(d.getMinutes()) }
function estadoVazio(){ return !ST.art.length&&!ST.pd.length&&!ST.int.length&&!ST.mo.length&&!ST.eqp.length }
function estadoHash(){
  var t=JSON.stringify(ST,function(k,v){ return (typeof k==='string'&&k.charAt(0)==='_')?undefined:v }), h=5381;
  for(var i=0;i<t.length;i++){ h=((h<<5)+h+t.charCodeAt(i))|0 }
  return h+':'+t.length;
}
function pedePermissao(h){
  if(!h||!h.queryPermission)return Promise.resolve(true);
  return h.queryPermission({mode:'readwrite'}).then(function(p){ if(p==='granted')return true; return h.requestPermission({mode:'readwrite'}).then(function(p2){ return p2==='granted' }) });
}
function gravaEm(dir,sub,nome,dados){
  var p=sub?dir.getDirectoryHandle(sub,{create:true}):Promise.resolve(dir);
  return p.then(function(d){ return d.getFileHandle(nome,{create:true}) }).then(function(fh){ return fh.createWritable().then(function(w){ return w.write(dados).then(function(){ return w.close() }) }) });
}
function mostraSujo(){ var e=$('#dirty'); if(e)e.hidden=!DIRTY }
function mostraPasta(){ var b=$('#bPasta'); if(b)b.textContent=PASTA?('Pasta: '+cortaTxt(PASTA.name,18)):'Pasta…' }
function listaPastaObras(){
  if(!PASTA||!PASTA.values)return Promise.resolve([]);
  return (async function(){
    var out=[];
    try{
      for await (const h of PASTA.values()){
        if(h.kind==='file'&&/\.xlsx$/i.test(h.name))out.push(h.name);
      }
    }catch(e){}
    return out.sort();
  })();
}
function atualizaListaPasta(){
  if(!PASTA){ pastaListagem=null; return }
  listaPastaObras().then(function(lista){ pastaListagem=lista; render() });
}
function marcaGuardado(){ LASTHASH=estadoHash(); DIRTY=false; mostraSujo() }
function escolhePasta(){
  if(!window.showDirectoryPicker){ toast('Este navegador não deixa escolher a pasta. Usa o Chrome ou o Edge.'); return }
  window.showDirectoryPicker({mode:'readwrite'}).then(function(h){ PASTA=h; idbSet('pasta',h); mostraPasta(); atualizaListaPasta(); toast('Pasta de trabalho: «'+h.name+'». O ficheiro e as cópias ficam aqui.') })
    .catch(function(err){ if(err&&err.name!=='AbortError')toast('Não consegui abrir essa pasta. Escolhe uma subpasta tua, por exemplo em Documentos.') });
}
$('#bPasta').addEventListener('click',escolhePasta);
function escreveProjeto(wb,nome){
  var dados=XLSX.write(wb,{bookType:'xlsx',type:'array'}), nf=nomeSeguro(nome)+'.xlsx';
  function fim(msg){ marcaGuardado(); idbDel('rascunho'); toast(msg); atualizaListaPasta() }
  function transferencias(){ XLSX.writeFile(wb,nf); fim('Guardado nas Transferências: '+nf) }
  if(PASTA){
    pedePermissao(PASTA).then(function(ok){
      if(!ok)throw new Error('sem permissão');
      return gravaEm(PASTA,null,nf,dados).then(function(){
        if(Date.now()-LASTBACKUP>30*60000){ LASTBACKUP=Date.now(); return gravaEm(PASTA,'Cópias',nomeSeguro(nome)+' '+stampAgora()+'.xlsx',dados) }
      });
    }).then(function(){ fim('Guardado em «'+PASTA.name+'»: '+nf) }).catch(function(){ transferencias() });
  } else if(FICH){
    FICH.createWritable().then(function(w){ return w.write(dados).then(function(){ return w.close() }) }).then(function(){ fim('Guardado em '+FICH.name) }).catch(function(){ FICH=null; transferencias() });
  } else if(window.showSaveFilePicker){
    window.showSaveFilePicker({suggestedName:nf,types:[{description:'Livro do Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]})
      .then(function(h){ FICH=h; idbSet('ficheiro',h); return h.createWritable() }).then(function(w){ return w.write(dados).then(function(){ return w.close() }) })
      .then(function(){ fim('Guardado em '+FICH.name+'. O Ctrl+S volta a escrever neste ficheiro.') })
      .catch(function(err){ if(err&&err.name==='AbortError')return; transferencias() });
  } else transferencias();
}
function guardaProjeto(){
  if(estadoVazio()){ toast('Ainda não há nada para guardar.'); return }
  SAVEQ=function(wb,nome){ escreveProjeto(wb,nome) };
  guarda();
}
function autoRascunho(){
  var h=estadoHash(); if(h===DRAFTHASH||SAVEQ)return;
  SAVEQ=function(wb){ try{ var d=XLSX.write(wb,{bookType:'xlsx',type:'array'}); DRAFTHASH=h; idbSet('rascunho',{quando:Date.now(),dados:d}) }catch(e){} };
  try{ guarda() }catch(e){ SAVEQ=null }
}
setInterval(function(){
  if(estadoVazio())return;
  var h=estadoHash(), sujo=(h!==LASTHASH);
  if(sujo!==DIRTY){ DIRTY=sujo; mostraSujo() }
  if(DIRTY&&Date.now()-(autoRascunho.ts||0)>30000){ autoRascunho.ts=Date.now(); autoRascunho() }
},5000);
window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue='' } });
document.addEventListener('keydown',function(e){ if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&String(e.key).toLowerCase()==='s'){ e.preventDefault(); guardaProjeto() } });
function verRascunho(){
  idbGet('rascunho').then(function(r){
    var box=$('#rasc'); if(!box)return;
    if(!r||!r.dados||!estadoVazio()){ box.hidden=true; return }
    var d=new Date(r.quando);
    box.hidden=false;
    box.innerHTML='<b>Há um rascunho por guardar</b> de '+d.toLocaleDateString('pt-PT')+' às '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})+'.<br>'+
      '<button id="rascOk">Recuperar</button><button id="rascNo">Descartar</button>';
    $('#rascOk').addEventListener('click',function(){ importa(XLSX.read(r.dados,{type:'array'})); box.hidden=true; setTimeout(function(){ DIRTY=true; mostraSujo() },400) });
    $('#rascNo').addEventListener('click',function(){ idbDel('rascunho'); box.hidden=true });
  });
}
idbGet('pasta').then(function(h){ if(h){ PASTA=h; mostraPasta(); atualizaListaPasta() } });
idbGet('ficheiro').then(function(h){ if(h&&!FICH)FICH=h });
setTimeout(verRascunho,400);

$('#pdLista').addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-pcdia]')){ e.preventDefault(); PCAL.sel=e.target.getAttribute('data-pcdia'); pcalRender() } });

})();

</script>
