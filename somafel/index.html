<style>
:root{--paper:#F1F1EF;--sheet:#FFFFFF;--ink:#2B3038;--muted:#5A5E66;--rule:#D8D8D4;--soft:#EAEAE6;--brand:#F9D115;--verd:#7A5E00;--verdbg:#FDF3CE;--amber:#8F5D00;--amberbg:#F7EEDC;--red:#9B2C2C;--redbg:#F7E4E4;--ok:#2F6B4F;--okbg:#E4F0E9;
 --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;--r:8px;--sw:228px;--sh:0 1px 2px rgba(20,24,32,.05),0 4px 14px rgba(20,24,32,.05);color-scheme:light}
@media screen and (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--paper:#0F1216;--sheet:#171B21;--ink:#E7E9ED;--muted:#9AA2AE;--rule:#2A2F38;--soft:#1F242C;--verd:#E9C64A;--verdbg:#3A3213;--amber:#F2C14E;--amberbg:#352B10;--red:#F08A8A;--redbg:#3B1E1E;--ok:#6FCF9F;--okbg:#16302A;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-tema="escuro"]{--paper:#0F1216;--sheet:#171B21;--ink:#E7E9ED;--muted:#9AA2AE;--rule:#2A2F38;--soft:#1F242C;--verd:#E9C64A;--verdbg:#3A3213;--amber:#F2C14E;--amberbg:#352B10;--red:#F08A8A;--redbg:#3B1E1E;--ok:#6FCF9F;--okbg:#16302A;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,a.btn{text-transform:none;letter-spacing:0;text-decoration:none;display:inline-block;font-family:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
button:hover,a.btn:hover{border-color:var(--ink)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--brand);border-color:var(--brand);color:#2B3038;font-weight:500}
button.perigo:hover{border-color:var(--red);color:var(--red)}
button.x{border:0;background:transparent;color:var(--muted);font-size:16px;padding:2px 7px}button.x:hover{color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;width:100%}

input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.mono{font-family:var(--mono)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ecrã de entrada */
#entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cx{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--sh);padding:28px 26px;animation:entra .3s ease-out}
.cx .logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.cx .logo i{width:34px;height:34px;border-radius:6px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-weight:700;color:#2B3038}
.cx h1{margin:0;font-size:18px}.cx .sub{color:var(--muted);font-size:12.5px;margin:0}
.cx label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.cx .acoes{display:flex;gap:8px;margin-top:18px}.cx .acoes button{flex:1;padding:9px}
.cx .lnk{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0;margin-top:10px;font-size:12.5px}
.msg{margin-top:12px;font-size:12.5px;padding:8px 10px;border-radius:6px}.msg.e{background:var(--redbg);color:var(--red)}.msg.o{background:var(--okbg);color:var(--ok)}

/* estrutura */
#app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"side head" "side main";height:100vh;height:100dvh}
#side{grid-area:side;background:#12161C;color:#A7B0BD;display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto}
.sbrand{display:flex;align-items:center;gap:8px;padding:2px 6px 14px}
.sbrand i{width:30px;height:30px;border-radius:5px;background:var(--brand);display:grid;place-items:center;font-style:normal;font-weight:700;color:#2B3038}
.sbrand .nm{color:#fff;font-weight:600;font-size:14px;line-height:1.2}.sbrand .nm small{display:block;font-weight:400;font-size:10.5px;color:#8A94A2;font-family:var(--mono)}
#side .tab,#side .tema{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-left:3px solid transparent;border-radius:6px;background:transparent;color:#A7B0BD;font-size:13.5px}
#side .tab:hover,#side .tema:hover{background:#1D232C;color:#fff}
#side .tab.on{background:rgba(249,209,21,.14);color:#fff;font-weight:500;border-left-color:var(--brand)}
.sfoot{margin-top:auto;border-top:1px solid #262D38;padding-top:10px;display:flex;flex-direction:column;gap:2px}
header{grid-area:head;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 18px;background:var(--sheet);border-bottom:1px solid var(--rule);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
.ccchip{font-family:var(--mono);font-size:12px;background:var(--brand);color:#2B3038;padding:1px 8px;border-radius:4px;font-weight:500}
.hsp{flex:1}
.quem{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
main{grid-area:main;position:relative;overflow:hidden}
.pg{position:absolute;inset:0;overflow:auto;padding:22px 26px 60px}
.vz{max-width:1100px;margin:0 auto}
.entra{animation:entra .12s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

h2{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px}
.topo{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}.topo .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.obra{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.obra:hover{border-color:var(--ink);transform:translateY(-2px)}
.obra h3{margin:0;font-size:16px}.obra .cl{color:var(--muted);font-size:12.5px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--muted);display:inline-block}.pill.on{background:var(--okbg);color:var(--ok)}.pill.er{background:var(--redbg);color:var(--red)}.pill.av{background:var(--amberbg);color:var(--amber)}
.vazio{text-align:center;padding:60px 20px;color:var(--muted)}.vazio h2{color:var(--ink)}.vazio p{max-width:520px;margin:8px auto 18px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:middle}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500}td.n,th.n{text-align:right;font-family:var(--mono)}
td.ac{text-align:right;white-space:nowrap}td.ac button{margin-left:4px}
tbody tr{transition:background .12s}tbody tr:hover{background:var(--soft)}
.sec{margin:26px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:10px}.sec .sp{flex:1}.sec button{text-transform:none;letter-spacing:0}
.hint{color:var(--muted);font-size:12.5px}
.voltar{background:none;border:0;color:var(--muted);padding:0;margin-bottom:10px}.voltar:hover{color:var(--ink)}
#pg.semPad{display:flex;flex-direction:column;overflow:hidden;padding:0}.appfr{flex:1;position:relative;min-height:0}.appfr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;animation:fadeIn .14s}.carr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--paper);color:var(--muted);font-size:13px;z-index:2}.carr img{width:96px;height:auto;opacity:.85}.carr .sb{width:180px;height:3px;background:var(--soft);border-radius:3px;overflow:hidden;position:relative}.carr .sb i{position:absolute;top:0;left:0;height:100%;width:40%;background:var(--brand);border-radius:3px;animation:carrB 1.1s ease-in-out infinite}@keyframes carrB{0%{left:-40%}100%{left:100%}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lista{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px}

/* janelas */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s ease-out}
.jan{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px 22px;animation:pop .18s ease-out}
.jan.larga{max-width:640px}
.jan h3{margin:0 0 12px;font-size:16px}
.jan label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.jan .chk{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13.5px;color:var(--ink)}
.jan .bt{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
#avisos{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.aviso{background:#181C22;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:var(--sh);animation:pop .2s ease-out}.aviso.e{background:#7a2323}

@media (max-width:820px){.pg{padding:16px 16px 60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- visual da Central antiga ---- */
:root[data-side="c"]{--sw:64px}
.sbrand img{height:34px;width:auto;border-radius:3px}
#bSide{margin-left:auto;background:transparent;border:0;color:var(--sink);padding:4px}

:root[data-side="c"] #side .tab span,:root[data-side="c"] #side .tema span,:root[data-side="c"] .sbrand .nm,:root[data-side="c"] .sbrand img,:root[data-side="c"] .sgrp{display:none}

.pd h1{margin:4px 0 0;font-size:38px;line-height:1.05;font-weight:700}.pd h2{margin:0;font-size:16px;font-weight:600}.pm{font-family:var(--mono);font-size:38px;line-height:1.1;font-weight:500}
.pks2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}@media(max-width:1500px){.pks2{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:820px){.pks2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pk{background:#181C22;border:1px solid #2A303A;border-top:3px solid;border-radius:10px;padding:14px 16px 0;overflow:hidden;display:flex;flex-direction:column;gap:2px}.pkt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#9AA1AC}.pkv{font-family:var(--mono);font-size:28px;line-height:1.2;font-weight:500}.pks{font-size:12px;color:#9AA1AC;min-height:18px}.spk{display:block;width:calc(100% + 32px);height:54px;margin:8px -16px 0}
.prow{display:flex;flex-wrap:wrap;gap:16px}.pc{min-width:0;background:#181C22;border:1px solid #2A303A;border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}.pc:not([style]){flex:1 1 100%}
.pt{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px}.plg{margin-left:auto;display:flex;flex-wrap:wrap;gap:14px}.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:#9AA1AC}.lg i{display:inline-block}.pmono{margin-left:auto;font-family:var(--mono);font-size:12px;color:#9AA1AC}
.gr{display:block;width:100%;height:250px}.gm{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#9AA1AC}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-family:var(--mono);font-size:30px;font-weight:500}.rc span{font-size:12px;color:#9AA1AC}.rf{display:flex;align-items:center;gap:8px;font-size:13px}.rf i{width:10px;height:10px;border-radius:2px}.rf b{margin-left:auto;font-family:var(--mono);font-weight:400}
.pbar{display:flex;align-items:flex-end;gap:10px;height:96px;border-bottom:1px solid #2A303A}.pbar>div{flex:1;height:96px;display:flex;align-items:flex-end;justify-content:center;gap:3px}.pbar i{display:block;width:38%;max-width:20px;box-sizing:border-box;border-radius:3px 3px 0 0}
.sr{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.sr b{font-family:var(--mono);font-weight:400;color:#4FD1B5}.sb{height:12px;background:#252A33;border-radius:3px}.sb i{display:block;height:12px;border-radius:3px;background:#4FD1B5}
.hsave{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--muted);padding:4px 11px;background:var(--soft);border:1px solid var(--rule);border-radius:999px}.hsave i{width:8px;height:8px;border-radius:50%;background:#4FD1B5;animation:pulso 2s infinite}
@keyframes pulso{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#sObras{display:flex;flex-direction:column;gap:6px;margin:6px 0 2px;max-height:42vh;overflow-y:auto}
.so{font:inherit;text-align:left;color:#E8EAED;cursor:pointer;padding:10px 11px;background:transparent;border:1px solid #262D38;border-radius:8px;display:flex;flex-direction:column;gap:6px;width:100%}
.so:hover{background:#1D232C}.so.on{background:#1F242C;border-color:var(--brand)}.so .n{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.so .b{height:5px;background:#252A33;border-radius:3px}.so .b i{display:block;height:5px;background:var(--brand);border-radius:3px}

.pd .psub{color:#9AA1AC;font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.pd .psub b{color:#E8EAED;font-family:var(--mono);font-weight:500}
.pd button.pbt{background:#181C22;color:#E8EAED;border:1px solid #2A303A}.pd button.pbt:hover{border-color:#E8EAED}
:root[data-foco] header{display:none}
:root[data-uma] #side{display:none}:root[data-uma] #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main"}

#side #sVolta{border-left-color:transparent;color:var(--brand);font-weight:500;border-bottom:1px solid rgba(255,255,255,.12);border-radius:0;margin-bottom:6px}
@media(max-width:800px){:root{--sw:64px}#side .tab span,#side .tema span,.sbrand .nm,.sgrp{display:none}}

/* ---------- janelas ---------- */
function janela(titulo,larga){
  const ov=document.createElement('div');ov.className='ov';
  const j=document.createElement('div');j.className='jan'+(larga?' larga':'');
  j.innerHTML='<h3></h3><div class="corpo"></div>';j.querySelector('h3').textContent=titulo;
  ov.appendChild(j);document.body.appendChild(ov);
  const fecha=()=>{ov.remove();document.removeEventListener('keydown',tecla)};
  const tecla=e=>{if(e.key==='Escape')fecha()};
  document.addEventListener('keydown',tecla);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)fecha()});
  return {corpo:j.querySelector('.corpo'),fecha,el:j};
}
function formulario(titulo,campos,okTxt){
  return new Promise(res=>{
    const w=janela(titulo);const f=document.createElement('form');
    f.innerHTML=campos.map(c=>{
      if(c.tipo==='aviso')return '<p class="hint">'+esc(c.texto)+'</p>';
      if(c.tipo==='select')return '<label>'+esc(c.rotulo)+'</label><select name="'+c.id+'">'+c.opcoes.map(o=>'<option value="'+esc(o.v)+'"'+(String(o.v)===String(c.valor)?' selected':'')+'>'+esc(o.t)+'</option>').join('')+'</select>';
      if(c.tipo==='checks')return '<label>'+esc(c.rotulo)+'</label>'+(c.opcoes.length?c.opcoes.map(o=>'<label class="chk"><input type="checkbox" name="'+c.id+'" value="'+esc(o.v)+'"'+((c.valor||[]).includes(o.v)?' checked':'')+'> '+esc(o.t)+'</label>').join(''):'<p class="hint">Nenhuma opção disponível.</p>');
      return '<label>'+esc(c.rotulo)+'</label><input name="'+c.id+'" type="'+(c.tipo||'text')+'" value="'+esc(c.valor??'')+'"'+(c.obrig?' required':'')+(c.tipo==='password'?' autocomplete="new-password" minlength="8"':'')+(c.ph?' placeholder="'+esc(c.ph)+'"':'')+'>';
    }).join('')+'<div class="bt"><button type="button" class="cancela">Cancelar</button><button class="pri" type="submit">'+esc(okTxt||'Guardar')+'</button></div>';
    w.corpo.appendChild(f);
    const p=f.querySelector('input:not([type=checkbox]),select');if(p)p.focus();
    f.querySelector('.cancela').onclick=()=>{w.fecha();res(null)};
    f.onsubmit=e=>{e.preventDefault();const v={};
      campos.forEach(c=>{if(c.tipo==='aviso')return;
        if(c.tipo==='checks')v[c.id]=[...f.querySelectorAll('input[name="'+c.id+'"]:checked')].map(x=>x.value);
        else v[c.id]=f.elements[c.id].value.trim()});
      w.fecha();res(v)};
  });
}

/* ---------- entrada ---------- */
function ecraEntrada(modo){
  modo=modo||'entrar';
  const titulos={entrar:'Entrar',criar:'Primeiro acesso',recuperar:'Recuperar palavra-passe'};
  $('#raiz').innerHTML='<div id="entrada"><form class="cx" id="fl"><div class="logo"><img src="logo-somafel.png" alt="SOMAFEL"><div><h1>Central de obras</h1><p class="sub">Somafel</p></div></div>'
   +'<p class="sub" style="margin-bottom:6px"><b>'+titulos[modo]+'</b></p>'
   +(modo==='criar'?'<label>Nome</label><input name="nome" required autocomplete="name">':'')
   +'<label>Email</label><input name="email" type="email" required autocomplete="username">'
   +(modo==='recuperar'?'':'<label>Palavra-passe</label><input name="pw" type="password" required minlength="8" autocomplete="'+(modo==='criar'?'new-password':'current-password')+'">')
   +'<div class="acoes"><button class="pri" type="submit">'+(modo==='entrar'?'Entrar':modo==='criar'?'Criar conta':'Enviar ligação')+'</button></div>'
   +'<div id="m"></div>'
   +(modo==='entrar'?'<button type="button" class="lnk" data-m="recuperar">Esqueci-me da palavra-passe</button>'
                    :'<button type="button" class="lnk" data-m="entrar">Voltar a entrar</button>')
   +'</form></div>';
  document.querySelectorAll('.lnk').forEach(b=>b.onclick=()=>ecraEntrada(b.dataset.m));
  const msg=(t,e)=>{$('#m').innerHTML='<div class="msg '+(e?'e':'o')+'">'+esc(t)+'</div>'};
  $('#fl').onsubmit=async ev=>{
    ev.preventDefault();const f=ev.target.elements;const bt=ev.target.querySelector('.pri');bt.disabled=true;
    try{
      if(modo==='entrar'){const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value});if(error)throw error;await arranca()}
      else if(modo==='criar'){const {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.pw.value,options:{data:{nome:f.nome.value.trim()}}});if(error)throw error;
        if(data.session)await arranca();else msg('Conta criada. Abre o email que recebeste e confirma o endereço; depois volta aqui e entra.')}
      else{const {error}=await sb.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;msg('Se o email existir, vais receber uma ligação para definir nova palavra-passe.')}
    }catch(e){let t=e.message||String(e);if(/Invalid login/i.test(t))t='Email ou palavra-passe incorretos.';else if(/Email not confirmed/i.test(t))t='Confirma primeiro o email (ligação que recebeste).';msg(t,true)}
    bt.disabled=false;
  };
}

/* ---------- arranque ---------- */
async function arranca(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ecraEntrada();return}
  const {data:eu,error}=await sb.from('pessoas').select('id,nome,papel,ativo,organizacao_id').eq('id',session.user.id).maybeSingle();
  if(error){$('#raiz').innerHTML='<div id="entrada"><div class="cx"><p>Não foi possível carregar o perfil.</p><div class="msg e">'+esc(error.message)+'</div><div class="acoes"><button id="sai">Sair</button></div></div></div>';$('#sai').onclick=sair;return}
  if(!eu||!eu.ativo){$('#raiz').innerHTML='<div id="entrada"><div class="cx"><div class="logo"><img src="logo-somafel.png" alt="SOMAFEL"><div><h1>Sem acesso</h1></div></div><p>A tua conta existe, mas ainda não foi associada a uma organização. Pede ao administrador para te dar acesso.</p><div class="acoes"><button id="sai">Sair</button></div></div></div>';$('#sai').onclick=sair;return}
  if(['equipa','convidado'].includes(eu.papel)){location.replace('obra.html');return}
  S.eu=eu;S.vista='obras';S.obra=null;
  if(gestor()){const b=await sb.from('bloqueios').select('chave,descricao');S.bloqLista=b.data||[];S.bloq=new Set(S.bloqLista.map(x=>x.chave))}
  preparar();casca();vai('obras');
}
/* aquece a cache: descarrega em segundo plano o HTML e os scripts das apps, para abrirem mais depressa */
/* ===== ecrã de arranque: prepara tudo (apps, base do catálogo, apps «sem obra») e só depois mostra a Central ===== */
let ULT=0;
function preparar(){
  if(window.__prep||!gestor())return;window.__prep=1;
  const el=document.createElement('div');el.id='splash';
  el.innerHTML='<img src="logo-somafel.png" alt="SOMAFEL"><div class="sb"><i></i></div><p id="spT">A preparar a Central…</p><button type="button" id="spX">Entrar já</button>';
  document.body.appendChild(el);
  let pct=0,fechado=false,fim;
  const barra=(p,t)=>{if(fechado)return;pct=Math.max(pct,p);el.querySelector('.sb i').style.width=pct+'%';if(t)el.querySelector('#spT').textContent=t};
  const fecha=()=>{if(fechado)return;fechado=true;barra(100);el.classList.add('fim');setTimeout(()=>el.remove(),450)};
  el.querySelector('#spX').onclick=fecha;
  const dorme=ms=>new Promise(r=>setTimeout(r,ms));
  const pronto=async(f,ms)=>{for(let i=0;i<ms/200&&!fechado;i++){try{const w=f.contentWindow,l=f.contentDocument&&f.contentDocument.getElementById('nmLogin');if(f.dataset.ok&&((l&&l.hidden)||(w.__on&&w.__on.ON&&w.__on.ON.pronto)))return true}catch(e){}await dorme(200)}return false};
  setTimeout(fecha,40000); /* nunca prende o utilizador */
  (async()=>{
    try{
      barra(4,'A preparar as aplicações…');
      const vistos=new Set(),ks=Object.keys(APPV);let n=0;
      await Promise.all(ks.map(async k=>{try{const t=await (await fetch(APPV[k]+'.html',{cache:'no-cache'})).text();
        for(const m of t.matchAll(/<script[^>]+src=["']([^"']+)["']/g)){const src=m[1];if(/^(https?:)?\/\//.test(src)||vistos.has(src))continue;vistos.add(src);fetch(src).catch(()=>{})}}catch(e){}
        barra(4+(++n/ks.length)*26)}));
      barra(32,'A abrir o catálogo…');
      try{await catCarrega()}catch(e){}
      barra(48);
      const NOMES={med:'Medição',rct:'Medição RCT',cons:'Dimensionamento CAT'};let i=0;
      for(const v of ['med','rct','cons']){
        if(fechado)break;barra(48+i*16,'A abrir '+NOMES[v]+'…');
        try{const f=frameApp({id:'livre'},v);await pronto(f,25000)}catch(e){}
        i++;barra(48+i*16)}
      barra(98,'Pronto');await dorme(150)
    }catch(e){console.error(e)}
    fecha()
  })()}
async function sair(){await sb.auth.signOut();S={eu:null,bloq:new Set(),bloqLista:[],obras:[],pessoas:[],vista:'obras',obra:null};ecraEntrada()}

async function catRctCarrega(){
  CAT.rct={a:true};catRender();
  try{
    const dir='_org/'+S.eu.organizacao_id+'/base_rct',l=await sb.storage.from('documentos').list(dir,{limit:50});if(l.error)throw l.error;
    const nomes={};(l.data||[]).forEach(x=>{if(x.id)nomes[x.name]=x});
    if(!nomes['Montagens_RCT.xlsx']){CAT.rct={m:[],des:[],img:{},sem:true};catRender();return}
    const ler=async n=>{const x=nomes[n];if(!x)return null;const stamp=n+'|'+(x.updated_at||x.created_at)+'|'+(x.metadata&&x.metadata.size||0),k='rctc:'+n,c=await cGet(k);
      if(c&&c.stamp===stamp&&c.org===S.eu.organizacao_id)return c.d;
      const r=await sb.storage.from('documentos').download(dir+'/'+n);if(r.error)throw r.error;
      const d=/\.json$/i.test(n)?JSON.parse(await r.data.text()):catRctXlsx(await r.data.arrayBuffer());cSet(k,{stamp,org:S.eu.organizacao_id,d});return d};
    await carregaXlsx();

    CAT.rct={m:m||[],img:img||{},des:des||[]};
  }catch(e){CAT.rct={m:[],des:[],img:{},erro:erroTxt(e)}}
  if(CAT.tab==='rct'&&S.vista==='desenhos')catRender()}
function catRctXlsx(buf){
  const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
  const nm=wb.SheetNames.find(n=>/tipos/i.test(n))||wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:null});
  let hr=rows.findIndex(r=>r&&String(r[1]||'').trim().toLowerCase()==='materiais');if(hr<0)return [];
  const tit=rows[hr-1]||[],cod=rows[hr],out=[];
  for(let c=2;c<cod.length;c++){const k=cod[c];if(k==null||String(k).trim()==='')continue;
    const mats=[];for(let r=hr+1;r<rows.length;r++){const q=rows[r]&&rows[r][c];if(q==null||q===''||isNaN(+String(q).replace(',','.')))continue;mats.push([String(rows[r][0]||'').trim(),String(rows[r][1]||'').trim(),+String(q).replace(',','.')])}
    out.push({c:String(k).trim(),t:String(tit[c]||'').trim(),mats})}
  return out}

async function editaContrato(obraId,c){

async function rubricas(c,fim){

function psAchaPessoa(pasta,pessoal){

  else if(/ne\+vt cat|ne vt cat/.test(n))tipo='NE+VT CAT';
  else if(/ne\+m cat/.test(n))tipo='NE+M CAT';
  else if(/^ne cat/.test(n))tipo='NE CAT';
  else if(/nivel ne|nau-curso|^ne certificado/.test(n))tipo='NE';
  else if(/(^|[^a-z0-9])sf2/.test(n))tipo='SF2';
  else if(/(^|[^a-z0-9])sf1/.test(n))tipo='SF1';
  else if(/^cvi/.test(n))tipo='CVI';
  else if(/^pvi/.test(n))tipo='PVI';

const ESQCAT={esq_eletricos:'eletrico',esq_sinalizacao:'sinalizacao'};
async function assocEsq(o,tipo,fim){
  let A,L;try{[A,L]=await Promise.all([ok(sb.from('obra_esquemas').select('esquema_id').eq('obra_id',o.id)),ok(sb.from('esquemas').select('id,tipo,nome,estacao,via,troco').eq('tipo',tipo).order('nome'))])}
  catch(e){aviso(erroTxt(e),true);return}
  const ids=new Set(A.map(x=>x.esquema_id)),sel=new Set(L.filter(x=>ids.has(x.id)).map(x=>x.id));let q='';
  const w=janela('Associar esquemas '+(tipo==='eletrico'?'elétricos':'de sinalização')+' a '+(o.nome||'esta obra'),true);
  const lista=()=>{const f=q.toLowerCase(),F=L.filter(x=>!f||(x.nome+' '+(x.estacao||'')+' '+(x.via||'')+' '+(x.troco||'')).toLowerCase().includes(f));
    return F.length?F.map(x=>'<label class="chk" style="display:flex;gap:8px;padding:3px 0"><input type="checkbox" data-e="'+x.id+'"'+(sel.has(x.id)?' checked':'')+'> <span>'+esc(x.nome)+(x.via||x.troco?' <span class="hint">· '+esc([x.via,x.troco].filter(Boolean).join(' · '))+'</span>':'')+'</span></label>').join(''):'<p class="hint">Nada na biblioteca.</p>'};
  const pinta=()=>{$('#eoL',w.corpo).innerHTML=lista();w.corpo.querySelectorAll('[data-e]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.e):sel.delete(c.dataset.e)})};
  w.corpo.innerHTML='<input type="search" id="eoQ" placeholder="Procurar" style="width:100%"><div id="eoL" style="max-height:55vh;overflow:auto;margin-top:8px"></div><div class="bt"><button id="eoC">Cancelar</button><button class="pri" id="eoS">Guardar</button></div>';
  pinta();$('#eoQ',w.corpo).oninput=e=>{q=e.target.value;pinta()};$('#eoC',w.corpo).onclick=w.fecha;
  $('#eoS',w.corpo).onclick=async()=>{const antes=new Set(L.filter(x=>ids.has(x.id)).map(x=>x.id)),novos=[...sel].filter(x=>!antes.has(x)),tirar=[...antes].filter(x=>!sel.has(x));
    try{if(novos.length)await ok(sb.from('obra_esquemas').insert(novos.map(x=>({obra_id:o.id,esquema_id:x}))));
      for(const x of tirar)await ok(sb.from('obra_esquemas').delete().eq('obra_id',o.id).eq('esquema_id',x));
      w.fecha();aviso('Esquemas da obra atualizados.');fim()}catch(e){aviso(erroTxt(e),true)}};
}

const TAB_EXP=['organizacoes','pessoas','obras','obra_pessoas','contratos','rubricas','estruturas','os_interdicoes','os_periodos','partes_diarias','parte_linhas','fotos','dados_apps','dados_copias','pessoal','precos_fornecedor','equipamentos','valencias','pessoal_valencias','tipos_certificado','certificados','bloqueios','historico'];
function carregaXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>rej(new Error('Não consegui carregar o gerador de Excel (sem rede?).'));document.head.appendChild(s)})}
async function tabelaTodas(t){const out=[];for(let i=0;;i+=1000){const r=await sb.from(t).select('*').range(i,i+999);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<1000)break}return out}
async function ficheirosBucket(b,prefixo,acc){
  const r=await sb.storage.from(b).list(prefixo,{limit:1000});if(r.error)throw r.error;
  for(const x of r.data){if(x.id)acc.push(prefixo+'/'+x.name);else await ficheirosBucket(b,prefixo?prefixo+'/'+x.name:x.name,acc)}return acc}
async function gravaFh(dir,caminho,dados){const ps=caminho.split('/');let d=dir;for(const p of ps.slice(0,-1))d=await d.getDirectoryHandle(p,{create:true});const fh=await d.getFileHandle(ps[ps.length-1],{create:true});const w=await fh.createWritable();await w.write(dados);await w.close()}
async function exportaTudo(comFicheiros){
  const st=$('#exs');const say=t=>{st.textContent=t};
  let dir=null;
  if(comFicheiros){if(!window.showDirectoryPicker){aviso('Para exportar fotos e documentos usa o Chrome ou o Edge no PC.',true);return}
    try{dir=await window.showDirectoryPicker({mode:'readwrite',id:'somafel-copia'})}catch(e){return}}
  try{
    await carregaXlsx();const dados={},wb=XLSX.utils.book_new();
    for(const t of TAB_EXP){say('A ler '+t+'…');try{dados[t]=await tabelaTodas(t)}catch(e){dados[t]={erro:erroTxt(e)};continue}
      const plano=dados[t].map(r=>{const o={};Object.entries(r).forEach(([k,v])=>{let x=(v&&typeof v==='object')?JSON.stringify(v):v;if(typeof x==='string'&&x.length>32000)x=x.slice(0,32000)+'… (ver dados.json)';o[k]=x});return o});
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(plano.length?plano:[{}]),t.slice(0,31))}
    const carimbo=new Date().toISOString().slice(0,16).replace(/[-:T]/g,''),json=JSON.stringify({exportado:new Date().toISOString(),versao:1,tabelas:dados},null,1);
    const xl=XLSX.write(wb,{bookType:'xlsx',type:'array'});

const PDFJS_V='3.11.174',PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/';
function carregaPdfJs(){return window.pdfjsLib?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFJS_URL+'pdf.min.js';s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_URL+'pdf.worker.min.js';res()};s.onerror=()=>rej(new Error('Não consegui carregar o leitor de PDF (sem rede?).'));document.head.appendChild(s)})}
async function textoPdf(buf){
  await carregaPdfJs();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const linhas=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent(),m=new Map();
    tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(m.get(y)||m.set(y,[]).get(y)).push({x:it.transform[4],t:it.str})});
    [...m.entries()].sort((a,b)=>b[0]-a[0]).forEach(([y,its])=>linhas.push(its.sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ').replace(/\s+/g,' ').trim()))}
  return linhas}
/* heurística: número da OS, semana e períodos (dia, hora de início e de fim, trabalhos a que se aplicam) */
function analisaOS(linhas,nomeFich){
  const txt=linhas.join('\n'),r={numero:'',semana:'',periodos:[]};
  let m=txt.match(/(?:ordem\s+de\s+servi[cç]o|\bO\.?S\.?)\s*(?:n[ºo°.]*\s*)?[:\-]?\s*(\d{3,6})/i)||String(nomeFich||'').match(/(?:OS|ordem[^0-9]*)\s*[_ -]?(\d{3,6})/i);
  if(m)r.numero=m[1];
  m=txt.match(/semana\s*(?:n[ºo°.]*)?\s*[:\-]?\s*(\d{4})\s*[\/\-]\s*(\d{1,2})/i);
  if(m)r.semana=m[1]+'/'+m[2];
  const dre=/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/,tre=/(\d{1,2})\s*[:hH.]\s*(\d{2})/g,vistos=new Set();
  let ano=null;
  linhas.forEach(l=>{
    const dm=l.match(dre);if(!dm)return;
    const sem=l.replace(dre,' ');const ts=[...sem.matchAll(tre)].filter(t=>+t[1]<24&&+t[2]<60);if(ts.length<2)return;
    const d=dm[3]+'-'+String(+dm[2]).padStart(2,'0')+'-'+String(+dm[1]).padStart(2,'0');
    const hi=String(+ts[0][1]).padStart(2,'0')+':'+ts[0][2],hf=String(+ts[1][1]).padStart(2,'0')+':'+ts[1][2];
    const resto=sem.replace(tre,' ');const trab=[...resto.matchAll(/\((\d{1,2})\)/g)].map(x=>x[1]);
    const k=d+hi+hf;if(vistos.has(k))return;vistos.add(k);
    r.periodos.push({dia:d,ini:hi,fim:hf,trab:trab.join(','),on:true})});
  if(!r.semana&&r.periodos.length){const d=new Date(r.periodos[0].dia+'T12:00:00');const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=t.getUTCFullYear();r.semana=y+'/'+Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}
  return r}
/* ficheiro de OS carregado nos documentos: lê o PDF e cria a OS e os períodos sozinho */
async function autoOS(o,file){
  if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf')return {};
  let a;try{a=analisaOS(await textoPdf(await file.arrayBuffer()),file.name)}catch(e){return {msg:file.name+': guardado, mas não consegui ler o PDF. Cria a OS à mão em «Ordens de serviço».',erro:1}}
  if(!a.numero)return {msg:file.name+': guardado, mas não encontrei o número da OS. Cria-a à mão em «Ordens de serviço».',erro:1};
  try{
    const ja=await ok(sb.from('os_interdicoes').select('id').eq('obra_id',o.id).eq('numero',a.numero));
    if(ja.length)return {numero:a.numero,msg:'OS '+a.numero+' já existia: o PDF ficou guardado e a OS não foi alterada.'};
    let ps=a.periodos.filter(p=>p.dia&&p.ini&&p.fim),meu='';
    const tr=[...new Set(ps.flatMap(p=>String(p.trab||'').split(/[,; ]+/).filter(Boolean)))].sort((x,y)=>x-y);
    if(tr.length){const v=await formulario('OS '+a.numero+': qual é o nosso trabalho?',[{id:'t',rotulo:'Nº do nosso trabalho (a OS tem: '+tr.join(', ')+')',ph:'ex.: '+tr[0]}],'Aplicar');
      meu=v&&v.t?String(v.t).trim():'';
      if(meu)ps=ps.filter(p=>!p.trab||String(p.trab).split(/[,; ]+/).includes(meu)).map(p=>Object.assign({},p,{trab:meu}))}
    const os=(await ok(sb.from('os_interdicoes').insert({obra_id:o.id,numero:a.numero,semana:a.semana||null}).select('id')))[0];
    if(ps.length)await ok(sb.from('os_periodos').insert(ps.map(p=>{const ini=new Date(p.dia+'T'+p.ini),fi=new Date(p.dia+'T'+p.fim);if(fi<=ini)fi.setDate(fi.getDate()+1);return {os_id:os.id,inicio:ini.toISOString(),fim:fi.toISOString(),trabalhos:p.trab||null}})));
    return {numero:a.numero,novo:1,msg:'OS '+a.numero+' criada com '+ps.length+' período'+(ps.length===1?'':'s')+(ps.length?(meu?' (só os do trabalho '+meu+')':'. Sem trabalho indicado, ficaram todos: apaga em «Períodos» os que não são nossos.'):'. Não encontrei períodos: escreve-os em «Períodos».'),erro:ps.length?0:1}
  }catch(e){return {msg:file.name+': guardado, mas a OS não foi criada ('+erroTxt(e)+').',erro:1}}
}

/* leitura completa de uma OS a partir dos itens de texto do PDF (x,y,t por página) */
function osCompleta(paginas){
  const linhas=[],itens=[];
  paginas.forEach((its,pi)=>{const m=new Map();
    its.forEach(it=>{itens.push({x:it.x,y:it.y-pi*10000,t:it.t});const y=Math.round(it.y/3);(m.get(y)||m.set(y,[]).get(y)).push(it)});
    [...m.entries()].sort((a,b)=>b[0]-a[0]).forEach(([y,l])=>linhas.push(l.sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ').replace(/\s+/g,' ').trim()))});
  const ix=re=>linhas.findIndex(l=>re.test(l));
  const sec=(a,b)=>{const i=ix(a);if(i<0)return [];let j=b?linhas.findIndex((l,k)=>k>i&&b.test(l)):-1;if(j<0)j=linhas.length;return linhas.slice(i+1,j)};
  const r={tipo:'',linha:'',interdicao:'',corte:'',aparelhos:[],postes:[],protTrans:'',agentes:[],chefe:[],notas:''};
  const tp=sec(/^TIPO DE TRABALHO/i,/^PER[ÍI]ODOS/i).filter(l=>/^-/.test(l));
  r.tipo=tp.map(l=>l.replace(/^-\s*/,'')).join(' ');
  const ln=sec(/^TIPO DE TRABALHO/i,/^PER[ÍI]ODOS/i).map(l=>l.match(/^\(\s*\d+\s*\)\s*(.+)$/)).find(Boolean);r.linha=ln?ln[1].trim():'';
  const ct=sec(/^CONDI[ÇC][ÕO]ES T[ÉE]CNICAS/i,/^TRO[ÇC]O/i).join(' ');
  ct.split(/(?=Interdi[çc][ãa]o d|Corte de tens)/i).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    if(/^Interdi/i.test(s))r.interdicao=s.replace(/\s*-\s+(?=[A-ZÇ]{2,})/g,'-');else if(/^Corte/i.test(s))r.corte=s});
  r.interdicao=r.interdicao.replace(/AMEAL-\s*SUL/g,'AMEAL-SUL');r.corte=r.corte.replace(/AMEAL-\s*SUL/g,'AMEAL-SUL');
  const ap=sec(/^APARELHOS DE CORTE/i,/^PROTE[ÇC][ÕO]ES/i).join(' ');
  ap.split(/;\s*|\.\s*$/).map(s=>s.trim().replace(/\.$/,'')).filter(Boolean).forEach(s=>{
    const par=[...s.matchAll(/\(([^)]*)\)/g)].map(m=>m[1]);
    r.postes.push(par.join(' / '));
    r.aparelhos.push(s.replace(/\s*\/\s*\([^)]*\)/g,'').replace(/\s+-\s+/g,' ').replace(/\s+/g,' ').trim())});
  const pr=sec(/^PROTE[ÇC][ÕO]ES/i,/^AGENTES/i),it=pr.findIndex(l=>/^Transversais/i.test(l));
  if(it>=0)r.protTrans=pr.slice(it+1).join(' ').replace(/^-\s*/,'').trim();
  const nt=sec(/^NOTAS/i,/^Preparou/i);r.notas=nt.join(' ').trim();
  /* tabelas por colunas */
  const tabela=(hdrRe,fimRe)=>{
    const h=itens.filter(i=>hdrRe.test(i.t));if(!h.length)return [];
    const hy=h[0].y;const cab=itens.filter(i=>Math.abs(i.y-hy)<4).sort((a,b)=>a.x-b.x);
    const fim=itens.filter(i=>fimRe.test(i.t)&&i.y<hy).sort((a,b)=>b.y-a.y)[0];const yfim=fim?fim.y:-1e9;
    const col=cab.map(c=>c.x),pri=cab.findIndex(c=>/Matr/i.test(c.t));
    const corpo=itens.filter(i=>i.y<hy-4&&i.y>yfim+ (fim?4:0)&&!/^(Nº Interno|Gerado|Página)/.test(i.t));
    const xi=i=>{let k=0;col.forEach((c,n)=>{if(i.x>=c-((col[n]-(col[n-1]||c))>0?(col[n]-(col[n-1]||c))*0.45:0))k=n});return k};
    const anc=corpo.filter(i=>xi(i)===pri&&/^(\d{5,8}|-)$/.test(i.t)).sort((a,b)=>b.y-a.y);
    const linhasT=anc.map(a=>({y:a.y,c:cab.map(()=>[])}));
    corpo.forEach(i=>{let bi=0,bd=1e9;anc.forEach((a,n)=>{const d=Math.abs(a.y-i.y);if(d<bd){bd=d;bi=n}});if(linhasT[bi])linhasT[bi].c[xi(i)].push(i)});
    return linhasT.map(l=>l.c.map(c=>c.sort((a,b)=>b.y-a.y||a.x-b.x).map(i=>i.t).join(' ').replace(/\s+/g,' ').trim())).map(c=>{const o={};cab.forEach((h,n)=>o[h.t.replace(/[^\wÀ-ÿ]/g,'')]=c[n]);return o})};
  r.agentes=tabela(/^Fun[çc][ãa]o$/i,/^Chefe dos Trabalhos/i).filter(a=>a.Nome&&!/Dire/.test(a['Função']||''));
  r.chefe=tabela(/^Trb$/i,/^Meios Ferrovi/i);
  return r}

/* preenche o modelo PDT (docx) célula a célula; d = dados de um dia */
const W_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main',XML_NS='http://www.w3.org/XML/1998/namespace';
function pdtXml(xml,d){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const tbl=doc.getElementsByTagNameNS(W_NS,'tbl')[0];
  const filhos=(n,nome)=>[...n.childNodes].filter(x=>x.localName===nome);
  const rows=()=>filhos(tbl,'tr'),cel=(r,c)=>filhos(rows()[r],'tc')[c];
  const setP=(p,txt,juntar)=>{
    txt=String(txt==null?'':txt);const ts=[...p.getElementsByTagNameNS(W_NS,'t')];
    const novoT=(r,s)=>{const t=doc.createElementNS(W_NS,'w:t');t.setAttributeNS(XML_NS,'xml:space','preserve');t.textContent=s;r.appendChild(t)};
    if(ts.length&&!juntar&&txt.indexOf('\n')<0){ts[0].textContent=txt;ts[0].setAttributeNS(XML_NS,'xml:space','preserve');ts.slice(1).forEach(t=>t.textContent='');return}
    if(!juntar)ts.forEach(t=>{t.textContent=''});
    if(!txt)return;
    const rs=[...p.getElementsByTagNameNS(W_NS,'r')];let src=rs[rs.length-1],rpr=src&&filhos(src,'rPr')[0];
    if(!rpr){const ppr=filhos(p,'pPr')[0];rpr=ppr&&filhos(ppr,'rPr')[0]}
    const r=doc.createElementNS(W_NS,'w:r');if(rpr)r.appendChild(rpr.cloneNode(true));
    txt.split('\n').forEach((s,i)=>{if(i)r.appendChild(doc.createElementNS(W_NS,'w:br'));novoT(r,s)});
    p.appendChild(r)};
  const set=(r,c,txt,n,juntar)=>{const t=cel(r,c);if(!t)return;const ps=filhos(t,'p');const p=ps[n==null?0:(n<0?ps.length+n:n)];if(p)setP(p,txt,juntar)};
  const limpa=tr=>{[...tr.getElementsByTagNameNS(W_NS,'t')].forEach(t=>t.textContent='')};
  const grupo=(ini,fim,lista,preenche)=>{ /* linhas ini..fim; clona a última se faltarem */
    const n=fim-ini+1;for(let k=n;k<lista.length;k++){const base=rows()[fim],cl=base.cloneNode(true);limpa(cl);base.parentNode.insertBefore(cl,base.nextSibling);fim++}
    for(let k=0;k<=fim-ini;k++){const r=ini+k;if(k<lista.length)preenche(r,lista[k],k);else rows()[r]&&[...rows()[r].getElementsByTagNameNS(W_NS,'t')].forEach(t=>{if(t.textContent==='…')t.textContent=''})}};
  const L=(a,i)=>(a&&a[i])||'';
  /* de baixo para cima: as linhas clonadas não alteram os índices de cima */
  set(53,0,'',0); /* assinaturas ficam em branco */
  set(50,0,d.contactos||'',0);
  set(48,0,d.coord||'',0);
  grupo(43,45,d.scpvi||[],(r,v,k)=>{set(r,0,L(v,0)||String(k+1));set(r,1,L(v,1));set(r,2,L(v,2));set(r,3,L(v,3))});
  grupo(37,40,d.maquinas||[],(r,v)=>{for(let c=0;c<9;c++)set(r,c,L(v,c))});
  grupo(31,32,d.pessoal||[],(r,v)=>{for(let c=0;c<4;c++)set(r,c,L(v,c))});
  grupo(23,26,d.terra||[],(r,v)=>{for(let c=0;c<3;c++)set(r,c,L(v,c))});
  set(21,1,d.protTrans||'',0);
  for(let c=0;c<8;c++){set(19,c+1,L(d.aparelhos,c));set(20,c+1,L(d.postes,c))}
  [15,16].forEach((r,k)=>{const v=(d.lim||[])[k];if(v)set(r,1,'Estação: '+L(v,0)+'    Linha: '+L(v,1)+'    Via: '+L(v,2)+'    Sinal: '+L(v,3)+'    km: '+L(v,4),0)});
  grupo(9,10,d.frentes||[],(r,v,k)=>{set(r,0,'FT '+(k+1));set(r,1,L(v,0));set(r,2,L(v,1))});
  set(6,1,d.ms2||'',0);set(5,1,d.ms1||'',0);
  set(4,4,d.per2||'',0);set(3,4,d.per1||'',0);set(4,1,d.entidade||'',0);set(3,1,d.trabalho||'',0);
  set(1,2,d.data||'',1);set(1,1,'Semana '+(d.semana||'')+' / '+(d.ano||''),1);
  set(1,1,d.os||'',0,true);
  return new XMLSerializer().serializeToString(doc)}

async function lerOS(o,file,fim){
  let linhas;
  try{linhas=await textoPdf(await file.arrayBuffer())}catch(e){aviso(erroTxt(e),true);return}
  const a=analisaOS(linhas,file.name);
  const w=janela('Ler OS · '+file.name,true);
  const desenha=()=>{w.corpo.innerHTML='<p class="hint">Confirma o que a app encontrou no PDF. Só se guardam o número, a semana e os períodos; o resto fica no PDF, que é anexado à obra. Corrige o que estiver errado.</p>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><label>Número da OS</label><input id="on" value="'+esc(a.numero)+'"></div><div><label>Semana</label><input id="os" value="'+esc(a.semana)+'" placeholder="2026/39"></div><div><label>Nº do nosso trabalho</label><input id="ot" placeholder="ex.: 3"></div></div>'
    +'<p class="hint" style="margin:8px 0 4px">Se indicares o nosso trabalho, ficam só os períodos em que ele aparece (quando o PDF os indica).</p>'
    +(a.periodos.length?'<table><thead><tr><th></th><th>Dia</th><th>Início</th><th>Fim</th><th>Trabalhos</th></tr></thead><tbody>'+a.periodos.map((p,i)=>'<tr><td><input type="checkbox" data-c="'+i+'" '+(p.on?'checked':'')+'></td><td><input type="date" data-d="'+i+'" value="'+p.dia+'"></td><td><input type="time" data-i="'+i+'" value="'+p.ini+'"></td><td><input type="time" data-f="'+i+'" value="'+p.fim+'"></td><td><input data-t="'+i+'" value="'+esc(p.trab)+'" style="width:80px"></td></tr>').join('')+'</tbody></table>'
      :'<div class="msg e">Não encontrei períodos neste PDF. Podes criar a OS e escrever os períodos à mão.</div>')
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="x1">Cancelar</button><button class="pri" id="x2">Criar OS</button></div>'};
  desenha();
  const le=()=>{a.periodos.forEach((p,i)=>{const g=s=>w.corpo.querySelector('['+s+'="'+i+'"]');p.on=g('data-c').checked;p.dia=g('data-d').value;p.ini=g('data-i').value;p.fim=g('data-f').value;p.trab=g('data-t').value.trim()})};
  $('#x1',w.corpo).onclick=w.fecha;
  $('#x2',w.corpo).onclick=async()=>{
    if(a.periodos.length)le();const num=$('#on',w.corpo).value.trim(),sem=$('#os',w.corpo).value.trim(),meu=$('#ot',w.corpo).value.trim();
    if(!num){aviso('Falta o número da OS.',true);return}
    let ps=a.periodos.filter(p=>p.on&&p.dia&&p.ini&&p.fim);
    if(meu)ps=ps.filter(p=>!p.trab||p.trab.split(/[,; ]+/).includes(meu));
    try{
      const os=(await ok(sb.from('os_interdicoes').insert({obra_id:o.id,numero:num,semana:sem||null}).select('id')))[0];
      if(ps.length)await ok(sb.from('os_periodos').insert(ps.map(p=>{const ini=new Date(p.dia+'T'+p.ini),fi=new Date(p.dia+'T'+p.fim);if(fi<=ini)fi.setDate(fi.getDate()+1);return {os_id:os.id,inicio:ini.toISOString(),fim:fi.toISOString(),trabalhos:meu||p.trab||null}})));
      const up=await sb.storage.from('documentos').upload(o.id+'/os/'+crypto.randomUUID().slice(0,8)+'__'+nomeSeguro(file.name),file,{contentType:'application/pdf'});
      if(up.error)aviso('OS criada, mas o PDF não foi anexado: '+erroTxt(up.error),true);else aviso('OS '+num+' criada com '+ps.length+' período'+(ps.length===1?'':'s')+'.');
      w.fecha();fim()}catch(e){aviso(erroTxt(e),true)}};
}

async function periodosOS(x,fim){
  const w=janela('Períodos · OS '+x.numero,true);
  async function desenha(){
    let l=[];try{l=await ok(sb.from('os_periodos').select('*').eq('os_id',x.id).order('inicio'))}catch(e){w.corpo.innerHTML='<div class="msg e">'+esc(erroTxt(e))+'</div>';return}
    w.corpo.innerHTML=(l.length?'<table><thead><tr><th>Início</th><th>Fim</th><th>Trabalhos</th><th></th></tr></thead><tbody>'+l.map(p=>'<tr><td>'+fmtDH(p.inicio)+'</td><td>'+fmtDH(p.fim)+'</td><td>'+esc(p.trabalhos||'')+'</td><td class="ac"><button class="x" data-d="'+p.id+'">×</button></td></tr>').join('')+'</tbody></table>':'<p class="hint">Sem períodos ainda. Um período que passa da meia-noite é só um início e um fim.</p>')
      +'<form id="fp" style="display:grid;grid-template-columns:1fr 1fr 90px auto;gap:8px;margin-top:14px;align-items:end"><div><label>Início</label><input type="datetime-local" name="i" required></div><div><label>Fim</label><input type="datetime-local" name="f" required></div><div><label>Trabalhos</label><input name="t" placeholder="ex.: 3"></div><button class="pri">Adicionar</button></form><div class="bt"><button id="fx">Fechar</button></div>';
    $('#fx',w.corpo).onclick=()=>{w.fecha();fim()};
    w.corpo.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{try{await ok(sb.from('os_periodos').delete().eq('id',b.dataset.d));desenha()}catch(e){aviso(erroTxt(e),true)}});
    $('#fp',w.corpo).onsubmit=async ev=>{ev.preventDefault();const f=ev.target.elements;
      if(new Date(f.f.value)<=new Date(f.i.value)){aviso('O fim tem de ser depois do início.',true);return}
      try{await ok(sb.from('os_periodos').insert({os_id:x.id,inicio:new Date(f.i.value).toISOString(),fim:new Date(f.f.value).toISOString(),trabalhos:f.t.value.trim()||null}));desenha()}catch(e){aviso(erroTxt(e),true)}};
  }
  desenha();
}

async function verParte(p,o,fim){
  const w=janela('Parte de '+fmtData(p.data)+' · '+(p.autor?p.autor.nome:''),true);
  const L=p.parte_linhas||[];const est=L.filter(l=>l.tipo==='estrutura').map(l=>l.estrutura);
  const mat=L.filter(l=>l.tipo==='material_avulso'),sr=L.filter(l=>l.tipo==='sem_rubrica');
  const fotos=(p.fotos||[]);
  let urls={};
  if(fotos.length){try{const r=await sb.storage.from('fotos').createSignedUrls(fotos.map(f=>f.caminho),3600);(r.data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}catch(e){}}
  const e=ESTADO[p.estado]||[p.estado,''];
  const podeDecidir=['enviada','em_validacao'].includes(p.estado);
  w.corpo.innerHTML='<p><span class="pill '+e[1]+'">'+e[0]+'</span> <span class="hint">registada '+fmtDH(p.hora_registo)+'</span></p>'
   +'<p><b>Trabalho:</b> '+esc(p.trabalho||'—')+'</p>'
   +'<p><b>Estruturas:</b> '+(est.length?est.map(x=>'<span class="ccchip">'+esc(x)+'</span>').join(' '):'—')+'</p>'
   +(mat.length?'<p><b>Material avulso:</b> '+mat.map(m=>esc(m.descricao)+(m.quantidade!=null?' × '+m.quantidade:'')).join('; ')+'</p>':'')
   +(sr.length?'<p><b>Trabalhos sem rubrica:</b> '+sr.map(m=>esc(m.descricao)).join('; ')+'</p>':'')
   +(p.observacoes?'<p><b>Observações:</b> '+esc(p.observacoes)+'</p>':'')
   +(p.comentario?'<p><b>Comentário da validação:</b> '+esc(p.comentario)+'</p>':'')
   +'<div class="sec" style="margin-top:14px">Fotos ('+fotos.length+')</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">'
   +fotos.map(f=>'<div style="position:relative;'+(f.ignorada?'opacity:.35':'')+'">'+(urls[f.caminho]?'<a href="'+esc(urls[f.caminho])+'" target="_blank" rel="noopener"><img src="'+esc(urls[f.caminho])+'" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block"></a>':'<div class="hint">(sem pré-visualização)</div>')+'<label class="hint" style="display:flex;gap:6px;align-items:center;margin:4px 0 0"><input type="checkbox" data-ig="'+f.id+'"'+(f.ignorada?' checked':'')+'> a ignorar</label></div>').join('')+'</div>'
   +(podeDecidir?'<label>Comentário (opcional, aparece se devolveres)</label><input id="cm">':'')
   +'<div class="bt"><button id="fx">Fechar</button>'+(podeDecidir?'<button class="perigo" id="dv">Devolver</button><button id="vd">Só validar</button>'+(est.length&&pode('app:medicao')?'<button class="pri" id="vm">Validar e marcar na Medição</button>':''):'')+'</div>';
  const sai=()=>{w.fecha();fim()};
  $('#fx',w.corpo).onclick=sai;
  w.corpo.querySelectorAll('[data-ig]').forEach(c=>c.onchange=async()=>{try{await ok(sb.from('fotos').update({ignorada:c.checked}).eq('id',c.dataset.ig));c.closest('div').style.opacity=c.checked?'.35':'1'}catch(er){aviso(erroTxt(er),true);c.checked=!c.checked}});
  const decide=async (estado,quieto)=>{try{await ok(sb.from('partes_diarias').update({estado,comentario:($('#cm',w.corpo).value||'').trim()||null,validada_por:S.eu.id,validada_em:new Date().toISOString()}).eq('id',p.id));if(!quieto)aviso(estado==='validada'?'Parte validada.':'Parte devolvida.');sai()}catch(er){aviso(erroTxt(er),true)}};
  const vm=$('#vm',w.corpo);if(vm)vm.onclick=async()=>{vm.disabled=true;vm.textContent='A abrir a Medição…';
    try{const m=await janelaApp('med');if(!m||!m.nmLigacao)throw new Error('A Medição desta obra não abriu. Tente outra vez.');
      const r=m.nmLigacao.executa(est,p.data);try{await m.__nm.nmAuto();await new Promise(z=>setTimeout(z,1200))}catch(e){}
      await decide('validada',true);
      aviso('Marcadas '+r.marcadas.length+' estruturas'+(r.jaFeitas.length?'; '+r.jaFeitas.length+' já estavam feitas':'')+(r.naoExiste.length?'; não existem na Medição: '+r.naoExiste.join(', '):'')+'.')}
    catch(er){aviso(erroTxt(er),true);vm.disabled=false;vm.textContent='Validar e marcar na Medição'}};
  if(podeDecidir){$('#vd',w.corpo).onclick=()=>decide('validada');$('#dv',w.corpo).onclick=()=>decide('devolvida')}
}

/* copiar as fotos para uma pasta do PC (ex.: dentro do OneDrive) */
async function copiaFotos(o){
  if(!window.showDirectoryPicker){aviso('Este navegador não deixa escolher pastas. Usa o Chrome ou o Edge no PC.',true);return}
  let dir;
  try{dir=S.pastaFotos||(S.pastaFotos=await window.showDirectoryPicker({mode:'readwrite',id:'somafel-fotos'}))}catch(e){return}
  let lista;
  try{lista=await ok(sb.from('fotos').select('id,caminho,partes_diarias!inner(id,obra_id,data)').eq('copiada_onedrive',false).eq('ignorada',false).eq('partes_diarias.obra_id',o.id))}
  catch(e){aviso(erroTxt(e),true);return}
  if(!lista.length){aviso('Não há fotos novas para copiar.');return}
  aviso('A copiar '+lista.length+' foto'+(lista.length===1?'':'s')+'…');
  let n=0,falhas=0;
  for(const f of lista){
    try{
      const {data,error}=await sb.storage.from('fotos').download(f.caminho);if(error)throw error;
      let d=dir;for(const parte of [o.centro_custo,'Partes diarias',f.partes_diarias.data])d=await d.getDirectoryHandle(parte,{create:true});
      const nome=f.partes_diarias.id.slice(0,8)+'_'+f.id.slice(0,8)+'.jpg';
      const fh=await d.getFileHandle(nome,{create:true});const wr=await fh.createWritable();await wr.write(data);await wr.close();
      await ok(sb.from('fotos').update({copiada_onedrive:true}).eq('id',f.id));n++;
    }catch(e){falhas++;console.warn('copia',e)}
  }
  aviso(n+' foto'+(n===1?'':'s')+' copiada'+(n===1?'':'s')+(falhas?' · '+falhas+' falharam':'')+'.',falhas>0);
}
